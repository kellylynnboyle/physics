<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Momentum Quiz — Most Often Missed Questions</title>
<style>
  :root{
    --bg:#f7f8fb; --card:#ffffff; --ink:#1c1f26; --muted:#5b6270;
    --accent:#2954d6; --good:#1a8a4a; --bad:#c62839; --border:#e2e5ec;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--ink);padding:24px 16px 60px;}
  .wrap{max-width:720px;margin:0 auto;}
  h1{font-size:1.5rem;margin-bottom:4px;}
  .sub{color:var(--muted);margin-bottom:24px;font-size:.95rem;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;
        padding:20px;margin-bottom:16px;}
  .qnum{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
  .qtext{font-size:1.05rem;margin-bottom:14px;line-height:1.45;}
  .choice{display:block;width:100%;text-align:left;padding:10px 14px;margin-bottom:8px;
          border:1px solid var(--border);border-radius:8px;background:#fafbfd;cursor:pointer;
          font-size:.97rem;color:var(--ink);}
  .choice:hover{border-color:var(--accent);}
  .choice.correct{border-color:var(--good);background:#e9f7ef;}
  .choice.incorrect{border-color:var(--bad);background:#fbeaec;}
  .choice[disabled]{cursor:default;}
  .explain{display:none;margin-top:10px;padding:10px 12px;border-radius:8px;
           background:#eef1f8;font-size:.92rem;line-height:1.45;}
  .explain.show{display:block;}
  .footer{position:sticky;bottom:0;background:var(--bg);padding-top:12px;}
  .scorebox{background:var(--card);border:1px solid var(--border);border-radius:12px;
            padding:20px;text-align:center;}
  .scorebox h2{margin:0 0 8px;}
  button.primary{background:var(--accent);color:#fff;border:none;border-radius:8px;
                  padding:10px 18px;font-size:.95rem;cursor:pointer;}
  button.primary:disabled{opacity:.4;cursor:not-allowed;}
  .progress{font-size:.85rem;color:var(--muted);margin-bottom:16px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Momentum — Interactive Quiz</h1>
  <p class="sub">10 questions targeting the mistakes students make most often on this topic. Pick an answer to see immediate feedback and an explanation.</p>
  <div class="progress" id="progress"></div>
  <div id="quiz"></div>
  <div class="footer">
    <div class="scorebox" id="scorebox" style="display:none;">
      <h2 id="scoreText"></h2>
      <p id="scoreMsg" style="color:var(--muted);"></p>
      <button class="primary" onclick="location.reload()">Retake Quiz</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    q: "Two carts collide and stick together. Is total kinetic energy conserved in this collision?",
    choices: ["Yes, kinetic energy is always conserved along with momentum", "No — only momentum is conserved; this is a perfectly inelastic collision, and KE is lost to heat/deformation", "Only if the carts have equal mass", "Only if they were moving at the same speed before colliding"],
    correct: 1,
    explain: "This is the most common momentum-unit error: assuming momentum and kinetic energy are ALWAYS both conserved. They're only both conserved in ELASTIC collisions. When objects stick together (perfectly inelastic), momentum is conserved but kinetic energy is not — it converts to heat, sound, and deformation."
  },
  {
    q: "A bowling ball (heavy, slow) and a tennis ball (light, fast) are moving toward you. Which necessarily has more momentum?",
    choices: ["The bowling ball, because momentum depends mainly on mass", "The tennis ball, because momentum depends mainly on speed", "It depends on both the specific mass AND velocity — you must calculate mv for each", "They always have equal momentum"],
    correct: 2,
    explain: "Momentum is p = mv — it depends on BOTH mass and velocity, and neither factor dominates by default. Students often default to 'heavier = more momentum' without checking velocity, but a very fast light object can easily have more momentum than a slow heavy one."
  },
  {
    q: "Is momentum conserved during a collision between two billiard balls on a table (ignoring friction)?",
    choices: ["No, because forces are involved during the collision", "Yes, because the two balls form an isolated system with no significant net EXTERNAL horizontal force during the brief collision", "Only if the collision is elastic", "Momentum conservation doesn't apply to collisions, only explosions"],
    correct: 1,
    explain: "Conservation of momentum applies to an ISOLATED SYSTEM — no net external force. The internal forces the balls exert ON EACH OTHER during collision don't violate this; by Newton's third law those internal forces are equal/opposite and cancel out of the system's total momentum change. It applies to BOTH elastic and inelastic collisions, not just elastic ones."
  },
  {
    q: "In a perfectly inelastic collision between a moving object and a stationary one, what happens to the objects?",
    choices: ["They bounce apart with the same total speed", "They stick together and move with one common final velocity", "The moving object stops completely and the stationary one takes all the speed", "Perfectly inelastic collisions only happen with equal masses"],
    correct: 1,
    explain: "'Perfectly inelastic' specifically means the objects stick together after impact and share one final velocity — found using m₁v₁ + m₂v₂ = (m₁+m₂)v_f. A common error is thinking the moving object simply stops and 'hands off' all its velocity to the other object, which is only true in specific special cases (not generally, and not for unequal masses)."
  },
  {
    q: "A cannon fires a cannonball forward. Using momentum conservation, what happens to the cannon?",
    choices: ["Nothing — only the cannonball has momentum", "It recoils backward, since total momentum of the (cannon+ball) system must remain zero (its initial value, both at rest)", "It moves forward with the cannonball", "It depends on the cannon's material"],
    correct: 1,
    explain: "Before firing, total system momentum is zero (both at rest). After firing, the cannonball has forward momentum, so the cannon MUST have equal-magnitude backward momentum for the total to still equal zero — this is 'recoil,' and it's conservation of momentum applied to an 'explosion' rather than a collision."
  },
  {
    q: "What does the impulse-momentum theorem (J = Δp = FΔt) tell you about a car crash with and without an airbag, given the same change in the passenger's momentum?",
    choices: [
      "The airbag reduces the passenger's change in momentum",
      "The airbag increases the collision time, which reduces the average FORCE experienced, since Δp is fixed but Δt is longer",
      "The airbag has no effect on the force experienced, only on comfort",
      "The airbag increases the force to stop the passenger faster"
    ],
    correct: 1,
    explain: "The passenger's momentum change (Δp) is essentially fixed by their mass and the crash's speed change — the airbag doesn't change that. What it changes is Δt: by extending the time over which the stop happens, it reduces the average force F = Δp/Δt needed to produce that same momentum change, which is what actually causes injury."
  },
  {
    q: "A 0.5 kg ball moving at 6 m/s hits an identical stationary 0.5 kg ball in a perfectly elastic head-on collision. What happens?",
    choices: [
      "Both balls move off together at 3 m/s each",
      "The moving ball stops, and the stationary ball moves off at 6 m/s — velocities are fully exchanged",
      "The moving ball bounces straight back at 6 m/s",
      "Nothing changes because the balls have equal mass"
    ],
    correct: 1,
    explain: "This is a special, memorable result: in a 1-D elastic collision between EQUAL masses, the objects fully exchange velocities. Students often default to the perfectly-inelastic answer ('they move together') even when the problem specifies an elastic collision — the two collision types have very different outcomes and must not be conflated."
  },
  {
    q: "Momentum is a vector. In a 1-D problem with two objects moving toward each other from opposite directions, what's the most common setup error?",
    choices: [
      "Forgetting to square the velocities",
      "Not assigning one direction as positive and the other as negative before writing the conservation equation",
      "Using different masses for each object",
      "Converting units to kg and m/s"
    ],
    correct: 1,
    explain: "Because momentum is a vector, one object's velocity must be entered as NEGATIVE in the conservation equation if it moves opposite to your chosen positive direction. Treating both initial velocities as positive numbers when the objects approach each other head-on is one of the most frequent algebra-setup mistakes in this topic."
  },
  {
    q: "A skater standing still on frictionless ice throws a heavy bag away from themselves. What happens to the skater?",
    choices: [
      "Nothing, since the skater never touched anything else",
      "The skater recoils in the opposite direction to the thrown bag, so total system momentum stays zero",
      "The skater moves in the SAME direction as the bag",
      "The skater's mass changes, so momentum isn't conserved"
    ],
    correct: 1,
    explain: "Same recoil principle as the cannon example: the skater+bag system starts at zero total momentum. Once the bag is thrown one way, the skater must move the opposite way so the vector sum of the skater's momentum and the bag's momentum stays zero."
  },
  {
    q: "Which quantity is ALWAYS conserved in a collision within an isolated system, regardless of whether the collision is elastic or inelastic?",
    choices: ["Kinetic energy", "Momentum", "Speed of each individual object", "Both momentum and kinetic energy equally"],
    correct: 1,
    explain: "Momentum conservation holds for ANY collision (elastic or inelastic) as long as the system is isolated. Kinetic energy conservation is the special, additional condition that only holds for elastic collisions — this distinction is the single most tested idea in this unit."
  }
];

let current = 0, score = 0;
const quizEl = document.getElementById('quiz');
const progressEl = document.getElementById('progress');

function render() {
  if (current >= QUESTIONS.length) {
    quizEl.innerHTML = '';
    const box = document.getElementById('scorebox');
    box.style.display = 'block';
    const pct = Math.round((score / QUESTIONS.length) * 100);
    document.getElementById('scoreText').textContent = `Score: ${score} / ${QUESTIONS.length} (${pct}%)`;
    document.getElementById('scoreMsg').textContent = pct >= 80
      ? "Nice work — you've hit the mastery bar for this topic. Log this score in PROGRESS_TRACKER.md."
      : "Review the explanations above and revisit cornell-notes.md before retaking — 80% is the mastery target.";
    progressEl.textContent = '';
    return;
  }
  progressEl.textContent = `Question ${current + 1} of ${QUESTIONS.length} · Score so far: ${score}`;
  const item = QUESTIONS[current];
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="qnum">Question ${current + 1}</div>
    <div class="qtext">${item.q}</div>
    <div class="choices"></div>
    <div class="explain" id="explain"></div>
  `;
  const choicesEl = card.querySelector('.choices');
  item.choices.forEach((choice, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = choice;
    btn.onclick = () => selectAnswer(i, item, card);
    choicesEl.appendChild(btn);
  });
  quizEl.innerHTML = '';
  quizEl.appendChild(card);
}

function selectAnswer(i, item, card) {
  const buttons = card.querySelectorAll('.choice');
  buttons.forEach((b, idx) => {
    b.disabled = true;
    if (idx === item.correct) b.classList.add('correct');
    else if (idx === i) b.classList.add('incorrect');
  });
  if (i === item.correct) score++;
  const explainEl = card.querySelector('#explain');
  explainEl.textContent = item.explain;
  explainEl.classList.add('show');
  const nextBtn = document.createElement('button');
  nextBtn.className = 'primary';
  nextBtn.style.marginTop = '14px';
  nextBtn.textContent = current === QUESTIONS.length - 1 ? 'See Score' : 'Next Question';
  nextBtn.onclick = () => { current++; render(); };
  card.appendChild(nextBtn);
}

render();
</script>
</body>
</html>
