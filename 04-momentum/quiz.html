<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Momentum Quiz — Most Missed Questions</title>
<style>
  :root {
    --bg: #f4f6f9;
    --card: #ffffff;
    --ink: #1c2733;
    --muted: #5b6b7b;
    --accent: #2b5fad;
    --accent-ink: #ffffff;
    --correct: #1e8e3e;
    --correct-bg: #e6f4ea;
    --incorrect: #c5221f;
    --incorrect-bg: #fce8e6;
    --border: #dde3ea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    padding: 24px 16px 64px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  header { margin-bottom: 20px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 0.95rem; }
  .progress-bar {
    height: 8px; background: var(--border); border-radius: 999px; overflow: hidden; margin-top: 14px;
  }
  .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width .25s ease; }
  .progress-label { font-size: 0.85rem; color: var(--muted); margin-top: 6px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .qtag {
    display: inline-block; font-size: 0.75rem; font-weight: 600; letter-spacing: .03em;
    color: var(--accent); text-transform: uppercase; margin-bottom: 8px;
  }
  .qtext { font-size: 1.05rem; font-weight: 600; margin-bottom: 14px; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option {
    display: flex; align-items: flex-start; gap: 10px;
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
    cursor: pointer; background: #fbfcfd; transition: border-color .15s ease, background .15s ease;
  }
  .option:hover { border-color: var(--accent); }
  .option input { margin-top: 3px; }
  .option.correct { border-color: var(--correct); background: var(--correct-bg); }
  .option.incorrect { border-color: var(--incorrect); background: var(--incorrect-bg); }
  .option.disabled { cursor: default; }

  .explain {
    margin-top: 14px; padding: 12px 14px; border-radius: 8px;
    font-size: 0.95rem; display: none;
  }
  .explain.show { display: block; }
  .explain.correct-box { background: var(--correct-bg); color: #14532d; }
  .explain.incorrect-box { background: var(--incorrect-bg); color: #7a1a17; }

  .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
  button {
    font: inherit; font-weight: 600; border: none; border-radius: 8px;
    padding: 10px 18px; cursor: pointer; background: var(--accent); color: var(--accent-ink);
  }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }

  .summary { text-align: center; }
  .score-big { font-size: 2.6rem; font-weight: 700; margin: 8px 0; }
  .score-note { color: var(--muted); margin-bottom: 20px; }
  .review-item { text-align: left; padding: 12px 0; border-top: 1px solid var(--border); }
  .review-item:first-child { border-top: none; }
  .review-item .qtext { font-size: 0.98rem; }
  .badge-pass { color: var(--correct); font-weight: 700; }
  .badge-fail { color: var(--incorrect); font-weight: 700; }
  .hidden { display: none !important; }
  footer { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 24px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Momentum — Most Missed Questions</h1>
    <div class="sub">10 questions targeting the mistakes students make most often on this unit. Pick the best answer, then check it — every question explains the reasoning either way.</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">Question 1 of 10</div>
  </header>

  <div id="quizArea"></div>

  <div id="summaryArea" class="card summary hidden">
    <div class="qtag">Results</div>
    <div class="score-big" id="scoreBig"></div>
    <div class="score-note" id="scoreNote"></div>
    <div id="reviewList"></div>
    <div class="actions" style="justify-content:center; margin-top:20px;">
      <button class="secondary" id="retakeBtn">Retake Quiz</button>
    </div>
  </div>

  <footer>Standalone file — works offline, no data leaves this page.</footer>
</div>

<script>
const QUESTIONS = [
  {
    tag: "Momentum as a vector",
    text: "A 2.0 kg cart moves at +3.0 m/s and a 2.0 kg cart moves at −3.0 m/s (opposite direction, same speed). What is their total momentum?",
    options: [
      "12 kg·m/s, since you add the magnitudes of both momenta",
      "0 kg·m/s, since the momenta are equal in magnitude but opposite in direction",
      "6 kg·m/s, the average of the two momenta",
      "It cannot be determined without knowing which cart is \"first\""
    ],
    correct: 1,
    explain: "Momentum is a vector: p = mv. Each cart has momentum of magnitude 6.0 kg·m/s, but one is +6.0 kg·m/s and the other is −6.0 kg·m/s. Adding them as vectors (with sign) gives 0, not 12. Treating momentum as a scalar and just adding magnitudes is one of the most common errors in this unit."
  },
  {
    tag: "Isolated system",
    text: "Two carts collide on a track and one student says, \"Cart A's momentum is conserved during the collision.\" What's wrong with that statement?",
    options: [
      "Nothing — momentum conservation applies to each object individually.",
      "Conservation of momentum applies to the TOTAL momentum of the isolated system (both carts together), not to a single object, which can gain or lose momentum during the collision.",
      "Momentum is never conserved in real collisions.",
      "Cart A's kinetic energy is conserved instead, not its momentum."
    ],
    correct: 1,
    explain: "Conservation of momentum is a statement about an isolated system — no net external force acting on it. Inside that system, objects exchange momentum with each other through internal (contact) forces, so any single object's momentum can and usually does change during a collision. It's the SUM of all momenta in the system that stays constant, not each piece separately."
  },
  {
    tag: "Elastic vs. inelastic",
    text: "In an elastic collision, which of the following is true?",
    options: [
      "Only kinetic energy is conserved; momentum is not.",
      "Only momentum is conserved; kinetic energy is not.",
      "Both momentum and kinetic energy are conserved.",
      "Neither momentum nor kinetic energy is conserved."
    ],
    correct: 2,
    explain: "Elastic collisions conserve BOTH total momentum and total kinetic energy — nothing is lost to heat, sound, or permanent deformation. Momentum is conserved in essentially all collisions in an isolated system (elastic or not); what makes a collision \"elastic\" specifically is that kinetic energy also comes out unchanged."
  },
  {
    tag: "Perfectly inelastic",
    text: "Two lumps of clay collide head-on and stick together, moving off with one shared final velocity. What kind of collision is this, and what happened to the kinetic energy?",
    options: [
      "Elastic collision; kinetic energy is fully conserved.",
      "Perfectly inelastic collision; some kinetic energy converted to heat, sound, and deformation, even though momentum was conserved.",
      "Perfectly inelastic collision; momentum was NOT conserved, only kinetic energy was.",
      "This cannot be analyzed with momentum conservation because the objects merge."
    ],
    correct: 1,
    explain: "Objects sticking together after a collision defines a PERFECTLY inelastic collision. Momentum is still conserved (it's conserved in every collision within an isolated system), but kinetic energy is not — it's converted into heat, sound, and permanent deformation of the clay. Perfectly inelastic collisions lose the maximum possible kinetic energy allowed by momentum conservation."
  },
  {
    tag: "Impulse-momentum theorem",
    text: "A force–time graph for a bat hitting a ball shows a curve rising and falling over 0.01 s. What does the AREA under that curve represent?",
    options: [
      "The average force on the ball",
      "The ball's final velocity",
      "The impulse delivered to the ball, equal to its change in momentum",
      "The kinetic energy transferred to the ball"
    ],
    correct: 2,
    explain: "Just as area under a v–t graph gives displacement, area under a F–t graph gives impulse: J = ∫F dt. By the impulse-momentum theorem, J = Δp, so that area directly equals the change in the ball's momentum. The graph's HEIGHT at any instant is force, not impulse — reading the peak height instead of the area is a common mistake."
  },
  {
    tag: "Mass vs. velocity",
    text: "Which has more momentum: a 1500 kg car parked at a stoplight, or a 0.045 kg golf ball struck at 70 m/s?",
    options: [
      "The car, because it has vastly more mass.",
      "The golf ball, because momentum only depends on speed.",
      "The golf ball — the parked car has zero momentum (v = 0), while the ball has p = (0.045)(70) ≈ 3.2 kg·m/s.",
      "They have exactly the same momentum, since momentum depends only on mass."
    ],
    correct: 2,
    explain: "Momentum requires BOTH mass and velocity: p = mv. \"Heavier always means more momentum\" is false — the parked car's huge mass is multiplied by zero velocity, giving zero momentum, while the much lighter golf ball moving fast has real, nonzero momentum. Always check both factors before comparing."
  },
  {
    tag: "2D collisions",
    text: "In a 2D collision, a 4.0 kg puck moving along the x-axis at 3.0 m/s strikes a stationary puck, and afterward the pucks move off at various angles. How should momentum conservation be applied?",
    options: [
      "Add up the magnitudes of all final momenta and set that equal to the initial momentum's magnitude.",
      "Conserve the x-component of total momentum and the y-component of total momentum separately, then combine components if a final vector is needed.",
      "Momentum conservation doesn't apply once objects move at an angle — use energy conservation instead.",
      "Just conserve momentum along whichever single axis has the largest initial momentum."
    ],
    correct: 1,
    explain: "In two dimensions, momentum conservation must be applied component-by-component: Σp_x before = Σp_x after, AND Σp_y before = Σp_y after, treated as two independent equations. You cannot simply add vector magnitudes that point in different directions — that ignores the geometry and gives a wrong total. Break every velocity into x- and y-components first."
  },
  {
    tag: "Explosions and recoil",
    text: "A 5.0 kg cannon (initially at rest, isolated system) fires a 0.20 kg cannonball forward at 50 m/s. What must be true about the cannon afterward?",
    options: [
      "The cannon stays at rest, since it wasn't moving before the shot.",
      "The cannon recoils backward so that the total momentum of (cannon + cannonball) is still zero, matching the system's initial momentum.",
      "The cannon moves forward, in the same direction as the cannonball.",
      "Momentum conservation doesn't apply to explosions, only to collisions."
    ],
    correct: 1,
    explain: "Before firing, the total momentum of the isolated cannon+cannonball system is zero. Conservation of momentum requires the total to still be zero afterward, so the cannon must recoil in the opposite direction with momentum equal in magnitude to the cannonball's: (0.20)(50) = 10 kg·m/s forward for the ball means the cannon gets 10 kg·m/s backward, i.e. v_cannon = −10/5.0 = −2.0 m/s. Explosions/recoil are a standard momentum-conservation scenario, just starting from zero total momentum instead of some object already moving."
  },
  {
    tag: "Impulse and safety design",
    text: "Airbags and crumple zones reduce injury in a car crash mainly by:",
    options: [
      "Reducing the impulse (change in momentum) delivered to the occupant.",
      "Increasing the collision time, so the same impulse is delivered with a smaller peak force.",
      "Making the car lighter so it has less momentum to begin with.",
      "Converting all of the car's kinetic energy into sound instantly."
    ],
    correct: 1,
    explain: "The occupant's change in momentum (Δp) during a crash is essentially fixed by the before/after velocities — airbags and crumple zones don't change that. What they change is Δt: by stretching out the collision time, the same impulse J = FΔt = Δp is delivered with a much smaller average force F, which is what actually reduces injury."
  },
  {
    tag: "Kinetic energy in collisions",
    text: "A 1.0 kg cart moving at 4.0 m/s collides with an identical 1.0 kg cart at rest. After the collision, both move together at 2.0 m/s. Is this collision elastic?",
    options: [
      "Yes, because momentum was conserved: 1.0(4.0) = 2.0(2.0).",
      "No — kinetic energy before (8.0 J) is greater than kinetic energy after (4.0 J), so kinetic energy was not conserved, even though momentum was.",
      "Yes, because the carts have equal mass.",
      "No, because momentum was not conserved."
    ],
    correct: 1,
    explain: "Momentum conservation alone does not make a collision elastic. Check kinetic energy: KE_before = ½(1.0)(4.0)² = 8.0 J; the carts stick together and move at 2.0 m/s, so KE_after = ½(2.0)(2.0)² = 4.0 J. Half the kinetic energy was lost (to heat/sound/deformation) even though momentum came out exactly conserved, as it always does in an isolated system — this collision is (perfectly) inelastic, not elastic."
  }
];

let current = 0;
let answered = new Array(QUESTIONS.length).fill(null);
const quizArea = document.getElementById('quizArea');
const summaryArea = document.getElementById('summaryArea');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');

function renderQuestion(i) {
  const q = QUESTIONS[i];
  const chosen = answered[i];
  const isAnswered = chosen !== null;

  progressFill.style.width = ((i) / QUESTIONS.length * 100) + '%';
  progressLabel.textContent = `Question ${i + 1} of ${QUESTIONS.length}`;

  let optsHtml = q.options.map((opt, idx) => {
    let cls = 'option';
    if (isAnswered) {
      cls += ' disabled';
      if (idx === q.correct) cls += ' correct';
      else if (idx === chosen) cls += ' incorrect';
    }
    return `
      <label class="${cls}" data-idx="${idx}">
        <input type="radio" name="opt" value="${idx}" ${chosen === idx ? 'checked' : ''} ${isAnswered ? 'disabled' : ''}>
        <span>${opt}</span>
      </label>`;
  }).join('');

  let explainHtml = '';
  if (isAnswered) {
    const boxClass = chosen === q.correct ? 'correct-box' : 'incorrect-box';
    const verdict = chosen === q.correct ? 'Correct.' : 'Not quite.';
    explainHtml = `<div class="explain show ${boxClass}"><strong>${verdict}</strong> ${q.explain}</div>`;
  }

  quizArea.innerHTML = `
    <div class="card">
      <div class="qtag">${q.tag}</div>
      <div class="qtext">${q.text}</div>
      <div class="options">${optsHtml}</div>
      ${explainHtml}
      <div class="actions">
        <button class="secondary" id="prevBtn" ${i === 0 ? 'disabled' : ''}>Back</button>
        <button id="nextBtn" ${isAnswered ? '' : 'disabled'}>${i === QUESTIONS.length - 1 ? 'See Results' : 'Next'}</button>
      </div>
    </div>`;

  if (!isAnswered) {
    quizArea.querySelectorAll('.option').forEach(el => {
      el.addEventListener('click', () => {
        const idx = parseInt(el.getAttribute('data-idx'), 10);
        answered[i] = idx;
        renderQuestion(i);
      });
    });
  }

  document.getElementById('prevBtn').addEventListener('click', () => {
    current = Math.max(0, current - 1);
    renderQuestion(current);
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    if (current === QUESTIONS.length - 1) {
      showSummary();
    } else {
      current++;
      renderQuestion(current);
    }
  });
}

function showSummary() {
  quizArea.classList.add('hidden');
  summaryArea.classList.remove('hidden');
  progressFill.style.width = '100%';
  progressLabel.textContent = `Question ${QUESTIONS.length} of ${QUESTIONS.length} — complete`;

  const correctCount = answered.reduce((sum, a, i) => sum + (a === QUESTIONS[i].correct ? 1 : 0), 0);
  const pct = Math.round((correctCount / QUESTIONS.length) * 100);
  document.getElementById('scoreBig').textContent = `${correctCount} / ${QUESTIONS.length} (${pct}%)`;
  const pass = pct >= 80;
  document.getElementById('scoreNote').innerHTML = pass
    ? '<span class="badge-pass">Mastery threshold met (≥ 80%).</span>'
    : '<span class="badge-fail">Below the 80% mastery threshold — review the missed questions below, then retake.</span>';

  const reviewList = document.getElementById('reviewList');
  reviewList.innerHTML = QUESTIONS.map((q, i) => {
    const chosen = answered[i];
    const ok = chosen === q.correct;
    return `
      <div class="review-item">
        <div class="qtag">${q.tag} — ${ok ? '<span class="badge-pass">Correct</span>' : '<span class="badge-fail">Missed</span>'}</div>
        <div class="qtext">${q.text}</div>
        <div style="color:var(--muted); font-size:0.9rem;">Your answer: ${q.options[chosen]}</div>
        ${ok ? '' : `<div style="color:var(--muted); font-size:0.9rem;">Correct answer: ${q.options[q.correct]}</div>`}
        <div style="margin-top:6px; font-size:0.92rem;">${q.explain}</div>
      </div>`;
  }).join('');
}

document.getElementById('retakeBtn').addEventListener('click', () => {
  current = 0;
  answered = new Array(QUESTIONS.length).fill(null);
  summaryArea.classList.add('hidden');
  quizArea.classList.remove('hidden');
  renderQuestion(0);
});

renderQuestion(0);
</script>
</body>
</html>
