<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physics Missed-Question Quizzes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one centered column on a graph-paper ground; unit picker first, then one question at a time. */
:root {
  --bg: #f4f6fb; --surface: #ffffff; --ink: #16223a; --muted: #56627c; --line: #d5dbe9; --grid: #e3e8f3;
  --accent: #2447b8; --accent-ink: #ffffff; --good: #1b7446; --good-bg: #e3f4ea; --bad: #ad3327; --bad-bg: #fbe9e6;
  --display: "Space Grotesk", "Segoe UI", system-ui, sans-serif; --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1522; --surface: #18202f; --ink: #e6ebf5; --muted: #9ba7be; --line: #2b3549; --grid: #171f2e;
  --accent: #93abff; --accent-ink: #0f1522; --good: #63d294; --good-bg: #16301f; --bad: #ff8d7d; --bad-bg: #3a1c18; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1522; --surface: #18202f; --ink: #e6ebf5; --muted: #9ba7be; --line: #2b3549; --grid: #171f2e;
  --accent: #93abff; --accent-ink: #0f1522; --good: #63d294; --good-bg: #16301f; --bad: #ff8d7d; --bad-bg: #3a1c18; color-scheme: dark }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--body);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px }
.wrap { max-width: 720px; margin: 0 auto; padding-block: 28px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px }
h1, h2 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.2 }
h1 { font-size: 1.75rem } h2 { font-size: 1.3rem }
p { margin: 0 } .muted { color: var(--muted) } .small { font-size: .875rem }
.eyebrow { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600 }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 14px }
.units { display: flex; flex-direction: column; gap: 10px }
button { font: inherit; color: inherit; cursor: pointer }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.unit { display: flex; align-items: center; gap: 14px; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px }
.unit:hover { border-color: var(--accent) }
.unit .n { font-family: var(--display); font-weight: 700; font-size: 1.25rem; color: var(--accent); width: 1.6em; flex: none }
.unit .t { flex: 1; min-width: 0 } .unit .t b { display: block; font-family: var(--display); font-size: 1.05rem }
.badge { flex: none; font-size: .8rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-variant-numeric: tabular-nums }
.badge.pass { background: var(--good-bg); color: var(--good); border-color: transparent }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap }
.link { background: none; border: 0; padding: 4px 0; color: var(--accent); font-weight: 600 }
.dots { display: flex; gap: 6px; flex-wrap: wrap }
.dot { width: 22px; height: 6px; border-radius: 3px; background: var(--line) }
.dot.now { background: var(--accent) } .dot.ok { background: var(--good) } .dot.no { background: var(--bad) }
.q { font-size: 1.1rem; font-weight: 500 }
.choices { display: flex; flex-direction: column; gap: 8px }
.choice { display: flex; gap: 12px; align-items: baseline; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px }
.choice:not(:disabled):hover { border-color: var(--accent) }
.choice .k { font-family: var(--display); font-weight: 700; color: var(--muted); flex: none }
.choice:disabled { cursor: default; color: var(--ink); opacity: 1 }
.choice.right { background: var(--good-bg); border-color: var(--good) } .choice.right .k { color: var(--good) }
.choice.wrong { background: var(--bad-bg); border-color: var(--bad) } .choice.wrong .k { color: var(--bad) }
.fb { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 8px }
.verdict { font-family: var(--display); font-weight: 700 } .verdict.ok { color: var(--good) } .verdict.no { color: var(--bad) }
.primary { align-self: flex-start; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 10px 18px; font-weight: 600 }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center }
.ghost { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 10px 18px; font-weight: 600 }
.score { font-family: var(--display); font-size: 2.5rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1 }
.missed { display: flex; flex-direction: column; gap: 12px; padding: 0; margin: 0; list-style: none }
.missed li { border-left: 3px solid var(--bad); padding-left: 12px; display: flex; flex-direction: column; gap: 4px }
sub { font-size: .72em }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const UNITS = [{"id":"01-kinematics","num":1,"title":"Kinematics","quiz":[{"q":"A runner completes exactly one lap of a 400 m track in 80 s. What is the runner's average velocity?","c":["5.0 m/s","0 m/s","0.20 m/s","400 m/s"],"a":1,"why":"Average velocity = displacement ÷ time. After one full lap the runner is back at the start, so displacement is 0 and average velocity is 0 m/s. 5.0 m/s is the average speed.","trap":"Using distance (400 m) when the question asks about velocity."},{"q":"A ball is thrown straight up. At the very top of its path, what is its acceleration? (Ignore air resistance.)","c":["0 m/s²","9.8 m/s² upward","9.8 m/s² downward","It depends on the mass"],"a":2,"why":"Gravity never switches off. The velocity is 0 for an instant, but it is still changing at 9.8 m/s² downward.","trap":"Thinking zero velocity means zero acceleration."},{"q":"A car is moving in the negative direction and has a negative acceleration. The car is:","c":["slowing down","speeding up","moving at constant speed","about to reverse direction"],"a":1,"why":"Velocity and acceleration point the same way, so the speed increases. The sign shows direction only.","trap":"Believing negative acceleration always means slowing down."},{"q":"On a position-time graph, a straight line sloping upward means the object is:","c":["speeding up","at rest","moving at constant velocity","moving uphill"],"a":2,"why":"Slope of a position-time graph is velocity. A straight line has one constant slope, so velocity is constant.","trap":"Reading a rising line as \"getting faster\", or reading the graph as a picture of a hill."},{"q":"On a velocity-time graph, a horizontal line at +6 m/s means the object is:","c":["at rest","moving at a constant 6 m/s","accelerating at 6 m/s²","6 m from the start"],"a":1,"why":"The height of the line is the velocity. Flat means the velocity is not changing, so acceleration is 0 and the object moves steadily at 6 m/s.","trap":"Mixing up the rules for position-time and velocity-time graphs."},{"q":"A bowling ball and a golf ball are dropped from the same height at the same time. Ignoring air resistance, which lands first?","c":["The bowling ball","The golf ball","They land together","It depends on the height"],"a":2,"why":"All objects in free fall accelerate at 9.8 m/s² regardless of mass, so they fall side by side.","trap":"Thinking heavier objects fall faster."},{"q":"A car starts from rest and accelerates at 2.0 m/s² for 5.0 s. How far does it travel?","c":["10 m","25 m","50 m","100 m"],"a":1,"why":"d = v_{i}t + ½at² = 0 + ½(2.0)(5.0)² = 25 m. Multiplying the final speed (10 m/s) by 5 s gives 50 m, which is wrong because the car was not going 10 m/s the whole time.","trap":"Using d = vt with the final velocity instead of the average velocity."},{"q":"An object is dropped from rest. Compared with the distance it falls in 1 s, the distance it falls in 2 s is:","c":["the same","twice as far","three times as far","four times as far"],"a":3,"why":"d = ½gt². Doubling the time multiplies t² by 4: 4.9 m after 1 s and 19.6 m after 2 s.","trap":"Assuming distance grows in proportion to time when the object is accelerating."}]},{"id":"02-projectile-motion","num":2,"title":"Projectile Motion","quiz":[{"q":"A bullet is fired horizontally from a rifle. At the same instant, a second bullet is dropped from the same height. Ignoring air resistance, which hits level ground first?","c":["The dropped bullet","The fired bullet","They hit at the same time","It depends on the speed of the fired bullet"],"a":2,"why":"Both start with zero vertical velocity and have the same downward acceleration. Horizontal speed has no effect on the fall.","trap":"Thinking forward speed keeps an object in the air longer."},{"q":"A ball is kicked at an angle. At the highest point of its path, its velocity is:","c":["zero","horizontal, equal to its horizontal component","vertical, 9.8 m/s downward","the same as its launch velocity"],"a":1,"why":"Only the vertical component is zero at the top. The ball is still moving sideways at v_{x}.","trap":"Saying the velocity is zero at the top, which is only true for a straight-up throw."},{"q":"At the highest point of a projectile's path, its acceleration is:","c":["zero","9.8 m/s² downward","9.8 m/s² upward","horizontal"],"a":1,"why":"Gravity is the only force during the whole flight, so the acceleration is 9.8 m/s² downward at every point, including the top.","trap":"Linking zero vertical velocity to zero acceleration."},{"q":"Ignoring air resistance, the horizontal velocity of a projectile during its flight:","c":["decreases steadily","increases steadily","stays constant","is zero at the top"],"a":2,"why":"No horizontal force acts, so there is no horizontal acceleration.","trap":"Assuming the \"force of the throw\" runs out and the object slows sideways."},{"q":"A ball leaves a 19.6 m high cliff horizontally at 15 m/s. How far from the base of the cliff does it land? (g = 9.8 m/s²)","c":["15 m","19.6 m","30 m","60 m"],"a":2,"why":"Vertical: t = √(2 × 19.6 ÷ 9.8) = 2.0 s. Horizontal: range = 15 × 2.0 = 30 m.","trap":"Mixing horizontal and vertical numbers in one equation."},{"q":"A marble rolls off a table at 2 m/s and lands. It is then rolled off the same table at 4 m/s. Its time in the air is:","c":["twice as long","half as long","the same","four times as long"],"a":2,"why":"Time in the air depends only on the height of the table. Doubling the horizontal speed doubles the range, not the time.","trap":"Thinking a faster launch means a longer fall."},{"q":"A ball is launched at 20 m/s at 30° above the horizontal. What is its initial vertical velocity?","c":["10 m/s","17.3 m/s","20 m/s","30 m/s"],"a":0,"why":"v_{y} = v sin θ = 20 × sin 30° = 10 m/s. 17.3 m/s is the horizontal component.","trap":"Swapping sine and cosine."},{"q":"With the same launch speed on level ground, which pair of angles gives the same range?","c":["30° and 45°","30° and 60°","45° and 60°","45° and 90°"],"a":1,"why":"Angles that add to 90° give equal ranges. The 60° shot goes higher and stays up longer; the 30° shot travels faster sideways.","trap":"Assuming a bigger angle always gives a bigger range."}]},{"id":"03-newtons-laws","num":3,"title":"Newton's Laws","quiz":[{"q":"A hockey puck slides across frictionless ice at constant velocity. The net force on the puck is:","c":["zero","a constant force in the direction of motion","a force that slowly decreases","equal to the puck's weight"],"a":0,"why":"Constant velocity means zero acceleration, so the net force is zero. No force is needed to keep an object moving.","trap":"Believing that motion needs a force in the direction of motion."},{"q":"A large truck collides head-on with a small car. During the collision, the force the truck exerts on the car is:","c":["greater than the force the car exerts on the truck","less than the force the car exerts on the truck","equal to the force the car exerts on the truck","zero, because the car is smaller"],"a":2,"why":"Third law: the two forces are equal in size and opposite in direction. The car is damaged more because its smaller mass gives it a larger acceleration.","trap":"Thinking the bigger or faster object pushes harder."},{"q":"A book rests on a table. Earth pulls down on the book. What is the third-law reaction force?","c":["The table pushing up on the book","The book pulling up on Earth","The book pushing down on the table","Friction between book and table"],"a":1,"why":"Swap the objects: \"Earth pulls book\" pairs with \"book pulls Earth\". The normal force is a different interaction (book and table) and acts on the same object as the weight.","trap":"Picking the normal force because it is equal and opposite to the weight."},{"q":"An elevator moves upward at constant speed. Compared with the elevator's weight, the tension in the cable is:","c":["greater","equal","less","zero"],"a":1,"why":"Constant speed in a straight line means zero net force, so tension equals weight. Tension is greater only while the elevator is speeding up on the way up.","trap":"Assuming upward motion needs a net upward force."},{"q":"A ball is thrown straight up. After it leaves the hand, and ignoring air resistance, the forces on the ball are:","c":["gravity down and the force of the throw up","gravity down only","the force of the throw up only","no forces until it starts to fall"],"a":1,"why":"The hand's push ends at release. A force needs an interaction, and the only thing still interacting with the ball is Earth.","trap":"Carrying the \"force of the throw\" along with the ball."},{"q":"The same net force is applied to a 2 kg cart and a 4 kg cart. Compared with the 2 kg cart, the 4 kg cart's acceleration is:","c":["twice as large","the same","half as large","one quarter as large"],"a":2,"why":"a = F_{net} ÷ m. Doubling the mass with the same force halves the acceleration.","trap":"Treating acceleration as proportional to mass."},{"q":"A 10 kg toolbox is taken to the Moon, where g = 1.6 m/s². Its mass and weight there are:","c":["10 kg and 98 N","1.6 kg and 16 N","10 kg and 16 N","0 kg and 0 N"],"a":2,"why":"Mass does not change with location. Weight = mg = 10 × 1.6 = 16 N.","trap":"Treating mass and weight as the same thing."},{"q":"A 50 N push acts on a 10 kg crate. Friction is 20 N. What is the crate's acceleration?","c":["2.0 m/s²","3.0 m/s²","5.0 m/s²","7.0 m/s²"],"a":1,"why":"F_{net} = 50 − 20 = 30 N, so a = 30 ÷ 10 = 3.0 m/s². Using 50 N alone gives 5.0 m/s², which ignores friction.","trap":"Using the applied force in F = ma when the equation needs the net force."}]},{"id":"04-momentum","num":4,"title":"Momentum","quiz":[{"q":"A loaded truck and a small car collide head-on. Compared with the car, the size of the truck's change in momentum is:","c":["larger","smaller","the same","zero"],"a":2,"why":"The forces are equal and opposite and act for the same time, so the impulses, and the momentum changes, are equal in size. The car's velocity changes more because its mass is smaller.","trap":"Thinking the heavier vehicle has the bigger change in momentum."},{"q":"An airbag reduces injury in a crash mainly because it:","c":["reduces the passenger's change in momentum","increases the time over which the passenger stops","reduces the passenger's mass","increases the passenger's impulse"],"a":1,"why":"The passenger goes from the same speed to zero either way, so Δp is fixed. Spreading the stop over a longer time makes the force smaller (FΔt = Δp).","trap":"Saying the airbag reduces the momentum change or the impulse."},{"q":"A rubber ball and a ball of clay with the same mass hit a wall at the same speed. The rubber ball bounces back; the clay sticks. Which receives the larger impulse from the wall?","c":["The clay","The rubber ball","They are equal","Neither receives an impulse"],"a":1,"why":"The clay goes from v to 0 (Δp = mv). The rubber ball goes from v to nearly −v (Δp up to 2mv). A bigger momentum change needs a bigger impulse.","trap":"Assuming that sticking is the \"harder\" hit."},{"q":"A 2.0 kg cart moving at 3.0 m/s hits a 1.0 kg cart at rest. They stick together. What is their speed afterward?","c":["1.0 m/s","1.5 m/s","2.0 m/s","3.0 m/s"],"a":2,"why":"Momentum before = 2.0 × 3.0 = 6.0 kg·m/s. After, the mass is 3.0 kg, so v = 6.0 ÷ 3.0 = 2.0 m/s.","trap":"Forgetting to use the combined mass after the collision, or averaging the two speeds."},{"q":"In an inelastic collision between two carts on a frictionless track:","c":["momentum and kinetic energy are both conserved","momentum is conserved but kinetic energy is not","kinetic energy is conserved but momentum is not","neither is conserved"],"a":1,"why":"Momentum is conserved in every collision with no net external force. In an inelastic collision some kinetic energy becomes heat, sound and deformation.","trap":"Thinking momentum is \"lost\" when things crumple or stick."},{"q":"A 0.50 kg ball hits a wall at 4.0 m/s and bounces straight back at 4.0 m/s. The size of its change in momentum is:","c":["0 kg·m/s","2.0 kg·m/s","4.0 kg·m/s","8.0 kg·m/s"],"a":2,"why":"Momentum is a vector. Δp = 0.50 × (−4.0) − 0.50 × (4.0) = −4.0 kg·m/s, so the size is 4.0 kg·m/s.","trap":"Subtracting speeds (4 − 4 = 0) and ignoring the change of direction."},{"q":"Two skaters at rest push off each other. The 50 kg skater moves away at 2.0 m/s. How fast does the 100 kg skater move?","c":["4.0 m/s","2.0 m/s","1.0 m/s","0.50 m/s"],"a":2,"why":"Total momentum stays zero: 50 × 2.0 = 100 × v, so v = 1.0 m/s in the opposite direction.","trap":"Giving the heavier skater the higher speed, or the same speed."},{"q":"For the two skaters above, what is the total momentum of the two-skater system after they push off?","c":["200 kg·m/s","100 kg·m/s","50 kg·m/s","0 kg·m/s"],"a":3,"why":"They started at rest (total momentum zero) and the only forces were between the skaters, so the total is still zero: +100 and −100 kg·m/s.","trap":"Adding the sizes of the momenta and ignoring direction."}]},{"id":"05-work-energy","num":5,"title":"Work and Energy","quiz":[{"q":"A student holds a 20 kg box motionless at chest height for 10 s. How much work does the student do on the box?","c":["0 J","196 J","1960 J","2000 J"],"a":0,"why":"Work needs a displacement. The box does not move, so the work on it is zero, even though the student gets tired.","trap":"Equating effort or tiredness with work."},{"q":"A waiter carries a tray across a level room at constant velocity. The work done on the tray by the upward force of the waiter's hand is:","c":["positive","negative","zero","equal to the tray's weight times the distance walked"],"a":2,"why":"The force is vertical and the displacement is horizontal. With θ = 90°, cos θ = 0, so W = 0.","trap":"Multiplying force by distance without checking that they are in the same direction."},{"q":"A car doubles its speed. Its kinetic energy becomes:","c":["twice as large","three times as large","four times as large","half as large"],"a":2,"why":"KE = ½mv². Doubling v multiplies v² by 4.","trap":"Treating kinetic energy as proportional to speed."},{"q":"A heavy ball and a light ball slide from rest down the same frictionless ramp. At the bottom:","c":["the heavy ball is faster","the light ball is faster","they have the same speed","they have the same kinetic energy"],"a":2,"why":"mgh = ½mv², so v = √(2gh). Mass cancels. The heavy ball has more kinetic energy, but the speeds are equal.","trap":"Thinking more mass means more speed, or mixing up speed and kinetic energy."},{"q":"A ball is dropped from a height of 5.0 m. Ignoring air resistance, its speed just before landing is about:","c":["4.9 m/s","9.9 m/s","49 m/s","98 m/s"],"a":1,"why":"v = √(2gh) = √(2 × 9.8 × 5.0) = √98 ≈ 9.9 m/s.","trap":"Forgetting the square root (98) or computing gh only (49)."},{"q":"Two students with the same mass climb the same staircase. Student A takes 5 s; student B takes 10 s. Compared with B, student A does:","c":["more work and has more power","the same work and has twice the power","the same work and has the same power","half the work and has the same power"],"a":1,"why":"Work = mgh is the same for both. Power = work ÷ time, so half the time means twice the power.","trap":"Confusing work with power."},{"q":"A block slides down a rough ramp and reaches the bottom with less kinetic energy than the potential energy it started with. The \"missing\" energy:","c":["was destroyed by friction","became thermal energy","is stored as potential energy","never existed"],"a":1,"why":"Energy cannot be destroyed. Friction transfers mechanical energy into thermal energy in the block and ramp.","trap":"Saying energy is \"lost\" or \"used up\"."},{"q":"Three identical stones are thrown from a cliff with the same speed: one upward, one horizontally, one downward. Ignoring air resistance, which hits the ground with the greatest speed?","c":["The one thrown upward","The one thrown horizontally","The one thrown downward","All three have the same speed"],"a":3,"why":"All three start with the same kinetic and potential energy and end at the same height, so they end with the same kinetic energy and the same speed. Only their directions and times differ.","trap":"Assuming that throwing downward adds extra speed at the ground."}]}];
const PASS = 0.8, KEY = 'physics-quiz-best-v1';
const app = document.getElementById('app');
const fmt = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/_\{([^}]*)\}/g, '<sub>$1</sub>');
let best = {};
try { best = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { best = {}; }
const saveBest = () => { try { localStorage.setItem(KEY, JSON.stringify(best)); } catch (e) {} };
let S = null; // { unit, order: [question indexes], i, answers: {qIndex: choice}, picked }

function home() {
  S = null;
  app.innerHTML = `<header><p class="eyebrow">Physics · Semester 1</p><h1>Missed-Question Quizzes</h1></header>
    <p>Eight questions per unit, each built on a mistake students commonly make on that topic. You get the explanation right after each answer. Aim for ${PASS * 100}% or better, then retry only the ones you missed.</p>
    <div class="units">${UNITS.map(u => { const b = best[u.id]; return `<button class="unit" data-u="${u.id}"><span class="n">${u.num}</span><span class="t"><b>${u.title}</b><span class="muted small">${u.quiz.length} questions</span></span><span class="badge ${b != null && b / u.quiz.length >= PASS ? 'pass' : ''}">${b == null ? 'Not started' : 'Best ' + b + '/' + u.quiz.length}</span></button>`; }).join('')}</div>
    <p class="muted small">Your best scores are saved in this browser only. Your teacher cannot see them, so record your score on your unit checklist.</p>`;
  app.querySelectorAll('.unit').forEach(b => b.onclick = () => { location.hash = b.dataset.u; });
}

function start(u, only) {
  S = { unit: u, order: only || u.quiz.map((_, i) => i), i: 0, answers: {}, picked: null, retry: !!only };
  question();
}

function question() {
  const u = S.unit, qi = S.order[S.i], q = u.quiz[qi], done = S.picked != null;
  const dots = S.order.map((x, k) => `<span class="dot ${k === S.i ? 'now' : (S.answers[x] == null ? '' : S.answers[x] === u.quiz[x].a ? 'ok' : 'no')}"></span>`).join('');
  app.innerHTML = `<div class="top"><button class="link" id="back">← All units</button><span class="muted small">Unit ${u.num} · ${u.title}${S.retry ? ' · retry' : ''}</span></div>
    <div class="panel"><div class="top"><span class="eyebrow">Question ${S.i + 1} of ${S.order.length}</span><span class="dots" aria-hidden="true">${dots}</span></div>
    <p class="q">${fmt(q.q)}</p>
    <div class="choices">${q.c.map((c, k) => `<button class="choice ${done ? (k === q.a ? 'right' : k === S.picked ? 'wrong' : '') : ''}" data-k="${k}" ${done ? 'disabled' : ''}><span class="k">${'ABCD'[k]}</span><span>${fmt(c)}</span></button>`).join('')}</div>
    ${done ? `<div class="fb" role="status"><p class="verdict ${S.picked === q.a ? 'ok' : 'no'}">${S.picked === q.a ? 'Correct' : 'Not quite. The answer is ' + 'ABCD'[q.a] + '.'}</p><p>${fmt(q.why)}</p><p class="muted small"><b>Common mistake:</b> ${fmt(q.trap)}</p>
      <button class="primary" id="next">${S.i + 1 < S.order.length ? 'Next question' : 'See results'}</button></div>` : ''}</div>`;
  document.getElementById('back').onclick = () => { location.hash = ''; home(); };
  app.querySelectorAll('.choice').forEach(b => b.onclick = () => { S.picked = +b.dataset.k; S.answers[qi] = S.picked; question(); });
  const n = document.getElementById('next');
  if (n) { n.onclick = () => { S.picked = null; if (++S.i < S.order.length) question(); else results(); }; n.focus(); }
}

function results() {
  const u = S.unit, missed = S.order.filter(x => S.answers[x] !== u.quiz[x].a), right = S.order.length - missed.length;
  if (!S.retry && (best[u.id] == null || right > best[u.id])) { best[u.id] = right; saveBest(); }
  const pass = right / S.order.length >= PASS;
  app.innerHTML = `<div class="top"><button class="link" id="back">← All units</button><span class="muted small">Unit ${u.num} · ${u.title}</span></div>
    <div class="panel"><span class="eyebrow">${S.retry ? 'Retry result' : 'Result'}</span><p class="score">${right}/${S.order.length}</p>
    <p>${missed.length === 0 ? 'Every question correct.' : pass ? 'You reached the 80% goal. Review the ones you missed below.' : 'Below the 80% goal. Read the explanations below, go back to those cue questions in your Cornell notes, then retry.'}</p>
    ${missed.length ? `<ul class="missed">${missed.map(x => `<li><b>${fmt(u.quiz[x].q)}</b><span>${fmt(u.quiz[x].why)}</span><span class="muted small"><b>Common mistake:</b> ${fmt(u.quiz[x].trap)}</span></li>`).join('')}</ul>` : ''}
    <div class="row">${missed.length ? '<button class="primary" id="retry">Retry missed questions</button>' : ''}<button class="ghost" id="again">Restart unit</button></div></div>`;
  document.getElementById('back').onclick = () => { location.hash = ''; home(); };
  document.getElementById('again').onclick = () => start(u);
  const r = document.getElementById('retry'); if (r) r.onclick = () => start(u, missed);
}

function route() { const u = UNITS.find(x => x.id === location.hash.slice(1)); if (u) start(u); else home(); }
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
