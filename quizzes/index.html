<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Physics Semester 1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one centered column on graph paper; a unit list at home, and per-unit tabs (quiz, self-test, practice, overview). */
:root {
  --bg: #f4f6fb; --surface: #ffffff; --ink: #14213d; --muted: #55627f; --line: #d3dbea;
  --accent: #1f3864; --accent-ink: #ffffff; --soft: #e6ecf7; --hl: #8a5a00; --hl-bg: #fdf1d3;
  --good: #1b6e45; --good-bg: #e2f3e9; --bad: #a8332a; --bad-bg: #fbe8e5; --grid: rgba(31, 56, 100, .07);
  --display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1524; --surface: #172136; --ink: #e7ecf6; --muted: #9ba8c3; --line: #2a3853;
    --accent: #9dbbf2; --accent-ink: #0e1524; --soft: #1f2c47; --hl: #f3c35a; --hl-bg: #382c10;
    --good: #74d3a0; --good-bg: #143124; --bad: #f29488; --bad-bg: #3b1c19; --grid: rgba(157, 187, 242, .07);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1524; --surface: #172136; --ink: #e7ecf6; --muted: #9ba8c3; --line: #2a3853;
  --accent: #9dbbf2; --accent-ink: #0e1524; --soft: #1f2c47; --hl: #f3c35a; --hl-bg: #382c10;
  --good: #74d3a0; --good-bg: #143124; --bad: #f29488; --bad-bg: #3b1c19; --grid: rgba(157, 187, 242, .07);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--body);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
}
.wrap {
  max-width: 780px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 24px;
}
h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: 2rem; font-weight: 700; letter-spacing: -.01em; }
h2 { font-size: 1.25rem; font-weight: 700; }
h3 { font-size: 1rem; font-weight: 500; }
p { margin: 0; }
a { color: var(--accent); }
.eyebrow { font-size: .75rem; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.lede { color: var(--muted); max-width: 62ch; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-lg { display: flex; flex-direction: column; gap: 20px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* home */
.units { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.unit-row {
  display: grid; grid-template-columns: 2.6rem minmax(0, 1fr) auto; gap: 14px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px;
  text-decoration: none; color: inherit;
}
.unit-row:hover { border-color: var(--accent); }
.unit-num { font: 700 1.6rem/1 var(--display); color: var(--accent); font-variant-numeric: tabular-nums; }
.unit-meta { font-size: .875rem; color: var(--muted); }
.unit-stats { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: .8125rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; background: var(--soft); color: var(--ink); font-weight: 600; font-size: .8125rem; }
.pill.good { background: var(--good-bg); color: var(--good); }
.howto { margin: 0; padding-left: 1.2rem; color: var(--muted); display: flex; flex-direction: column; gap: 4px; max-width: 65ch; }

/* unit */
.back { font-size: .875rem; text-decoration: none; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--line); }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 12px; font-weight: 600; color: var(--muted); }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 20px; }
.progress { height: 6px; background: var(--soft); border-radius: 3px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.qmeta { display: flex; justify-content: space-between; gap: 12px; font-size: .8125rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.question { font: 500 1.125rem/1.4 var(--display); }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice { text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 6px; padding: 11px 14px; min-width: 0; }
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice:disabled { cursor: default; }
.choice.right { border-color: var(--good); background: var(--good-bg); color: var(--good); font-weight: 600; }
.choice.wrong { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
.feedback { border-left: 4px solid var(--line); padding: 4px 0 4px 14px; display: flex; flex-direction: column; gap: 6px; }
.feedback.ok { border-color: var(--good); } .feedback.no { border-color: var(--bad); }
.verdict { font-weight: 600; } .ok .verdict { color: var(--good); } .no .verdict { color: var(--bad); }
.trap { align-self: flex-start; background: var(--hl-bg); color: var(--hl); font-size: .8125rem; font-weight: 600; padding: 2px 8px; border-radius: 4px; }
.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 6px; padding: 10px 18px; font-weight: 600; }
.btn.ghost { background: none; color: var(--accent); border: 1.5px solid var(--accent); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.score { font: 700 2.5rem/1 var(--display); font-variant-numeric: tabular-nums; }
.missed { margin: 0; padding-left: 1.2rem; display: flex; flex-direction: column; gap: 6px; }
details { border-top: 1px solid var(--line); padding: 10px 0; }
details:first-of-type { border-top: 0; }
summary { cursor: pointer; font-weight: 600; }
details > .ans { margin-top: 8px; color: var(--ink); }
.ans ul { margin: 0; padding-left: 1.2rem; display: flex; flex-direction: column; gap: 4px; }
.sec-label { margin-top: 10px; }
.check { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; }
.check input { width: 1.1rem; height: 1.1rem; margin-top: .25rem; accent-color: var(--accent); }
dl { margin: 0; display: grid; grid-template-columns: minmax(0, 11rem) minmax(0, 1fr); gap: 8px 16px; }
dt { font-weight: 600; } dd { margin: 0; color: var(--muted); }
ul.plain { margin: 0; padding-left: 1.2rem; display: flex; flex-direction: column; gap: 4px; }
.note { font-size: .875rem; color: var(--muted); }
@media (max-width: 560px) {
  h1 { font-size: 1.6rem; }
  .unit-row { grid-template-columns: 2rem minmax(0, 1fr); }
  .unit-stats { grid-column: 2; flex-direction: row; align-items: center; gap: 10px; }
  dl { grid-template-columns: minmax(0, 1fr); gap: 2px; } dd { margin-bottom: 8px; }
  .panel { padding: 16px; }
}
@media (prefers-reduced-motion: reduce) { .progress > i { transition: none; } }
</style>

<div class="wrap" id="app"></div>

<script>
const UNITS = [{"slug": "kinematics", "num": 1, "title": "Kinematics", "subtitle": "Motion in one dimension", "pacing": "Weeks 1–4", "eq": "How can we describe and predict the motion of an object using words, graphs, and equations?", "targets": ["I can tell distance from displacement and speed from velocity, and calculate each.", "I can read position-time and velocity-time graphs using slope and area.", "I can define acceleration and decide from signs whether an object speeds up or slows down.", "I can choose and solve the right kinematic equation for constant acceleration.", "I can solve free-fall problems and explain why all objects fall with the same acceleration.", "I can collect motion data in a lab and find velocity from the slope of a graph."], "concepts": [["Scalar vs. vector", "A scalar has size only (distance, speed, time). A vector has size and direction (displacement, velocity, acceleration)."], ["Displacement", "Change in position, Δx = x_f − x_i. Direction matters."], ["Velocity", "Rate of change of position, v = Δx/Δt. Slope of a position-time graph."], ["Acceleration", "Rate of change of velocity, a = Δv/Δt. Slope of a velocity-time graph."], ["Kinematic equations", "Four equations that link Δx, v₀, v, a, and t when acceleration is constant."], ["Free fall", "Motion under gravity only. a = 9.8 m/s² downward for every object, whatever its mass."]], "cues": [{"section": "Position, Distance, and Displacement", "q": "What is the difference between distance and displacement?", "notes": ["**Distance** is the total path length traveled. It is a scalar (size only).", "**Displacement** is the change in position: **Δx = x_f − x_i**. It is a vector (size and direction).", "Worked example: you walk 8 m east, then 3 m west. Distance = 8 + 3 = **11 m**. Displacement = 8 − 3 = **5 m east**.", "Sense check: displacement can never be larger than distance."]}, {"section": "Position, Distance, and Displacement", "q": "What makes a quantity a vector instead of a scalar?", "notes": ["A **vector** needs a direction to be complete: displacement, velocity, acceleration, force.", "A **scalar** is fully described by a number and unit: distance, speed, time, mass.", "In one dimension, direction is shown with a **+ or − sign**. Pick the positive direction first and keep it."]}, {"section": "Speed and Velocity", "q": "How is average speed different from average velocity?", "notes": ["**Average speed = distance ÷ time.** **Average velocity = displacement ÷ time.**", "Worked example: a runner completes one 400 m lap in 80 s. Speed = 400 ÷ 80 = **5 m/s**. Displacement is 0 (back at the start), so average velocity = **0 m/s**.", "Units: m/s. Velocity also needs a direction."]}, {"section": "Speed and Velocity", "q": "What does the slope of a position-time graph tell you?", "notes": ["**Slope of a position-time graph = velocity.**", "Straight line = constant velocity. Steeper line = faster. **Flat line = at rest.** Line sloping down = moving in the negative direction.", "A curve means the velocity is changing (the object is accelerating).", "Where two lines cross, the objects are at the **same position**, not the same speed."]}, {"section": "Acceleration", "q": "What is acceleration, and what are its units?", "notes": ["**Acceleration = change in velocity ÷ time: a = Δv/Δt = (v − v₀)/t.** Units: **m/s²** (meters per second, each second).", "Worked example: a car goes from 0 to 24 m/s in 6 s. a = (24 − 0) ÷ 6 = **4 m/s²**. Each second it gains 4 m/s.", "Constant velocity means **a = 0**, even if the object is moving fast."]}, {"section": "Acceleration", "q": "Does negative acceleration always mean slowing down?", "notes": ["No. The sign of acceleration shows its **direction**, not whether the object slows.", "**Same signs (v and a) = speeding up. Opposite signs = slowing down.**", "Example: a car moving in the negative direction (v = −10 m/s) with a = −2 m/s² is speeding up."]}, {"section": "Acceleration", "q": "What do the slope and the area of a velocity-time graph tell you?", "notes": ["**Slope of a velocity-time graph = acceleration.**", "**Area between the line and the time axis = displacement.**", "Worked example: velocity rises steadily from 0 to 10 m/s in 4 s. Slope = 10 ÷ 4 = **2.5 m/s²**. Area = ½ × 4 × 10 = **20 m**.", "A line crossing the time axis means the object **changed direction**."]}, {"section": "Kinematic Equations", "q": "What are the four kinematic equations, and when can you use them?", "notes": ["Use them only when **acceleration is constant**.", "**v = v₀ + at**", "**Δx = v₀t + ½at²**", "**v² = v₀² + 2aΔx**", "**Δx = ½(v₀ + v)t**", "Five variables: Δx, v₀, v, a, t. Each equation leaves one of them out."]}, {"section": "Kinematic Equations", "q": "How do you choose which kinematic equation to use?", "notes": ["List what you know and what you want (**GUESS**: Givens, Unknown, Equation, Substitute, Solve).", "Pick the equation that contains your three knowns and your unknown, and **leaves out the variable you do not have**.", "Hidden givens: \"from rest\" means v₀ = 0. \"Comes to a stop\" means v = 0."]}, {"section": "Kinematic Equations", "q": "How far does a car travel while braking from 20 m/s at −5 m/s²?", "notes": ["Givens: v₀ = 20 m/s, v = 0, a = −5 m/s². Unknown: Δx. No time given, so use **v² = v₀² + 2aΔx**.", "0 = 20² + 2(−5)Δx, so Δx = 400 ÷ 10 = **40 m**.", "Second example: from rest at 3 m/s² for 5 s. v = 0 + 3(5) = **15 m/s**. Δx = ½(3)(5²) = **37.5 m**.", "Sense check: stopping distance depends on v². Double the speed, four times the distance."]}, {"section": "Free Fall", "q": "What is the acceleration of any object in free fall?", "notes": ["**g = 9.8 m/s² downward**, for every object, when air resistance can be ignored.", "Mass does not matter: a heavy ball and a light ball dropped together land together.", "Worked example: a rock dropped from rest falls for 2 s. v = 9.8 × 2 = **19.6 m/s**. Distance = ½(9.8)(2²) = **19.6 m**.", "Falling distance grows with t². Twice the time, four times the distance."]}, {"section": "Free Fall", "q": "What are the velocity and acceleration at the top of a toss?", "notes": ["At the top, **velocity = 0** for an instant, but **acceleration is still 9.8 m/s² downward**.", "If the acceleration were zero at the top, the ball would stay there.", "Worked example: a ball is thrown up at 14.7 m/s. Time to the top: t = 14.7 ÷ 9.8 = **1.5 s**. Height: 14.7² ÷ (2 × 9.8) = **11.0 m**.", "Symmetry: time up = time down, and it returns to the launch height at the launch speed."]}, {"section": "Labs and Measurement", "q": "What question does the lab \"Constant-velocity buggy and cart on a ramp\" answer, and what are its variables?", "notes": ["Question: How does the position of a moving object change with time?", "**Independent variable:** Time (s)", "**Dependent variable:** Position (m)"]}, {"section": "Labs and Measurement", "q": "Which formula does the lab use, and what are the steps?", "notes": ["**Formula:** Velocity = slope of the position-time graph. For the ramp: a = slope of the velocity-time graph.", "Mark a track every 0.5 m. Time the buggy as it passes each mark. Run three trials and average.", "Graph position (vertical axis) against time (horizontal axis) and draw a best-fit line.", "Find the slope with units. Repeat with a cart rolling down a ramp and compare the shape of the graphs.", "Record measurements to the precision of the tool and keep the correct significant figures in calculations."]}], "quiz": [{"q": "A ball is thrown straight up. At the very top of its path, what are its velocity and acceleration?", "c": ["Velocity is zero and acceleration is 9.8 m/s² downward", "Velocity is zero and acceleration is zero", "Velocity is 9.8 m/s downward and acceleration is zero", "Both are 9.8, pointing upward"], "a": 0, "trap": "Zero velocity means zero acceleration", "why": "Gravity never switches off. The velocity passes through zero for an instant, but it is still changing at 9.8 m/s every second. If acceleration were zero, the ball would hang there.", "lo": 4}, {"q": "A 5 kg bowling ball and a 0.5 kg ball are dropped from the same height at the same time. Ignore air resistance. Which lands first?", "c": ["They land at the same time", "The bowling ball, because it is heavier", "The lighter ball, because it is easier to move", "The bowling ball lands in one tenth of the time"], "a": 0, "trap": "Heavier objects fall faster", "why": "In free fall every object accelerates at 9.8 m/s². The heavier ball has ten times the pull of gravity but also ten times the mass to move, so the acceleration is the same.", "lo": 4}, {"q": "A car moves in the negative direction with velocity −10 m/s. Its acceleration is −2 m/s². What is the car doing?", "c": ["Speeding up", "Slowing down", "Moving at constant speed", "Turning around"], "a": 0, "trap": "Negative acceleration always means slowing down", "why": "Velocity and acceleration have the same sign, so the speed increases: −10, −12, −14 m/s. An object slows only when velocity and acceleration have opposite signs.", "lo": 2}, {"q": "On a position-time graph, a horizontal (flat) line means the object is:", "c": ["At rest", "Moving at constant speed", "Speeding up", "Slowing down"], "a": 0, "trap": "Reading a position graph as if it were a velocity graph", "why": "Slope of a position-time graph is velocity. A flat line has zero slope, so velocity is zero. A flat line on a velocity-time graph would mean constant speed.", "lo": 1}, {"q": "A straight line on a velocity-time graph starts above the time axis, slopes down, and crosses below the axis. What happens at the moment it crosses?", "c": ["The object stops for an instant and reverses direction", "The object returns to its starting position", "The acceleration becomes zero", "The object begins to slow down"], "a": 0, "trap": "Crossing the axis means back at the start", "why": "The graph shows velocity, not position. Crossing the axis means velocity changes sign: the object reverses. The slope (acceleration) has not changed.", "lo": 1}, {"q": "You drive to a town at 60 km/h and return along the same road at 40 km/h. What is your average speed for the whole trip?", "c": ["48 km/h", "50 km/h", "52 km/h", "100 km/h"], "a": 0, "trap": "Averaging the two speeds", "why": "Average speed is total distance over total time. You spend more time at the slower speed. For 120 km each way: 2 h + 3 h = 5 h, and 240 km ÷ 5 h = 48 km/h.", "lo": 0}, {"q": "A runner completes exactly one lap of a 400 m track in 80 s. What is the runner's average velocity?", "c": ["0 m/s", "5 m/s", "10 m/s", "0.2 m/s"], "a": 0, "trap": "Using distance where displacement is needed", "why": "Velocity uses displacement. The runner ends where they started, so displacement is zero and average velocity is zero. The average speed is 5 m/s.", "lo": 0}, {"q": "The position-time lines for car A and car B cross at t = 3 s. At that moment the two cars have the same:", "c": ["Position", "Speed", "Acceleration", "Speed and position"], "a": 0, "trap": "Crossing lines mean equal speeds", "why": "The graph's vertical axis is position, so a crossing point is one shared position. Speed is the slope, and the two lines have different slopes where they cross.", "lo": 1}, {"q": "A rock dropped from rest falls 4.9 m in the first second. How far has it fallen in total after 2 seconds?", "c": ["19.6 m", "9.8 m", "14.7 m", "4.9 m"], "a": 0, "trap": "Distance fallen is proportional to time", "why": "Distance = ½gt², so it depends on time squared. Twice the time gives four times the distance: 4 × 4.9 = 19.6 m.", "lo": 4}, {"q": "A car traveling at 20 m/s needs 40 m to brake to a stop. With the same brakes, how far does it need at 40 m/s?", "c": ["160 m", "80 m", "60 m", "40 m"], "a": 0, "trap": "Double the speed, double the stopping distance", "why": "From v² = v₀² + 2aΔx, stopping distance depends on v₀². Doubling the speed makes it four times longer: 4 × 40 = 160 m.", "lo": 3}], "practice": [["A cyclist rides 150 m north, then 50 m south, in 40 s. Find the distance, displacement, average speed, and average velocity.", "Distance = 200 m. Displacement = 100 m north. Average speed = 200 ÷ 40 = 5 m/s. Average velocity = 100 ÷ 40 = 2.5 m/s north."], ["A train speeds up steadily from 12 m/s to 30 m/s in 9 s. Find its acceleration and how far it travels in that time.", "a = (30 − 12) ÷ 9 = 2 m/s². Δx = ½(12 + 30)(9) = 189 m."], ["A jet lands at 70 m/s and slows at 3.5 m/s². How much runway does it need, and how long does it take to stop?", "v² = v₀² + 2aΔx: 0 = 70² − 2(3.5)Δx, so Δx = 4900 ÷ 7 = 700 m. t = 70 ÷ 3.5 = 20 s."], ["A stone is dropped from a bridge and hits the water 3.0 s later. How high is the bridge, and how fast is the stone moving at impact?", "h = ½(9.8)(3.0²) = 44.1 m. v = 9.8 × 3.0 = 29.4 m/s downward."], ["A ball is thrown straight up at 19.6 m/s. Find the time to reach the top, the maximum height, and the total time in the air.", "t_up = 19.6 ÷ 9.8 = 2.0 s. Height = 19.6² ÷ (2 × 9.8) = 19.6 m. Total time = 4.0 s."], ["A velocity-time graph rises in a straight line from 0 to 10 m/s over 4 s, then stays at 10 m/s for 6 s. Find the total displacement.", "Triangle: ½ × 4 × 10 = 20 m. Rectangle: 6 × 10 = 60 m. Total = 80 m."]], "resources": [["The Physics Classroom: 1-D Kinematics", "https://www.physicsclassroom.com/class/1DKin", "Tutorial lessons on vectors, graphs, free fall, and the kinematic equations."], ["PhET: The Moving Man", "https://phet.colorado.edu/en/simulations/moving-man", "Drag a person and watch the position, velocity, and acceleration graphs draw live."], ["Khan Academy: One-dimensional motion", "https://www.khanacademy.org/science/physics/one-dimensional-motion", "Videos and practice on displacement, velocity, acceleration, and kinematic formulas."], ["OpenStax Physics (high school)", "https://openstax.org/details/books/physics", "Free textbook. See the chapters on motion in one dimension and acceleration."]], "apps": ["Stopping distance and following distance when driving: why speed limits drop near schools.", "Sports timing: sprint splits, pitch speed, and how radar guns measure velocity.", "Phone accelerometers and GPS: how a map app estimates arrival time.", "Drop-tower rides and skydiving before air resistance matters."], "ngss": ["HS-PS2-1"]}, {"slug": "projectile-motion", "num": 2, "title": "Projectile Motion", "subtitle": "Motion in two dimensions", "pacing": "Weeks 5–7", "eq": "Why can we predict where a launched object will land by treating its horizontal and vertical motion separately?", "targets": ["I can break a vector into horizontal and vertical components and combine components into a resultant.", "I can explain why horizontal and vertical motion are independent and what each one does during flight.", "I can solve horizontally launched projectile problems for time, range, and impact speed.", "I can solve angled-launch problems for time of flight, maximum height, and range.", "I can predict how changing launch speed, height, or angle changes the path.", "I can predict a landing spot in a lab and compare it with my measurement."], "concepts": [["Vector components", "The horizontal and vertical parts of a vector: vx = v cos θ, vy = v sin θ (θ measured from the horizontal)."], ["Resultant", "The single vector that equals two or more vectors added together."], ["Projectile", "An object moving through the air with gravity as the only force acting on it."], ["Independence of motion", "Horizontal motion has constant velocity. Vertical motion is free fall. Neither affects the other."], ["Time of flight", "Set by the vertical motion only. It is the one quantity the horizontal and vertical motions share."], ["Range", "Horizontal distance traveled: range = vx × time of flight."]], "cues": [{"section": "Vectors and Components", "q": "How do you break a velocity vector into components?", "notes": ["With the angle θ measured from the horizontal: **vx = v cos θ** and **vy = v sin θ**.", "Worked example: 20 m/s at 30° above horizontal. vx = 20 cos 30° = **17.3 m/s**. vy = 20 sin 30° = **10.0 m/s**.", "Sense check: each component must be smaller than the original vector. Calculator in **degree mode**."]}, {"section": "Vectors and Components", "q": "How do you combine two perpendicular vectors into one resultant?", "notes": ["Magnitude from the Pythagorean theorem: **R = √(x² + y²)**. Direction from **θ = tan⁻¹(y ÷ x)**.", "Worked example: 3 m/s east and 4 m/s north. R = √(9 + 16) = **5 m/s**. θ = tan⁻¹(4 ÷ 3) = **53.1° north of east**.", "Always state a direction with the answer."]}, {"section": "Independence of Horizontal and Vertical Motion", "q": "Why can horizontal and vertical motion be treated separately?", "notes": ["The only force on a projectile is **gravity, which acts straight down**.", "**Horizontal: no force, so ax = 0 and vx stays constant.**", "**Vertical: free fall, so ay = 9.8 m/s² downward.**", "Solve each direction with its own list of givens."]}, {"section": "Independence of Horizontal and Vertical Motion", "q": "A ball is dropped and another is launched horizontally from the same height. Which lands first?", "notes": ["**They land at the same time.** Both start with zero vertical velocity and fall the same height with the same acceleration.", "The launched ball also moves sideways, but that does not change how fast it falls."]}, {"section": "Independence of Horizontal and Vertical Motion", "q": "What one quantity is the same for the horizontal and vertical motion?", "notes": ["**Time.** The projectile moves sideways for exactly as long as it is in the air.", "Usual plan: find time from the vertical motion, then use it in the horizontal motion."]}, {"section": "Horizontally Launched Projectiles", "q": "How do you find the time of flight for a horizontal launch?", "notes": ["Vertical givens: v₀y = 0, a = 9.8 m/s², Δy = height. Use **h = ½gt²**, so **t = √(2h ÷ g)**.", "Time depends only on the **height**, not on the launch speed."]}, {"section": "Horizontally Launched Projectiles", "q": "A ball rolls off a 1.225 m table at 4.0 m/s. Where does it land, and how fast is it going?", "notes": ["Time (vertical): t = √(2 × 1.225 ÷ 9.8) = √0.25 = **0.50 s**.", "Range (horizontal): x = vx × t = 4.0 × 0.50 = **2.0 m** from the table.", "Impact: vx = 4.0 m/s (unchanged). vy = 9.8 × 0.50 = 4.9 m/s. Speed = √(4.0² + 4.9²) = **6.3 m/s**.", "Sense check: launch twice as fast and it lands twice as far, in the same time."]}, {"section": "Projectiles Launched at an Angle", "q": "What happens to each velocity component during the flight?", "notes": ["**vx stays constant** the whole flight.", "**vy** shrinks on the way up, is **zero at the top**, then grows downward.", "At the top the projectile is still moving: its velocity equals vx. Its acceleration is still 9.8 m/s² downward.", "On level ground it lands with the same speed it was launched with."]}, {"section": "Projectiles Launched at an Angle", "q": "How do you find time of flight, maximum height, and range on level ground?", "notes": ["Split first: vx = v cos θ, vy = v sin θ.", "**Time up = vy ÷ g. Total time = 2 × time up.**", "**Maximum height = vy² ÷ (2g).**", "**Range = vx × total time.**", "Worked example: 20 m/s at 30°. vx = 17.3 m/s, vy = 10.0 m/s. Time up = 10.0 ÷ 9.8 = 1.02 s, total = **2.04 s**. Height = 10.0² ÷ 19.6 = **5.10 m**. Range = 17.3 × 2.04 = **35.3 m**."]}, {"section": "Projectiles Launched at an Angle", "q": "Which launch angle gives the greatest range on level ground?", "notes": ["**45°**, when air resistance is ignored.", "**Complementary angles give the same range**: 30° and 60°, 20° and 70°. The steeper one goes higher and stays up longer."]}, {"section": "Labs and Measurement", "q": "What question does the lab \"Hit the target: marble off a table\" answer, and what are its variables?", "notes": ["Question: Can we predict where a horizontally launched marble will land?", "**Independent variable:** Launch speed (set by the release point on the ramp)", "**Dependent variable:** Range (horizontal distance to the landing point)"]}, {"section": "Labs and Measurement", "q": "Which formula does the lab use, and what are the steps?", "notes": ["**Formula:** t = √(2h ÷ g), then range = vx × t.", "Roll a marble down a ramp onto the table. Measure its speed across the table with a photogate, or time it over a marked 0.50 m.", "Measure the table height. Calculate the time of flight, then the predicted range.", "Place a paper target with carbon paper at the predicted spot, then release the marble.", "Calculate the percent error between predicted and measured range. Name two sources of error."]}], "quiz": [{"q": "One ball is dropped from a table. At the same instant an identical ball is launched horizontally from the same height. Ignore air resistance. Which hits the floor first?", "c": ["They hit at the same time", "The dropped ball", "The launched ball", "It depends on the launch speed"], "a": 0, "trap": "Sideways speed keeps an object in the air longer", "why": "Both balls start with zero vertical velocity and fall the same height at 9.8 m/s². Horizontal motion does not change vertical motion.", "lo": 1}, {"q": "A ball is kicked at an angle. At the highest point of its path, its velocity is:", "c": ["Horizontal, equal to its starting horizontal velocity", "Zero", "9.8 m/s downward", "Equal to its launch velocity"], "a": 0, "trap": "Velocity is zero at the top of every path", "why": "Only the vertical part of the velocity is zero at the top. The horizontal part has not changed, so the ball is still moving sideways.", "lo": 3}, {"q": "What is the acceleration of a projectile at the highest point of its path?", "c": ["9.8 m/s² downward", "Zero", "9.8 m/s² upward", "9.8 m/s² horizontal"], "a": 0, "trap": "No acceleration at the top", "why": "Gravity acts the whole time, so the acceleration is 9.8 m/s² downward at every point in the flight, including the top.", "lo": 1}, {"q": "Ignoring air resistance, what happens to the horizontal velocity of a projectile during its flight?", "c": ["It stays the same", "It decreases steadily", "It decreases going up and increases coming down", "It becomes zero at the top"], "a": 0, "trap": "A moving object naturally slows down", "why": "No horizontal force acts on the projectile, so there is no horizontal acceleration. The horizontal velocity is constant.", "lo": 1}, {"q": "A plane flying level at constant speed drops a package. Ignoring air resistance, where does the package land?", "c": ["Directly below the plane", "Far behind the plane", "Directly below the point where it was released", "Ahead of the plane"], "a": 0, "trap": "A released object loses its forward motion", "why": "The package keeps the plane's horizontal velocity while it falls, so it stays directly underneath the plane the whole way down.", "lo": 1}, {"q": "Two balls are launched at the same speed on level ground, one at 30° and one at 60°. How do their ranges compare?", "c": ["The ranges are equal", "The 30° ball goes farther", "The 60° ball goes farther", "The 60° ball goes twice as far"], "a": 0, "trap": "A higher angle always goes farther (or always shorter)", "why": "Complementary angles (adding to 90°) give the same range. The 60° ball goes higher and stays up longer, but has less horizontal velocity.", "lo": 4}, {"q": "A ball rolls off a table and lands 1 m away. It is rolled again at twice the speed. Compare the new time in the air and landing distance.", "c": ["Same time, lands 2 m away", "Twice the time, lands 2 m away", "Twice the time, lands 4 m away", "Half the time, lands 1 m away"], "a": 0, "trap": "Launch speed changes the fall time", "why": "Fall time depends only on the table height. With the same time and twice the horizontal velocity, the range doubles.", "lo": 4}, {"q": "A ball is launched at 30 m/s at 60° above the horizontal. What is its horizontal velocity?", "c": ["15 m/s", "26 m/s", "30 m/s", "52 m/s"], "a": 0, "trap": "Swapping sine and cosine", "why": "vx = v cos θ = 30 × cos 60° = 15 m/s. The 26 m/s answer is the vertical component (30 sin 60°).", "lo": 0}, {"q": "A ball is launched at 20 m/s at an angle and lands at the same height it started from. Ignoring air resistance, its speed just before landing is:", "c": ["20 m/s", "Zero", "Less than 20 m/s", "More than 20 m/s"], "a": 0, "trap": "Projectiles land slower (or faster) than they launch", "why": "The path is symmetric. vx is unchanged and vy has the same size as at launch, pointing down, so the speed is the same.", "lo": 3}, {"q": "A ball rolls horizontally off a 4.9 m high ledge at 6 m/s. How far from the base does it land?", "c": ["6 m", "4.9 m", "12 m", "29.4 m"], "a": 0, "trap": "Mixing horizontal and vertical values in one equation", "why": "Vertical: 4.9 = ½(9.8)t² gives t = 1 s. Horizontal: x = 6 m/s × 1 s = 6 m.", "lo": 2}], "practice": [["A ball is launched at 50 m/s at 37° above the horizontal. Find the horizontal and vertical components of its velocity.", "vx = 50 cos 37° = 39.9 m/s. vy = 50 sin 37° = 30.1 m/s."], ["A hiker walks 6 km east, then 8 km north. Find the magnitude and direction of the displacement.", "R = √(6² + 8²) = 10 km. θ = tan⁻¹(8 ÷ 6) = 53.1° north of east."], ["A ball rolls off a 19.6 m cliff at 15 m/s. Find the time of flight, the range, and the impact speed.", "t = √(2 × 19.6 ÷ 9.8) = 2.0 s. Range = 15 × 2.0 = 30 m. vy = 9.8 × 2.0 = 19.6 m/s, so speed = √(15² + 19.6²) = 24.7 m/s."], ["A soccer ball is kicked at 18 m/s at 40° on level ground. Find the time of flight, maximum height, and range.", "vx = 13.8 m/s, vy = 11.6 m/s. Total time = 2 × 11.57 ÷ 9.8 = 2.36 s. Height = 11.57² ÷ 19.6 = 6.83 m. Range = 13.79 × 2.36 = 32.6 m."], ["A dart thrown horizontally hits the board 0.10 m below where it was aimed. The board is 2.4 m away. How fast was the dart thrown?", "Vertical: 0.10 = ½(9.8)t², so t = 0.143 s. Horizontal: v = 2.4 ÷ 0.143 = 16.8 m/s."], ["Explain why a bullet fired horizontally and a bullet dropped from the same height hit level ground at the same time (ignore air resistance).", "Both start with zero vertical velocity and have the same downward acceleration, so they fall the same height in the same time. The fired bullet's horizontal velocity is independent of its fall."]], "resources": [["The Physics Classroom: Vectors and Projectiles", "https://www.physicsclassroom.com/class/vectors", "Tutorial lessons on vector components and both kinds of projectile problems."], ["PhET: Projectile Motion", "https://phet.colorado.edu/en/simulations/projectile-motion", "Fire a cannon, change angle and speed, and watch the velocity components."], ["Khan Academy: Two-dimensional motion", "https://www.khanacademy.org/science/physics/two-dimensional-motion", "Videos and practice on components and projectiles."], ["OpenStax Physics (high school)", "https://openstax.org/details/books/physics", "Free textbook. See the chapter on motion in two dimensions."]], "apps": ["Sports: basketball arc, soccer free kicks, long jump take-off angle.", "Aid drops and firefighting aircraft: release before the target, not above it.", "Water fountains and sprinklers: the stream traces a parabola.", "Video game physics engines update x and y motion separately each frame."], "ngss": ["HS-PS2-1"]}, {"slug": "newtons-laws", "num": 3, "title": "Newton's Laws", "subtitle": "Forces and motion", "pacing": "Weeks 8–11", "eq": "How do the forces acting on an object determine how its motion changes?", "targets": ["I can draw a free-body diagram that shows only the forces acting on one object.", "I can use Newton's first law to explain motion when forces are balanced.", "I can use F_net = ma to find acceleration, net force, or mass.", "I can tell mass from weight and calculate weight, normal force, and friction.", "I can identify Newton's third-law force pairs and explain why they do not cancel.", "I can analyze lab data to show how acceleration depends on net force and mass."], "concepts": [["Force", "A push or pull on an object, measured in newtons (N). A vector."], ["Net force", "The vector sum of all forces on one object. Net force, not any single force, sets the acceleration."], ["Inertia", "An object's resistance to a change in its motion. It depends only on mass."], ["Newton's second law", "a = F_net ÷ m. One newton accelerates 1 kg at 1 m/s²."], ["Weight vs. mass", "Mass is the amount of matter (kg) and never changes. Weight is the force of gravity on it (N): F_grav = mg."], ["Third-law pair", "Two forces, equal in size and opposite in direction, that act on two different objects."]], "cues": [{"section": "Forces and Free-Body Diagrams", "q": "What is a net force?", "notes": ["A **force** is a push or pull, measured in **newtons (N)**. It is a vector.", "The **net force** is the vector sum of all the forces on one object. Forces in the same direction add, opposite directions subtract.", "Example: 30 N right and 10 N left gives a net force of **20 N right**.", "**Balanced forces** (net force = 0) give no acceleration. **Unbalanced forces** give acceleration."]}, {"section": "Forces and Free-Body Diagrams", "q": "Which forces belong on a free-body diagram?", "notes": ["Only forces acting **on** the object you chose, drawn as arrows from a dot or box.", "**F_grav** (weight): Earth pulls down. **F_norm**: a surface pushes perpendicular to itself. **F_frict**: a surface opposes sliding. **F_tens**: a rope pulls. **F_app**: a person pushes or pulls. **F_air**: air resistance.", "Longer arrow = larger force. Do not draw velocity, and do not draw a \"force of motion\"."]}, {"section": "Newton's First Law (Inertia)", "q": "What does Newton's first law say?", "notes": ["An object at rest stays at rest, and an object in motion stays in motion at **constant velocity**, unless a **net force** acts on it.", "**Inertia** is the resistance to a change in motion. More mass = more inertia. Inertia does not depend on speed."]}, {"section": "Newton's First Law (Inertia)", "q": "Does a moving object need a force to keep it moving?", "notes": ["**No.** Force is needed to **change** motion, not to maintain it.", "A puck sliding on frictionless ice keeps the same speed and direction forever.", "On Earth things slow down because friction is an unbalanced force, not because motion \"runs out\".", "**Constant velocity means net force = 0.** Pushing a box at constant velocity with 50 N means friction is exactly 50 N."]}, {"section": "Newton's Second Law", "q": "How are net force, mass, and acceleration related?", "notes": ["**a = F_net ÷ m**, or **F_net = ma**. Units: 1 N = 1 kg·m/s².", "Acceleration is **directly proportional to net force**: double the force, double the acceleration.", "Acceleration is **inversely proportional to mass**: double the mass, half the acceleration.", "The acceleration points in the direction of the net force."]}, {"section": "Newton's Second Law", "q": "A 1200 kg car has a 4000 N engine force and 1000 N of friction. What is its acceleration?", "notes": ["Object: the car. Horizontal forces: 4000 N forward, 1000 N backward.", "F_net = 4000 − 1000 = **3000 N forward**.", "a = F_net ÷ m = 3000 ÷ 1200 = **2.5 m/s² forward**.", "Sense check: use the net force, never just the engine force."]}, {"section": "Weight, Normal Force, and Friction", "q": "What is the difference between mass and weight?", "notes": ["**Mass** (kg) is the amount of matter. It is the same everywhere.", "**Weight** (N) is the force of gravity: **F_grav = mg**, with g = 9.8 m/s² on Earth.", "Worked example: a 60 kg student weighs 60 × 9.8 = **588 N** on Earth. On the Moon (g = 1.6 m/s²) the mass is still 60 kg, but the weight is **96 N**."]}, {"section": "Weight, Normal Force, and Friction", "q": "Which object exerts the normal force, and when does it equal the weight?", "notes": ["The **surface** exerts the normal force, perpendicular to the surface.", "**F_norm = mg only** on a level surface with no other vertical forces and no vertical acceleration.", "In an elevator accelerating upward, F_norm is greater than the weight: F_norm = m(g + a)."]}, {"section": "Weight, Normal Force, and Friction", "q": "How do you calculate friction?", "notes": ["**F_frict = μ × F_norm.** μ (mu) is the coefficient of friction and has no units.", "**Kinetic friction** acts on sliding objects. **Static friction** matches the push, up to a maximum, on objects that are not sliding.", "Worked example: a 10 kg crate is pulled with 50 N along a level floor, μ = 0.30. F_norm = 10 × 9.8 = 98 N. F_frict = 0.30 × 98 = 29.4 N. F_net = 50 − 29.4 = 20.6 N. a = 20.6 ÷ 10 = **2.06 m/s²**."]}, {"section": "Newton's Third Law", "q": "What does Newton's third law say about a pair of forces?", "notes": ["If object A pushes on object B, then B pushes on A with a force **equal in size and opposite in direction**.", "The two forces act on **different objects** and are the same type of force.", "Pattern: \"A on B\" pairs with \"B on A\". Earth pulls the book down; the book pulls Earth up."]}, {"section": "Newton's Third Law", "q": "If the forces are equal and opposite, why don't they cancel?", "notes": ["Forces cancel only when they act on the **same object**. Third-law forces act on different objects.", "A truck and a small car collide: the forces on each are **equal**. The car's acceleration is larger because its mass is smaller (a = F ÷ m).", "Worked example: a 60 kg skater pushes a 40 kg skater with 120 N. Each feels 120 N. a = 120 ÷ 60 = **2 m/s²** one way and 120 ÷ 40 = **3 m/s²** the other way."]}, {"section": "Labs and Measurement", "q": "What question does the lab \"Cart and hanging mass (Newton's second law)\" answer, and what are its variables?", "notes": ["Question: How does the acceleration of a cart depend on the net force on it and on its mass?", "**Independent variable:** Part A: net force (weight of the hanging mass). Part B: total mass of the system.", "**Dependent variable:** Acceleration of the cart"]}, {"section": "Labs and Measurement", "q": "Which formula does the lab use, and what are the steps?", "notes": ["**Formula:** a = F_net ÷ m_total. On a graph of acceleration against net force, slope = 1 ÷ mass.", "Connect a cart to a hanging mass with a string over a pulley. Measure acceleration with a motion sensor or photogates.", "Part A: move masses from the cart to the hanger so the total mass stays constant while the force changes. Record acceleration for five forces.", "Part B: keep the hanging mass constant and add mass to the cart. Record acceleration for five masses.", "Graph acceleration against net force, and acceleration against 1 ÷ mass. State the claim the data supports (HS-PS2-1)."]}], "quiz": [{"q": "You push a box across a rough floor at constant velocity with a horizontal force of 50 N. How large is the friction force on the box?", "c": ["Exactly 50 N", "Less than 50 N", "More than 50 N", "Zero"], "a": 0, "trap": "Motion requires a net force", "why": "Constant velocity means zero acceleration, so the net force is zero. Friction must exactly balance the 50 N push.", "lo": 1}, {"q": "A large truck collides head-on with a small car. During the collision, how does the force on the car compare with the force on the truck?", "c": ["The forces are equal in size", "The force on the car is larger", "The force on the truck is larger", "Only the car experiences a force"], "a": 0, "trap": "The bigger object exerts the bigger force", "why": "Newton's third law: the two forces are equal in size and opposite in direction. The car is damaged more because its smaller mass gives it a much larger acceleration.", "lo": 4}, {"q": "A ball is thrown straight up. Ignoring air resistance, which forces act on the ball at the top of its path?", "c": ["Only gravity, downward", "Gravity down and the force of the throw up, balanced", "No forces act at the top", "Only the force of the throw"], "a": 0, "trap": "A force of the throw stays with the object", "why": "The hand stops pushing when the ball leaves it. After that, gravity is the only force, all the way up and all the way down.", "lo": 0}, {"q": "A hockey puck slides across perfectly frictionless ice after leaving the stick. What happens to it?", "c": ["It keeps moving at constant velocity", "It gradually slows and stops", "It speeds up", "It stops as soon as the stick's force is gone"], "a": 0, "trap": "Objects naturally slow down without a force", "why": "With no net force, velocity does not change (first law). Slowing down would need an unbalanced force such as friction.", "lo": 1}, {"q": "An astronaut travels from Earth to the Moon. Compared with on Earth, on the Moon the astronaut has:", "c": ["The same mass and less weight", "Less mass and less weight", "The same mass and the same weight", "Less mass and the same weight"], "a": 0, "trap": "Mass and weight are the same thing", "why": "Mass is the amount of matter and does not change. Weight is the force of gravity (mg), and g is smaller on the Moon.", "lo": 3}, {"q": "The net force on a cart is doubled, and the cart's mass is also doubled. What happens to its acceleration?", "c": ["It stays the same", "It doubles", "It becomes four times larger", "It is cut in half"], "a": 0, "trap": "More force always means more acceleration", "why": "a = F_net ÷ m. Doubling the top and the bottom of the fraction leaves it unchanged.", "lo": 2}, {"q": "A book rests on a table. Earth pulls down on the book. What is the third-law partner of that force?", "c": ["The book pulling up on Earth", "The table pushing up on the book", "The book pushing down on the table", "The floor pushing up on the table"], "a": 0, "trap": "The normal force is the reaction to weight", "why": "Swap the objects: \"Earth on book\" pairs with \"book on Earth\". The normal force balances the weight here, but it acts on the same object and is a different type of force, so it is not the third-law partner.", "lo": 4}, {"q": "You stand on a bathroom scale in an elevator that is moving upward at constant speed. The scale reads:", "c": ["Your normal weight", "More than your normal weight", "Less than your normal weight", "Zero"], "a": 0, "trap": "Moving upward means a larger upward force", "why": "Constant speed means zero acceleration, so the forces balance and the scale reads mg. It reads more only while the elevator accelerates upward.", "lo": 1}, {"q": "A horse pulls a cart, and the cart pulls back on the horse with an equal force. Why can the cart still speed up?", "c": ["The two forces act on different objects, and the net force on the cart is forward", "The horse's pull is slightly larger than the cart's pull", "The cart's pull comes a moment after the horse's pull", "It cannot speed up, it can only move at constant speed"], "a": 0, "trap": "Third-law pairs cancel each other", "why": "Only forces on the cart decide the cart's acceleration. The horse's pull forward is larger than the friction on the cart, so the cart has a forward net force.", "lo": 4}, {"q": "A heavy box sits on the floor. Its maximum static friction is 35 N. You push it horizontally with 20 N and it does not move. How large is the friction force?", "c": ["20 N", "35 N", "15 N", "Zero"], "a": 0, "trap": "Static friction is always at its maximum", "why": "The box is at rest, so the net force is zero. Static friction matches the push, 20 N. It only reaches 35 N just before the box starts to slide.", "lo": 3}], "practice": [["What net force gives a 0.15 kg ball an acceleration of 40 m/s²?", "F_net = ma = 0.15 × 40 = 6 N."], ["A 1500 kg car goes from rest to 20 m/s in 8 s. Find its acceleration and the net force on it.", "a = 20 ÷ 8 = 2.5 m/s². F_net = 1500 × 2.5 = 3750 N."], ["A 70 kg astronaut stands on Earth, then on the Moon (g = 1.6 m/s²). Find the weight in each place.", "Earth: 70 × 9.8 = 686 N. Moon: 70 × 1.6 = 112 N. Mass is 70 kg in both places."], ["A 20 kg sled is pulled along level snow with a horizontal 80 N force. The coefficient of kinetic friction is 0.25. Find the acceleration.", "F_norm = 20 × 9.8 = 196 N. F_frict = 0.25 × 196 = 49 N. F_net = 80 − 49 = 31 N. a = 31 ÷ 20 = 1.55 m/s²."], ["A 50 kg person stands on a scale in an elevator accelerating upward at 2 m/s². What does the scale read?", "F_norm − mg = ma, so F_norm = m(g + a) = 50 × (9.8 + 2) = 590 N."], ["Two skaters, 50 kg and 75 kg, push off each other from rest. The 50 kg skater accelerates at 3 m/s². Find the force between them and the other skater's acceleration.", "F = 50 × 3 = 150 N on each skater. a = 150 ÷ 75 = 2 m/s², in the opposite direction."]], "resources": [["The Physics Classroom: Newton's Laws", "https://www.physicsclassroom.com/class/newtlaws", "Tutorial lessons on all three laws, free-body diagrams, and friction."], ["PhET: Forces and Motion: Basics", "https://phet.colorado.edu/en/simulations/forces-and-motion-basics", "Tug of war, pushing crates with friction, and live net-force arrows."], ["Khan Academy: Forces and Newton's laws of motion", "https://www.khanacademy.org/science/physics/forces-newtons-laws", "Videos and practice on each law, normal force, and friction."], ["OpenStax Physics (high school)", "https://openstax.org/details/books/physics", "Free textbook. See the chapter on forces and Newton's laws of motion."]], "apps": ["Seat belts and headrests: your body keeps moving (or stays still) when the car does not.", "Rocket launches: the engine pushes gas down, the gas pushes the rocket up.", "Anti-lock brakes and tire tread: controlling friction to control acceleration.", "Why you feel heavier when an elevator starts upward and lighter when it starts down."], "ngss": ["HS-PS2-1", "HS-PS2-4"]}, {"slug": "momentum", "num": 4, "title": "Momentum", "subtitle": "Impulse and collisions", "pacing": "Weeks 12–14", "eq": "Why is the total momentum the same before and after a collision, and how can we use that to make collisions safer?", "targets": ["I can calculate momentum and treat it as a vector with a sign.", "I can use impulse = FΔt = Δp to find force, time, or change in velocity.", "I can explain how increasing collision time reduces force.", "I can use conservation of momentum to solve collision and recoil problems.", "I can classify collisions as elastic or inelastic by checking kinetic energy.", "I can design and test a device that reduces the force in a collision."], "concepts": [["Momentum", "Mass in motion: p = mv, in kg·m/s. A vector in the direction of the velocity."], ["Impulse", "Force multiplied by the time it acts: J = FΔt, in N·s. Equal to the area under a force-time graph."], ["Impulse-momentum theorem", "Impulse equals the change in momentum: FΔt = Δp = mΔv."], ["Isolated system", "A group of objects with no net external force on it."], ["Conservation of momentum", "In an isolated system, total momentum before = total momentum after."], ["Elastic vs. inelastic", "Elastic collisions also conserve kinetic energy. Inelastic collisions do not. Momentum is conserved in both."]], "cues": [{"section": "Momentum", "q": "What is momentum, and what are its units?", "notes": ["**Momentum = mass × velocity: p = mv.** Units: **kg·m/s**.", "It is a **vector**. Choose a positive direction. Motion the other way has negative momentum.", "Worked example: a 0.145 kg baseball at 40 m/s has p = 0.145 × 40 = **5.8 kg·m/s**.", "A slow truck can have more momentum than a fast car: 5000 kg × 2 m/s = 10 000 kg·m/s, and 1000 kg × 8 m/s = 8000 kg·m/s."]}, {"section": "Momentum", "q": "How do you find the total momentum of two objects moving in opposite directions?", "notes": ["Add the momenta **with their signs**.", "Example: 2 kg at +3 m/s and 2 kg at −3 m/s. Total = (+6) + (−6) = **0 kg·m/s**."]}, {"section": "Impulse and the Impulse-Momentum Theorem", "q": "What is impulse, and how is it related to momentum?", "notes": ["**Impulse = force × time: J = FΔt.** Units: N·s (the same as kg·m/s).", "**Impulse-momentum theorem: FΔt = Δp = m(v − v₀).**", "On a force-time graph, **impulse = area under the graph**.", "Worked example: a 50 N force acts for 4 s on a 10 kg cart at rest. Impulse = 200 N·s, so Δv = 200 ÷ 10 = **20 m/s**."]}, {"section": "Impulse and the Impulse-Momentum Theorem", "q": "Why does an airbag reduce the force on a passenger?", "notes": ["The passenger's change in momentum is **the same** with or without the airbag (same mass, same speed to zero).", "The airbag **increases the stopping time**, so the force is smaller: F = Δp ÷ Δt.", "Worked example: a 1000 kg car stops from 20 m/s, so Δp = 20 000 kg·m/s. In 0.1 s: F = **200 000 N**. In 2 s: F = **10 000 N**.", "Same idea: bending your knees when landing, crumple zones, helmets, padded gym floors."]}, {"section": "Impulse and the Impulse-Momentum Theorem", "q": "Which has the greater change in momentum, a ball that bounces or one that sticks?", "notes": ["**The ball that bounces.** Its velocity reverses, so Δv is larger.", "Worked example: a 0.5 kg ball hits a wall at 6 m/s and rebounds at 4 m/s. Δp = 0.5 × (−4 − 6) = −5, so the size is **5 kg·m/s**. If it stuck: 0.5 × (0 − 6) gives only **3 kg·m/s**."]}, {"section": "Conservation of Momentum", "q": "When is the total momentum of a system conserved?", "notes": ["When the system is **isolated**: no net external force acts on it.", "**Total momentum before = total momentum after.** m₁v₁ + m₂v₂ = m₁v₁′ + m₂v₂′.", "This comes from Newton's third law: during the collision the objects exert equal and opposite forces for the same time, so their momentum changes are equal and opposite."]}, {"section": "Conservation of Momentum", "q": "A 2 kg cart at 3 m/s hits a 1 kg cart at rest and they stick. What is their speed afterward?", "notes": ["System: both carts. Before: (2)(3) + (1)(0) = 6 kg·m/s.", "After they stick they move as one object: (2 + 1)v = 6.", "v = 6 ÷ 3 = **2 m/s**, in the original direction.", "Sense check: the combined mass is larger, so the speed must be smaller than 3 m/s."]}, {"section": "Collisions and Explosions", "q": "What is the difference between elastic and inelastic collisions?", "notes": ["**Elastic**: objects bounce apart, and kinetic energy is conserved.", "**Inelastic**: some kinetic energy becomes heat, sound, and deformation. **Perfectly inelastic**: the objects stick together.", "**Momentum is conserved in every type.**", "Check with the sticking carts above: KE before = ½(2)(3²) = 9 J. KE after = ½(3)(2²) = 6 J. **3 J** went to heat, sound, and deformation."]}, {"section": "Collisions and Explosions", "q": "How does conservation of momentum explain recoil?", "notes": ["Before an \"explosion\" (a push-off, a throw, a shot) total momentum is **zero**. Afterward it must still be zero.", "The two pieces get **equal and opposite momentum**. The lighter piece moves faster.", "Worked example: a 60 kg skater at rest throws a 3 kg ball at 10 m/s. 0 = (3)(10) + (60)v, so v = **−0.5 m/s** (backward)."]}, {"section": "Labs and Measurement", "q": "What question does the lab \"Colliding carts, plus the egg-drop design challenge\" answer, and what are its variables?", "notes": ["Question: Is total momentum the same before and after a collision? How can a design reduce the force of an impact?", "**Independent variable:** Cart masses and type of collision (bounce or stick)", "**Dependent variable:** Velocity of each cart before and after the collision"]}, {"section": "Labs and Measurement", "q": "Which formula does the lab use, and what are the steps?", "notes": ["**Formula:** p = mv for each cart. Compare Σp before with Σp after: percent difference = |before − after| ÷ before × 100.", "On a low-friction track, measure each cart's velocity before and after a collision with motion sensors or photogates.", "Run a sticking (Velcro) collision and a bouncing (magnet or spring) collision, with equal and unequal masses.", "Calculate total momentum and total kinetic energy before and after. Decide which collisions are elastic.", "Design challenge (HS-PS2-3): build a device that protects an egg in a drop. Explain the design using FΔt = Δp, test, and refine."]}], "quiz": [{"q": "Two identical balls hit a wall at the same speed. One sticks to the wall and the other bounces back. Which ball receives the greater impulse from the wall?", "c": ["The ball that bounces", "The ball that sticks", "They receive the same impulse", "Neither receives an impulse"], "a": 0, "trap": "Stopping completely is the biggest change", "why": "The bouncing ball's velocity reverses, so its change in momentum is larger than just going to zero. Larger Δp means larger impulse.", "lo": 1}, {"q": "In a crash, how does an airbag protect a passenger compared with hitting the dashboard?", "c": ["Same change in momentum, longer stopping time, smaller force", "It reduces the passenger's change in momentum", "It reduces the impulse on the passenger", "It stops the passenger in a shorter time"], "a": 0, "trap": "Padding reduces the momentum change or the impulse", "why": "The passenger goes from the same speed to zero either way, so Δp and the impulse are the same. The airbag spreads that impulse over a longer time, so the force is smaller.", "lo": 2}, {"q": "A bug hits the windshield of a moving truck. Compare the sizes of the changes in momentum of the bug and the truck.", "c": ["They are equal", "The bug's is larger", "The truck's is larger", "The truck's momentum does not change at all"], "a": 0, "trap": "The object that is affected more has the bigger momentum change", "why": "The forces are equal and opposite and act for the same time, so the impulses and momentum changes are equal in size. The bug's velocity changes far more because its mass is tiny.", "lo": 3}, {"q": "Two clay balls collide and stick together. Which statement is true for the system of both balls?", "c": ["Momentum is conserved, kinetic energy is not", "Both momentum and kinetic energy are conserved", "Kinetic energy is conserved, momentum is not", "Neither is conserved"], "a": 0, "trap": "Momentum is lost in a sticky collision", "why": "Momentum is conserved in every collision in an isolated system. In an inelastic collision some kinetic energy becomes heat, sound, and deformation.", "lo": 4}, {"q": "A 2 kg cart moves right at 3 m/s. Another 2 kg cart moves left at 3 m/s. What is the total momentum of the system?", "c": ["0 kg·m/s", "12 kg·m/s", "6 kg·m/s", "3 kg·m/s"], "a": 0, "trap": "Adding momentum without direction", "why": "Momentum is a vector. (+6) + (−6) = 0. Adding the sizes to get 12 ignores direction.", "lo": 0}, {"q": "A 2 kg cart moving at 6 m/s hits a 4 kg cart at rest and they stick together. What is their speed afterward?", "c": ["2 m/s", "3 m/s", "6 m/s", "4 m/s"], "a": 0, "trap": "Averaging the speeds, or using only one mass", "why": "Before: 2 × 6 = 12 kg·m/s. After: (2 + 4)v = 12, so v = 2 m/s. Use the combined mass.", "lo": 3}, {"q": "A 500 kg cannon at rest fires a 5 kg ball at 100 m/s. What is the cannon's recoil speed?", "c": ["1 m/s", "100 m/s", "10 m/s", "0.1 m/s"], "a": 0, "trap": "Both pieces get the same speed", "why": "Total momentum stays zero: 5 × 100 = 500 × v, so v = 1 m/s backward. The pieces share equal momentum, not equal speed.", "lo": 3}, {"q": "Force A is 10 N acting for 3 s. Force B is 30 N acting for 1 s. Which delivers the greater impulse to the same object?", "c": ["They deliver the same impulse", "Force B, because it is larger", "Force A, because it lasts longer", "It depends on the object's mass"], "a": 0, "trap": "The bigger force gives the bigger impulse", "why": "Impulse = FΔt. Both are 30 N·s, so both change the object's momentum by the same amount.", "lo": 1}, {"q": "A car doubles its speed. What happens to its momentum?", "c": ["It doubles", "It becomes four times larger", "It stays the same", "It is cut in half"], "a": 0, "trap": "Confusing momentum with kinetic energy", "why": "p = mv, so momentum is proportional to speed and doubles. Kinetic energy (½mv²) is the quantity that becomes four times larger.", "lo": 0}, {"q": "A 40 kg child and an 80 kg adult stand at rest on ice and push off each other. Just after the push, how do their momenta and speeds compare?", "c": ["Equal and opposite momenta, and the child moves twice as fast", "Equal speeds, and the adult has more momentum", "The child has more momentum and more speed", "Equal momenta and equal speeds"], "a": 0, "trap": "Equal forces give equal speeds", "why": "Total momentum starts at zero and stays zero, so the momenta are equal and opposite. With half the mass, the child needs twice the speed.", "lo": 3}], "practice": [["Find the momentum of a 1200 kg car traveling at 25 m/s.", "p = 1200 × 25 = 30 000 kg·m/s in the direction of travel."], ["A 0.060 kg tennis ball arrives at 20 m/s and is hit back at 30 m/s. The racket touches it for 0.005 s. Find the change in momentum and the average force.", "Δv = 30 − (−20) = 50 m/s. Δp = 0.060 × 50 = 3.0 kg·m/s. F = 3.0 ÷ 0.005 = 600 N."], ["A 50 N net force acts for 4 s on a 10 kg cart at rest. Find the impulse and the final velocity.", "Impulse = 50 × 4 = 200 N·s. v = 200 ÷ 10 = 20 m/s."], ["A 3 kg cart at 4 m/s hits a 1 kg cart at rest and they stick. Find the final speed and the kinetic energy lost.", "(3)(4) = (4)v, so v = 3 m/s. KE before = ½(3)(4²) = 24 J. KE after = ½(4)(3²) = 18 J. Lost: 6 J."], ["An 80 kg astronaut at rest throws a 2 kg tool at 6 m/s. How fast, and in which direction, does the astronaut move?", "0 = (2)(6) + (80)v, so v = −0.15 m/s: 0.15 m/s opposite to the tool."], ["A 0.5 kg cart at 2 m/s hits an identical cart at rest in an elastic collision. The first cart stops. Find the second cart's speed and show the collision is elastic.", "Momentum: (0.5)(2) = (0.5)v, so v = 2 m/s. KE before = ½(0.5)(2²) = 1 J. KE after = 1 J. Kinetic energy is conserved, so it is elastic."]], "resources": [["The Physics Classroom: Momentum and Its Conservation", "https://www.physicsclassroom.com/class/momentum", "Tutorial lessons on impulse, collisions, and explosions."], ["PhET: Collision Lab", "https://phet.colorado.edu/en/simulations/collision-lab", "Set masses, speeds, and elasticity. Watch momentum and kinetic energy before and after."], ["Khan Academy: Impacts and linear momentum", "https://www.khanacademy.org/science/physics/linear-momentum", "Videos and practice on impulse and conservation of momentum."], ["OpenStax Physics (high school)", "https://openstax.org/details/books/physics", "Free textbook. See the chapter on momentum."]], "apps": ["Car safety engineering: airbags, crumple zones, seat belts that stretch.", "Sports: following through on a swing, catching with \"soft hands\", helmet padding.", "Rockets and jet engines: throwing mass backward to gain forward momentum.", "Crash investigation: police reconstruct speeds from skid marks and conservation of momentum."], "ngss": ["HS-PS2-2", "HS-PS2-3", "HS-ETS1-2 / HS-ETS1-3"]}, {"slug": "work-and-energy", "num": 5, "title": "Work & Energy", "subtitle": "Work, energy, and power", "pacing": "Weeks 15–18", "eq": "How can tracking energy let us predict motion without knowing every force along the way?", "targets": ["I can calculate the work done by a force, including at an angle, and say when work is zero or negative.", "I can calculate kinetic energy and use the work-energy theorem.", "I can calculate gravitational and elastic potential energy.", "I can use conservation of mechanical energy to find a speed or height.", "I can account for energy transformed to thermal energy by friction.", "I can calculate power and compare how quickly work is done."], "concepts": [["Work", "Energy transferred by a force acting through a distance: W = Fd cos θ, in joules (J)."], ["Kinetic energy", "Energy of motion: KE = ½mv². Depends on the square of the speed."], ["Potential energy", "Stored energy of position: gravitational PE = mgh, elastic PE = ½kx²."], ["Work-energy theorem", "Net work on an object equals its change in kinetic energy: W_net = ΔKE."], ["Conservation of energy", "Energy is never created or destroyed. It is transferred or transformed. Without friction, KE + PE stays constant."], ["Power", "Rate of doing work: P = W ÷ t, in watts (W)."]], "cues": [{"section": "Work", "q": "How do you calculate the work done by a force?", "notes": ["**W = Fd cos θ**, where θ is the angle between the force and the displacement. Units: **joule (J) = N·m**.", "Only the part of the force **along the direction of motion** does work.", "Worked example: you pull a sled with 50 N at 60° above horizontal for 10 m. W = 50 × 10 × cos 60° = **250 J**.", "On a force-displacement graph, **work = area under the graph**."]}, {"section": "Work", "q": "When is the work done by a force zero or negative?", "notes": ["**Zero** when there is no displacement (holding a heavy bag still, pushing a wall).", "**Zero** when the force is perpendicular to the motion (carrying a box across a level floor: the upward force does no work).", "**Negative** when the force opposes the motion. Friction does negative work and removes kinetic energy."]}, {"section": "Kinetic Energy and the Work-Energy Theorem", "q": "What is kinetic energy, and how does it depend on speed?", "notes": ["**KE = ½mv².** Units: joules.", "KE depends on **speed squared**. Double the speed, **four times** the kinetic energy.", "Worked example: a 1000 kg car at 20 m/s has KE = ½(1000)(20²) = **200 000 J**. At 40 m/s it has **800 000 J**."]}, {"section": "Kinetic Energy and the Work-Energy Theorem", "q": "What does the work-energy theorem say?", "notes": ["**Net work = change in kinetic energy: W_net = ΔKE.**", "Worked example: a 200 N net force pushes a 10 kg cart from rest for 5 m. W = 200 × 5 = 1000 J = ½(10)v², so v = √200 = **14.1 m/s**.", "This is why stopping distance is four times longer at double the speed: the brakes must remove four times the kinetic energy with the same force."]}, {"section": "Potential Energy", "q": "How do you calculate gravitational potential energy?", "notes": ["**PE = mgh.** h is the height above a reference level that you choose.", "Worked example: a 2 kg book on a 1.5 m shelf has PE = 2 × 9.8 × 1.5 = **29.4 J** relative to the floor.", "Only **changes** in height matter. The path taken to get there does not."]}, {"section": "Potential Energy", "q": "How do you calculate the energy stored in a spring?", "notes": ["**Elastic PE = ½kx².** k is the spring constant (N/m) and x is the stretch or compression (m).", "Worked example: a spring with k = 200 N/m compressed 0.10 m stores ½(200)(0.10²) = **1.0 J**.", "Hooke's law gives the spring force: F = kx."]}, {"section": "Conservation of Mechanical Energy", "q": "When is mechanical energy conserved?", "notes": ["When only gravity and springs do work (no friction or air resistance): **KE + PE at the start = KE + PE at the end**.", "Energy changes form, PE to KE and back, but the total stays the same.", "Energy bar charts (LOL charts) show this: the bars change, the total height does not."]}, {"section": "Conservation of Mechanical Energy", "q": "How fast is a roller coaster going at the bottom of a 20 m hill if it starts from rest?", "notes": ["Top: all PE = mgh. Bottom: all KE = ½mv².", "mgh = ½mv². **The mass cancels**: v = √(2gh).", "v = √(2 × 9.8 × 20) = √392 = **19.8 m/s**.", "Sense check: the answer is the same for any mass and any shape of track, as long as there is no friction."]}, {"section": "Conservation of Mechanical Energy", "q": "Where does the energy go when there is friction?", "notes": ["Friction transforms mechanical energy into **thermal energy**. It is not destroyed.", "**Thermal energy = mechanical energy at the start − mechanical energy at the end.**", "Worked example: a 2 kg block starts at rest 5 m up a ramp and arrives at the bottom at 8 m/s. Start: 2 × 9.8 × 5 = 98 J. End: ½(2)(8²) = 64 J. **34 J** became thermal energy."]}, {"section": "Power", "q": "What is power, and what are its units?", "notes": ["**Power = work ÷ time: P = W ÷ t.** Units: **watt (W) = J/s**. 1 horsepower = 746 W.", "The same work done in less time means more power. For a constant force along the motion, P = Fv.", "Worked example: a 600 N student climbs 3 m of stairs in 4 s. W = 600 × 3 = 1800 J. P = 1800 ÷ 4 = **450 W**."]}, {"section": "Labs and Measurement", "q": "What question does the lab \"Energy on a ramp (or pendulum)\" answer, and what are its variables?", "notes": ["Question: Does the potential energy lost by a cart equal the kinetic energy it gains?", "**Independent variable:** Release height", "**Dependent variable:** Speed at the bottom"]}, {"section": "Labs and Measurement", "q": "Which formula does the lab use, and what are the steps?", "notes": ["**Formula:** Compare mgh at the release point with ½mv² at the bottom. Efficiency = KE gained ÷ PE lost × 100.", "Release a cart from rest at five measured heights on a ramp. Measure its speed at the bottom with a photogate.", "Calculate PE at the top and KE at the bottom for each height.", "Graph KE against PE. A slope near 1 supports conservation of energy. Explain where any missing energy went.", "Extension (HS-PS3-1): build a spreadsheet model that predicts speed for any height and compare it with your data."]}], "quiz": [{"q": "You carry a heavy box across a level floor at constant velocity. How much work does your upward lifting force do on the box?", "c": ["Zero", "Force × distance walked", "Weight × height of the box", "It depends on how fast you walk"], "a": 0, "trap": "Effort always means work is done", "why": "Work needs a force component along the motion. The upward force is perpendicular to the horizontal displacement, so cos 90° = 0 and the work is zero.", "lo": 0}, {"q": "A car's speed doubles from 10 m/s to 20 m/s. Its kinetic energy becomes:", "c": ["Four times larger", "Twice as large", "Eight times larger", "The same"], "a": 0, "trap": "Kinetic energy is proportional to speed", "why": "KE = ½mv². Speed is squared, so doubling it multiplies kinetic energy by 2² = 4.", "lo": 1}, {"q": "Two frictionless ramps have the same height. One is steep and one is gentle. A block slides from rest down each. Compare the speeds at the bottom.", "c": ["The speeds are equal", "Faster on the steep ramp", "Faster on the gentle ramp", "It depends on the block's mass"], "a": 0, "trap": "A steeper ramp gives a higher final speed", "why": "Both blocks lose the same potential energy (same height), so they gain the same kinetic energy. The steep ramp just gets there sooner.", "lo": 3}, {"q": "A 1 kg ball and a 10 kg ball are dropped from the same height. Ignoring air resistance, compare their speeds and kinetic energies just before landing.", "c": ["Same speed, and the 10 kg ball has more kinetic energy", "The 10 kg ball has more speed and more kinetic energy", "Same speed and same kinetic energy", "The 1 kg ball has more speed"], "a": 0, "trap": "More energy means more speed", "why": "mgh = ½mv², and the mass cancels, so the speeds are equal. Kinetic energy still depends on mass, so the heavier ball has ten times more.", "lo": 3}, {"q": "A weightlifter holds a 1000 N barbell motionless above their head for 5 seconds. How much work is done on the barbell during those 5 seconds?", "c": ["Zero", "5000 J", "200 J", "1000 J"], "a": 0, "trap": "Getting tired means doing work", "why": "Work = force × displacement. The barbell does not move, so no work is done on it, even though the lifter's muscles use energy.", "lo": 0}, {"q": "A sled slides across level ground and friction brings it to a stop. What happened to its kinetic energy?", "c": ["It was transformed into thermal energy", "It was destroyed", "It was converted into potential energy", "It is still stored in the sled as kinetic energy"], "a": 0, "trap": "Energy gets used up", "why": "Energy is never destroyed. Friction transforms the kinetic energy into thermal energy, slightly warming the sled and the ground.", "lo": 4}, {"q": "Two students with the same weight climb the same stairs. Ana takes 5 s and Ben takes 10 s. Compare the work they do and their power.", "c": ["Same work, and Ana has twice the power", "Ana does more work and has more power", "Same work and same power", "Ben does more work because it takes longer"], "a": 0, "trap": "Faster means more work", "why": "Work = weight × height, the same for both. Power = work ÷ time, so half the time means twice the power.", "lo": 5}, {"q": "A pendulum swings back and forth. Where is its kinetic energy greatest?", "c": ["At the lowest point of the swing", "At the highest points", "Halfway between the lowest and highest points", "It is the same everywhere"], "a": 0, "trap": "Mixing up where kinetic and potential energy peak", "why": "At the lowest point the potential energy is smallest, so the kinetic energy and speed are greatest. At the highest points the bob stops for an instant.", "lo": 3}, {"q": "A car traveling at 30 km/h can brake to a stop in 10 m. With the same braking force, how far does it need at 60 km/h?", "c": ["40 m", "20 m", "30 m", "10 m"], "a": 0, "trap": "Double the speed, double the stopping distance", "why": "The brakes must remove all the kinetic energy: F × d = ½mv². Double the speed means four times the energy, so four times the distance.", "lo": 1}, {"q": "A ball is thrown straight up. When it has reached half of its maximum height, it has:", "c": ["Half of its starting kinetic energy", "Half of its starting speed", "No kinetic energy", "All of its starting kinetic energy"], "a": 0, "trap": "Half the height means half the speed", "why": "At half the maximum height, half of the energy is potential, so half is still kinetic. Because KE depends on v², the speed is about 71% of the starting speed, not 50%.", "lo": 3}], "practice": [["A 40 N force pulls a crate 6 m across a floor. Find the work done if the force is (a) horizontal, (b) at 60° above horizontal.", "(a) W = 40 × 6 = 240 J. (b) W = 40 × 6 × cos 60° = 120 J."], ["Find the kinetic energy of a 0.40 kg soccer ball moving at 15 m/s.", "KE = ½(0.40)(15²) = 45 J."], ["A 55 kg diver stands on a 10 m platform. Find the potential energy relative to the water, and the speed on reaching the water.", "PE = 55 × 9.8 × 10 = 5390 J. v = √(2 × 9.8 × 10) = 14 m/s."], ["A roller coaster car is moving at 12 m/s at the bottom of a frictionless hill. How high can it climb?", "½mv² = mgh, so h = v² ÷ (2g) = 144 ÷ 19.6 = 7.35 m."], ["A 3 kg block slides from rest down a 4 m high ramp. (a) Find its speed at the bottom with no friction. (b) If it actually arrives at 7 m/s, how much energy became thermal energy?", "(a) v = √(2 × 9.8 × 4) = 8.85 m/s. (b) Start: 3 × 9.8 × 4 = 117.6 J. End: ½(3)(7²) = 73.5 J. Thermal: 44.1 J."], ["A motor lifts a 200 kg load 15 m in 10 s at constant speed. Find the work done and the power in watts and horsepower.", "W = 200 × 9.8 × 15 = 29 400 J. P = 29 400 ÷ 10 = 2940 W = 3.9 hp."]], "resources": [["The Physics Classroom: Work, Energy, and Power", "https://www.physicsclassroom.com/class/energy", "Tutorial lessons on work, energy types, conservation, and power."], ["PhET: Energy Skate Park", "https://phet.colorado.edu/en/simulations/energy-skate-park", "Build a track and watch energy bar charts change as a skater rides, with and without friction."], ["Khan Academy: Work and energy", "https://www.khanacademy.org/science/physics/work-and-energy", "Videos and practice on work, kinetic and potential energy, and conservation."], ["OpenStax Physics (high school)", "https://openstax.org/details/books/physics", "Free textbook. See the chapter on work, energy, and simple machines."]], "apps": ["Roller coaster design: the first hill must be the tallest.", "Hydroelectric dams: gravitational potential energy of water becomes electrical energy.", "Regenerative braking in electric and hybrid cars recovers kinetic energy instead of heating the brakes.", "Food labels and exercise: a Calorie is a unit of energy (1 Cal = 4184 J), and a watt is how fast you use it."], "ngss": ["HS-PS3-1", "HS-PS3-2", "HS-PS3-3"]}];
const app = document.getElementById("app");
const store = {
  get(k, d) { try { const v = localStorage.getItem("phys1:" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("phys1:" + k, JSON.stringify(v)); } catch (e) {} },
};
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const k in attrs || {}) {
    if (k === "class") n.className = attrs[k];
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== false && attrs[k] != null) n.setAttribute(k, attrs[k]);
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(c));
  return n;
}
function rich(text) { // **bold** only
  const span = document.createElement("span");
  text.split("**").forEach((part, i) => span.append(i % 2 ? el("strong", null, part) : part));
  return span;
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function targetsDone(u) { const t = store.get("targets:" + u.slug, []); return u.targets.filter((_, i) => t[i]).length; }

// ---------- home ----------
function home() {
  document.title = "Physics Semester 1";
  app.replaceChildren(
    el("header", { class: "stack" },
      el("div", { class: "eyebrow" }, "11th grade physics · Semester 1 · CA NGSS"),
      el("h1", null, "Kinematics to energy, one unit at a time"),
      el("p", { class: "lede" }, "Five units. Each has learning targets, Cornell-notes cue questions to test yourself, a 10-question quiz on the questions students miss most, and practice problems with worked answers.")),
    el("ul", { class: "units" }, UNITS.map(u => {
      const best = store.get("best:" + u.slug, null), done = targetsDone(u);
      return el("li", null, el("a", { class: "unit-row", href: "#" + u.slug },
        el("span", { class: "unit-num" }, "0" + u.num),
        el("span", { class: "stack", style: "gap:2px" }, el("h2", null, u.title), el("span", { class: "unit-meta" }, u.subtitle + " · " + u.pacing)),
        el("span", { class: "unit-stats" },
          el("span", { class: "pill" + (best !== null && best >= 8 ? " good" : "") }, best === null ? "Quiz not taken" : "Best " + best + "/10"),
          el("span", null, done + "/" + u.targets.length + " targets checked"))));
    })),
    el("section", { class: "stack" },
      el("h2", null, "How to study a unit"),
      el("ol", { class: "howto" },
        el("li", null, "Read the notes, then open Self-test and answer each cue question aloud before you reveal it."),
        el("li", null, "Take the quiz. Aim for 8 out of 10. Read the explanation for every miss, then retry the missed questions."),
        el("li", null, "Work the practice problems on paper with givens, equation, and units before checking the answer."),
        el("li", null, "Come back the next day and again a few days later. Recall spread over days sticks better than rereading.")),
      el("p", { class: "note" }, "Scores and checkmarks are saved in this browser only. They are not sent to your teacher.")));
}

// ---------- unit ----------
let tab = "quiz";
function unitView(u) {
  document.title = u.title + " · Physics Semester 1";
  const tabs = [["quiz", "Quiz"], ["selftest", "Self-test"], ["practice", "Practice"], ["overview", "Overview"]];
  const body = el("div");
  const tabBar = el("div", { class: "tabs", role: "tablist" }, tabs.map(([id, name]) =>
    el("button", { class: "tab", role: "tab", id: "tab-" + id, "aria-selected": String(tab === id), onclick: () => { tab = id; unitView(u); } }, name)));
  app.replaceChildren(
    el("header", { class: "stack" },
      el("a", { class: "back", href: "#home" }, "← All units"),
      el("div", { class: "eyebrow" }, "Unit " + u.num + " · " + u.pacing + (u.ngss.length ? " · " + u.ngss.join(", ") : "")),
      el("h1", null, u.title),
      el("p", { class: "lede" }, u.eq)),
    tabBar, body);
  ({ quiz: quizTab, selftest: selfTab, practice: practiceTab, overview: overviewTab })[tab](u, body);
}

function quizTab(u, root) {
  let order, i, score, missed, session = "all";
  function start(only) {
    session = only ? "missed" : "all";
    order = shuffle((only || u.quiz.map((_, k) => k))); i = 0; score = 0; missed = [];
    show();
  }
  function show() {
