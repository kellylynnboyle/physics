<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flashcards — Projectile Motion</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; background:#f7f7f9; color:#1a1a1a; }
  h1 { font-size: 1.4rem; }
  .controls { display:flex; gap: .75rem; align-items:center; margin-bottom: 1rem; }
  #progress { font-weight:600; margin-bottom: .75rem; }
  #card { background:#fff; border:1px solid #ddd; border-radius:12px; padding: 2.5rem 2rem; min-height: 220px; display:flex; align-items:center; justify-content:center; text-align:center; font-size:1.15rem; cursor:pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
  #tags { text-align:center; font-size:.8rem; color:#888; margin-top:.5rem; }
  .nav { display:flex; justify-content:space-between; gap:1rem; margin-top:1.25rem; }
  button { background:#2557a7; color:#fff; border:none; padding:.6rem 1.1rem; border-radius:6px; cursor:pointer; font-size:.95rem; }
  button.secondary { background:#555; }
  #hint { text-align:center; color:#888; font-size:.85rem; margin-top:.5rem; }
</style>
</head>
<body>
<h1>Projectile Motion — Flashcards</h1>
<p style="font-size:.9rem;color:#555;">Same deck as <code>flashcards.tsv</code> (for Anki), playable directly in the browser — no import needed.</p>

<div class="controls">
  <button id="shuffleBtn" class="secondary">Shuffle</button>
</div>

<div id="progress"></div>
<div id="card"></div>
<div id="tags"></div>
<div id="hint">Click the card to flip it</div>
<div class="nav">
  <button id="prevBtn" class="secondary">&larr; Previous</button>
  <button id="nextBtn">Next &rarr;</button>
</div>

<script>
const CARDS = [
  { front: `A ball is launched at 20 m/s at 30&deg; above horizontal. What velocity value do you use for its VERTICAL motion?`, back: `The vertical component: v<sub>y</sub> = v<sub>0</sub>&middot;sin(30&deg;) — never the full launch speed.`, tags: ["projectile-motion"] },
  { front: `A ball is dropped from height h, and at the same instant an identical ball is launched horizontally from the same height. Which lands first?`, back: `Neither — they land at the same time, since both have the same initial vertical velocity (0) and the same vertical acceleration (-g).`, tags: ["projectile-motion"] },
  { front: `For a projectile launched and landing at the same height, how does horizontal velocity behave during flight?`, back: `It stays constant — gravity acts only vertically (a<sub>x</sub> = 0).`, tags: ["projectile-motion"] },
  { front: `For a projectile launched/landing at the same height, how does time-up compare to time-down?`, back: `They're equal — the trajectory is symmetric.`, tags: ["projectile-motion"] },
  { front: `A ball is kicked horizontally off a cliff. What determines its time of flight?`, back: `Only the vertical motion (height and g) — horizontal velocity has no effect on fall time.`, tags: ["projectile-motion"] },
  { front: `On level ground, what launch angle maximizes range?`, back: `45&deg;`, tags: ["projectile-motion"] },
  { front: `On level ground, name two launch angles that give the SAME range.`, back: `Any pair that adds to 90&deg; (e.g., 30&deg; and 60&deg;) — since range &prop; sin(2&theta;).`, tags: ["projectile-motion"] },
  { front: `A projectile is launched from a height above its landing point. Can you use the symmetric shortcut formulas (time up = time down)?`, back: `No — launch and landing heights differ, so you must solve &Delta;y = v<sub>y0</sub>t &minus; &frac12;gt&sup2; directly for t.`, tags: ["projectile-motion"] },
  { front: `Why can horizontal and vertical motion be analyzed independently in projectile motion?`, back: `Because gravity only acts vertically — there's no horizontal force (ignoring air resistance), so the two directions don't affect each other.`, tags: ["projectile-motion"] },
  { front: `What are a<sub>x</sub> and a<sub>y</sub> for a projectile in flight (ignoring air resistance)?`, back: `a<sub>x</sub> = 0 &nbsp;|&nbsp; a<sub>y</sub> = -g`, tags: ["projectile-motion"] },
];

let deck = [...CARDS];
let idx = 0;
let flipped = false;

const cardEl = document.getElementById('card');
const tagsEl = document.getElementById('tags');
const progressEl = document.getElementById('progress');

function render() {
  const c = deck[idx];
  cardEl.innerHTML = flipped ? c.back : c.front;
  tagsEl.textContent = c.tags.join(" · ");
  progressEl.textContent = `Card ${idx + 1} / ${deck.length}` + (flipped ? "  (showing answer)" : "  (showing question)");
}

cardEl.addEventListener('click', () => { flipped = !flipped; render(); });

document.getElementById('nextBtn').addEventListener('click', () => {
  idx = (idx + 1) % deck.length;
  flipped = false;
  render();
});

document.getElementById('prevBtn').addEventListener('click', () => {
  idx = (idx - 1 + deck.length) % deck.length;
  flipped = false;
  render();
});

document.getElementById('shuffleBtn').addEventListener('click', () => {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  idx = 0;
  flipped = false;
  render();
});

render();
</script>
</body>
</html>
