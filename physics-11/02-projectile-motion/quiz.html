<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Projectile Motion Quiz — Most Missed Questions</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; max-width: 780px; margin: 2rem auto; padding: 0 1rem; background:#f7f7f9; color:#1a1a1a; }
  h1 { font-size: 1.5rem; }
  #score-bar { position: sticky; top:0; background:#f7f7f9; padding: .5rem 0; font-weight:600; border-bottom: 2px solid #ddd; margin-bottom: 1rem; }
  .q { background:#fff; border:1px solid #ddd; border-radius:8px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
  .q h3 { margin-top:0; }
  .why { font-size:.85rem; color:#555; margin: .25rem 0 .75rem; font-style: italic; }
  label { display:block; padding:.4rem .5rem; border-radius:6px; cursor:pointer; margin-bottom:.25rem; }
  label:hover { background:#f0f0f5; }
  .correct { background:#d9f2df !important; }
  .incorrect { background:#fbdcdc !important; }
  button.check { margin-top:.5rem; background:#2557a7; color:#fff; border:none; padding:.5rem 1rem; border-radius:6px; cursor:pointer; }
  button.check:disabled { background:#aaa; cursor: default; }
  .explain { display:none; margin-top:.6rem; padding:.6rem .8rem; background:#eef3fb; border-left:4px solid #2557a7; border-radius:4px; }
  .explain.show { display:block; }
  #restart { display:none; background:#444; color:#fff; border:none; padding:.6rem 1.2rem; border-radius:6px; cursor:pointer; margin-top:1rem; }
  #final { display:none; font-size:1.2rem; font-weight:700; margin-top:1rem; padding:1rem; background:#fff; border-radius:8px; text-align:center; }
</style>
</head>
<body>
<h1>Projectile Motion — Most-Often-Missed Questions</h1>
<p>These questions target the specific misconceptions students get wrong most often on projectile motion. Answer, check, then read the explanation even if you got it right.</p>
<div id="score-bar">Score: <span id="score">0</span> / <span id="total">0</span></div>
<div id="quiz"></div>
<div id="final"></div>
<button id="restart">Retake Quiz</button>

<script>
const QUESTIONS = [
  {
    q: "A ball is launched at 20 m/s at 30° above horizontal. What velocity value should you use to find its vertical motion?",
    choices: ["20 m/s (the full launch speed)", "20 cos(30°) m/s", "20 sin(30°) m/s", "20 tan(30°) m/s"],
    correct: 2,
    why: "The #1 error in projectile problems: mixing up the full launch speed with its vertical component.",
    explain: "Vertical motion depends only on the vertical component of velocity, v_y = v_0 sin(θ) = 20 sin(30°) m/s. Using the full speed instead of the component is the single most common projectile-motion mistake."
  },
  {
    q: "A ball is dropped from a height, and at the same instant, an identical ball is launched horizontally from the same height. Which hits the ground first?",
    choices: [
      "The dropped ball, because it has no horizontal motion to \"waste\" time on",
      "The launched ball, because it's moving faster overall",
      "They hit at the same time",
      "It depends on the launch speed"
    ],
    correct: 2,
    why: "Tests the core idea of independence of x and y motion.",
    explain: "Horizontal and vertical motion are independent. Both balls have the same initial vertical velocity (zero) and the same vertical acceleration (-g), so they fall — and land — in exactly the same amount of time, regardless of horizontal speed."
  },
  {
    q: "A projectile is launched on level ground and lands at the same height it was launched from. What is true about its horizontal velocity throughout the flight?",
    choices: [
      "It decreases the whole time due to gravity",
      "It stays constant",
      "It's zero at the top of the trajectory",
      "It increases the whole time"
    ],
    correct: 1,
    why: "Students often assume gravity slows down horizontal motion too.",
    explain: "Gravity acts only vertically (a_x = 0, ignoring air resistance), so horizontal velocity never changes during flight — it stays constant from launch to landing."
  },
  {
    q: "For a projectile launched and landing at the same height, how does the time to reach maximum height compare to the time to fall back down?",
    choices: [
      "Time up is longer than time down",
      "Time down is longer than time up",
      "They are equal",
      "There's no fixed relationship"
    ],
    correct: 2,
    why: "Trajectory symmetry — a frequently tested conceptual idea.",
    explain: "Because vertical motion under constant gravity is symmetric when launch and landing heights match, time up = time down. This symmetry breaks when the landing height differs from the launch height."
  },
  {
    q: "A ball is kicked horizontally off a cliff. Which set of equations correctly finds the time it takes to land?",
    choices: [
      "Use the horizontal velocity and horizontal distance",
      "Use only the vertical motion: height and vertical acceleration, with initial v_y = 0",
      "Use the total launch speed in the vertical equation",
      "Time can't be found without knowing the landing speed"
    ],
    correct: 1,
    why: "Common setup error: trying to use horizontal quantities to find time, or forgetting v_y0 = 0 for a horizontal launch.",
    explain: "For a horizontal launch, initial vertical velocity is zero. Time of flight depends ONLY on the vertical motion: height = ½gt². Horizontal velocity has no effect on how long the fall takes."
  },
  {
    q: "On level ground with no air resistance, which two launch angles give the SAME range (for the same launch speed)?",
    choices: ["30° and 45°", "30° and 60°", "45° and 90°", "0° and 90°"],
    correct: 1,
    why: "Tests understanding of the range equation's symmetry, R ∝ sin(2θ).",
    explain: "Range depends on sin(2θ), and sin(2×30°) = sin(60°) = sin(2×60°) reflected — specifically sin(60°) = sin(120°), so 30° and 60° (angles that sum to 90°) give equal range. 45° is the single angle that maximizes range."
  },
  {
    q: "A projectile is launched from a height above the landing point (e.g., off a building) at an angle above horizontal. Can you still use the simple symmetric formulas (time up = time down, R = v²sin(2θ)/g) to solve it?",
    choices: [
      "Yes, those formulas always apply",
      "No — you must set up Δy = v_y0·t − ½gt² and solve for t directly, since launch and landing heights differ",
      "Yes, but only for the range formula",
      "No projectile motion problem can be solved if heights differ"
    ],
    correct: 1,
    why: "A very common error: applying symmetric shortcut formulas to a non-symmetric (elevated launch) situation.",
    explain: "The symmetric shortcuts only work when launch height = landing height. When they differ, you must go back to the full kinematics equation for vertical displacement and solve for time directly (often a quadratic)."
  }
];

const quizDiv = document.getElementById('quiz');
document.getElementById('total').textContent = QUESTIONS.length;
let score = 0;
let answered = 0;

QUESTIONS.forEach((item, qi) => {
  const qDiv = document.createElement('div');
  qDiv.className = 'q';
  qDiv.innerHTML = `<h3>Q${qi+1}. ${item.q}</h3><div class="why">Why this is tricky: ${item.why}</div>`;

  const form = document.createElement('div');
  item.choices.forEach((choice, ci) => {
    const label = document.createElement('label');
    label.innerHTML = `<input type="radio" name="q${qi}" value="${ci}"> ${choice}`;
    form.appendChild(label);
  });
  qDiv.appendChild(form);

  const btn = document.createElement('button');
  btn.className = 'check';
  btn.textContent = 'Check Answer';
  qDiv.appendChild(btn);

  const explainDiv = document.createElement('div');
  explainDiv.className = 'explain';
  explainDiv.textContent = item.explain;
  qDiv.appendChild(explainDiv);

  btn.addEventListener('click', () => {
    const selected = form.querySelector(`input[name="q${qi}"]:checked`);
    if (!selected) { alert('Pick an answer first.'); return; }
    const labels = form.querySelectorAll('label');
    labels.forEach((lab, idx) => {
      if (idx === item.correct) lab.classList.add('correct');
      else if (idx === parseInt(selected.value)) lab.classList.add('incorrect');
    });
    explainDiv.classList.add('show');
    btn.disabled = true;
    form.querySelectorAll('input').forEach(i => i.disabled = true);

    if (parseInt(selected.value) === item.correct) score++;
    answered++;
    document.getElementById('score').textContent = score;

    if (answered === QUESTIONS.length) {
      const finalDiv = document.getElementById('final');
      const pct = Math.round((score / QUESTIONS.length) * 100);
      finalDiv.style.display = 'block';
      finalDiv.textContent = `Final Score: ${score} / ${QUESTIONS.length} (${pct}%)` +
        (pct >= 80 ? ' — Mastery achieved! 🎉' : ' — Review the explanations above and retake.');
      document.getElementById('restart').style.display = 'inline-block';
    }
  });

  quizDiv.appendChild(qDiv);
});

document.getElementById('restart').addEventListener('click', () => location.reload());
</script>
</body>
</html>
