<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flashcards — Momentum</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; background:#f7f7f9; color:#1a1a1a; }
  h1 { font-size: 1.4rem; }
  .controls { display:flex; gap: .75rem; align-items:center; margin-bottom: 1rem; }
  #progress { font-weight:600; margin-bottom: .75rem; }
  #card { background:#fff; border:1px solid #ddd; border-radius:12px; padding: 2.5rem 2rem; min-height: 220px; display:flex; align-items:center; justify-content:center; text-align:center; font-size:1.15rem; cursor:pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
  #tags { text-align:center; font-size:.8rem; color:#888; margin-top:.5rem; }
  .nav { display:flex; justify-content:space-between; gap:1rem; margin-top:1.25rem; }
  button { background:#2557a7; color:#fff; border:none; padding:.6rem 1.1rem; border-radius:6px; cursor:pointer; font-size:.95rem; }
  button.secondary { background:#555; }
  #hint { text-align:center; color:#888; font-size:.85rem; margin-top:.5rem; }
</style>
</head>
<body>
<h1>Momentum — Flashcards</h1>
<p style="font-size:.9rem;color:#555;">Same deck as <code>flashcards.tsv</code> (for Anki), playable directly in the browser — no import needed.</p>

<div class="controls">
  <button id="shuffleBtn" class="secondary">Shuffle</button>
</div>

<div id="progress"></div>
<div id="card"></div>
<div id="tags"></div>
<div id="hint">Click the card to flip it</div>
<div class="nav">
  <button id="prevBtn" class="secondary">&larr; Previous</button>
  <button id="nextBtn">Next &rarr;</button>
</div>

<script>
const CARDS = [
  { front: `A 2 kg ball at +5 m/s collides with a 2 kg ball at -5 m/s. What is the total momentum of the system before the collision?`, back: `0 kg&middot;m/s — momentum is a signed/vector quantity: (2)(5) + (2)(-5) = 0.`, tags: ["momentum"] },
  { front: `Is kinetic energy conserved in a perfectly inelastic collision?`, back: `No — only momentum is conserved in any collision. KE is only conserved in ELASTIC collisions; in inelastic ones it converts to heat/sound/deformation.`, tags: ["momentum"] },
  { front: `In a perfectly inelastic collision, how many final velocities are there for the combined object?`, back: `One shared final velocity — the objects have physically become a single object.`, tags: ["momentum"] },
  { front: `A firework at rest explodes into two unequal-mass fragments. What must be true about their momenta after?`, back: `Equal in magnitude, opposite in direction (they sum to the original zero momentum) — NOT equal velocities.`, tags: ["momentum"] },
  { front: `What time interval do you use in the impulse-momentum theorem (J = F&Delta;t) for a bat hitting a ball?`, back: `The contact time between bat and ball — not the ball's total flight time.`, tags: ["momentum"] },
  { front: `An elastic, equal-mass, head-on collision: a moving cart hits an identical stationary cart. What happens?`, back: `The moving cart stops completely; the stationary cart moves off with the first cart's original velocity (same physics as Newton's cradle).`, tags: ["momentum"] },
  { front: `Why do airbags and crumple zones reduce injury?`, back: `They increase the collision's &Delta;t for the same &Delta;p (change in momentum), which reduces the average force, since F = &Delta;p/&Delta;t.`, tags: ["momentum"] },
  { front: `What is the formula for momentum?`, back: `p = mv (a vector, same direction as velocity).`, tags: ["momentum"] },
  { front: `What is the impulse-momentum theorem?`, back: `J = F&Delta;t = &Delta;p — impulse equals the change in momentum.`, tags: ["momentum"] },
  { front: `State conservation of momentum.`, back: `In an isolated system (no external net force), total momentum before an interaction equals total momentum after.`, tags: ["momentum"] },
  { front: `What's the difference between elastic and inelastic collisions?`, back: `Elastic: both momentum AND kinetic energy are conserved. Inelastic: only momentum is conserved; KE is lost to heat/sound/deformation.`, tags: ["momentum"] },
  { front: `In a 2D collision, how must momentum be conserved?`, back: `Component by component — conserve momentum separately in the x-direction and the y-direction.`, tags: ["momentum"] },
];

let deck = [...CARDS];
let idx = 0;
let flipped = false;

const cardEl = document.getElementById('card');
const tagsEl = document.getElementById('tags');
const progressEl = document.getElementById('progress');

function render() {
  const c = deck[idx];
  cardEl.innerHTML = flipped ? c.back : c.front;
  tagsEl.textContent = c.tags.join(" · ");
  progressEl.textContent = `Card ${idx + 1} / ${deck.length}` + (flipped ? "  (showing answer)" : "  (showing question)");
}

cardEl.addEventListener('click', () => { flipped = !flipped; render(); });

document.getElementById('nextBtn').addEventListener('click', () => {
  idx = (idx + 1) % deck.length;
  flipped = false;
  render();
});

document.getElementById('prevBtn').addEventListener('click', () => {
  idx = (idx - 1 + deck.length) % deck.length;
  flipped = false;
  render();
});

document.getElementById('shuffleBtn').addEventListener('click', () => {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  idx = 0;
  flipped = false;
  render();
});

render();
</script>
</body>
</html>
