<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flashcards — Kinematics</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; background:#f7f7f9; color:#1a1a1a; }
  h1 { font-size: 1.4rem; }
  .controls { display:flex; gap: .75rem; align-items:center; margin-bottom: 1rem; }
  #progress { font-weight:600; margin-bottom: .75rem; }
  #card { background:#fff; border:1px solid #ddd; border-radius:12px; padding: 2.5rem 2rem; min-height: 220px; display:flex; align-items:center; justify-content:center; text-align:center; font-size:1.15rem; cursor:pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
  #tags { text-align:center; font-size:.8rem; color:#888; margin-top:.5rem; }
  .nav { display:flex; justify-content:space-between; gap:1rem; margin-top:1.25rem; }
  button { background:#2557a7; color:#fff; border:none; padding:.6rem 1.1rem; border-radius:6px; cursor:pointer; font-size:.95rem; }
  button.secondary { background:#555; }
  #hint { text-align:center; color:#888; font-size:.85rem; margin-top:.5rem; }
</style>
</head>
<body>
<h1>Kinematics — Flashcards</h1>
<p style="font-size:.9rem;color:#555;">Same deck as <code>flashcards.tsv</code> (for Anki), playable directly in the browser — no import needed.</p>

<div class="controls">
  <button id="shuffleBtn" class="secondary">Shuffle</button>
</div>

<div id="progress"></div>
<div id="card"></div>
<div id="tags"></div>
<div id="hint">Click the card to flip it</div>
<div class="nav">
  <button id="prevBtn" class="secondary">&larr; Previous</button>
  <button id="nextBtn">Next &rarr;</button>
</div>

<script>
const CARDS = [
  { front: `A car is moving in the negative direction and speeding up. What is the sign of its acceleration?`, back: `Negative — speeding up means velocity and acceleration have the SAME sign.`, tags: ["kinematics"] },
  { front: `At the exact top of a ball's vertical throw, what are its velocity and acceleration?`, back: `Velocity = 0 momentarily; acceleration is still -9.8 m/s&sup2; (gravity never stops acting).`, tags: ["kinematics"] },
  { front: `Which of the 4 kinematic equations does NOT involve time?`, back: `v<sub>f</sub>&sup2; = v<sub>i</sub>&sup2; + 2a&Delta;x`, tags: ["kinematics"] },
  { front: `On a velocity-time graph, what does the AREA under the curve represent?`, back: `Displacement.`, tags: ["kinematics"] },
  { front: `On a velocity-time graph, what does the SLOPE represent?`, back: `Acceleration.`, tags: ["kinematics"] },
  { front: `On a position-time graph, what does the SLOPE represent?`, back: `Velocity.`, tags: ["kinematics"] },
  { front: `A ball is thrown up and caught at the same height it was released. How does the catch velocity compare to the launch velocity?`, back: `Same magnitude, opposite sign — by symmetry of free fall.`, tags: ["kinematics"] },
  { front: `A straight (non-curved) line on a position-time graph means what?`, back: `Constant velocity (could be zero or nonzero) — NOT acceleration.`, tags: ["kinematics"] },
  { front: `List the 4 kinematic equations for constant acceleration.`, back: `v<sub>f</sub>=v<sub>i</sub>+at &nbsp;|&nbsp; &Delta;x=v<sub>i</sub>t+&frac12;at&sup2; &nbsp;|&nbsp; v<sub>f</sub>&sup2;=v<sub>i</sub>&sup2;+2a&Delta;x &nbsp;|&nbsp; &Delta;x=&frac12;(v<sub>i</sub>+v<sub>f</sub>)t`, tags: ["kinematics"] },
  { front: `What is the standard free-fall acceleration near Earth's surface, and its direction?`, back: `9.8 m/s&sup2;, directed downward.`, tags: ["kinematics"] },
];

let deck = [...CARDS];
let idx = 0;
let flipped = false;

const cardEl = document.getElementById('card');
const tagsEl = document.getElementById('tags');
const progressEl = document.getElementById('progress');

function render() {
  const c = deck[idx];
  cardEl.innerHTML = flipped ? c.back : c.front;
  tagsEl.textContent = c.tags.join(" · ");
  progressEl.textContent = `Card ${idx + 1} / ${deck.length}` + (flipped ? "  (showing answer)" : "  (showing question)");
}

cardEl.addEventListener('click', () => { flipped = !flipped; render(); });

document.getElementById('nextBtn').addEventListener('click', () => {
  idx = (idx + 1) % deck.length;
  flipped = false;
  render();
});

document.getElementById('prevBtn').addEventListener('click', () => {
  idx = (idx - 1 + deck.length) % deck.length;
  flipped = false;
  render();
});

document.getElementById('shuffleBtn').addEventListener('click', () => {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  idx = 0;
  flipped = false;
  render();
});

render();
</script>
</body>
</html>
