<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kinematics Quiz — Most Missed Questions</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; max-width: 780px; margin: 2rem auto; padding: 0 1rem; background:#f7f7f9; color:#1a1a1a; }
  h1 { font-size: 1.5rem; }
  #score-bar { position: sticky; top:0; background:#f7f7f9; padding: .5rem 0; font-weight:600; border-bottom: 2px solid #ddd; margin-bottom: 1rem; }
  .q { background:#fff; border:1px solid #ddd; border-radius:8px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
  .q h3 { margin-top:0; }
  .why { font-size:.85rem; color:#555; margin: .25rem 0 .75rem; font-style: italic; }
  label { display:block; padding:.4rem .5rem; border-radius:6px; cursor:pointer; margin-bottom:.25rem; }
  label:hover { background:#f0f0f5; }
  .correct { background:#d9f2df !important; }
  .incorrect { background:#fbdcdc !important; }
  button.check { margin-top:.5rem; background:#2557a7; color:#fff; border:none; padding:.5rem 1rem; border-radius:6px; cursor:pointer; }
  button.check:disabled { background:#aaa; cursor: default; }
  .explain { display:none; margin-top:.6rem; padding:.6rem .8rem; background:#eef3fb; border-left:4px solid #2557a7; border-radius:4px; }
  .explain.show { display:block; }
  #restart { display:none; background:#444; color:#fff; border:none; padding:.6rem 1.2rem; border-radius:6px; cursor:pointer; margin-top:1rem; }
  #final { display:none; font-size:1.2rem; font-weight:700; margin-top:1rem; padding:1rem; background:#fff; border-radius:8px; text-align:center; }
</style>
</head>
<body>
<h1>Kinematics — Most-Often-Missed Questions</h1>
<p>These questions target the specific misconceptions students get wrong most often on kinematics. Answer, check, then read the explanation even if you got it right.</p>
<div id="score-bar">Score: <span id="score">0</span> / <span id="total">0</span></div>
<div id="quiz"></div>
<div id="final"></div>
<button id="restart">Retake Quiz</button>

<script>
const QUESTIONS = [
  {
    q: "A car is moving in the negative x-direction and speeding up. What is the sign of its acceleration?",
    choices: ["Positive", "Negative", "Zero", "Cannot be determined"],
    correct: 1,
    why: "Speeding up means velocity and acceleration point the same direction — this is the #1 missed kinematics concept.",
    explain: "Speeding up requires velocity and acceleration to have the SAME sign, not \"positive acceleration.\" Since velocity is negative, acceleration must also be negative for the object to speed up."
  },
  {
    q: "A ball is thrown straight up. At the exact top of its path, which statement is correct?",
    choices: [
      "Both velocity and acceleration are zero.",
      "Velocity is zero; acceleration is still -9.8 m/s².",
      "Velocity is nonzero; acceleration is zero.",
      "Both velocity and acceleration are at their maximum."
    ],
    correct: 1,
    why: "This trips up most students learning free fall.",
    explain: "Velocity is momentarily zero at the peak, but gravity never stops acting — acceleration remains -9.8 m/s² the entire flight, including at the top. If acceleration were truly zero, the ball would stay at the peak forever."
  },
  {
    q: "A student walks 4 m east, then 4 m west, back to the start. What are the distance and displacement?",
    choices: [
      "Distance = 0 m, Displacement = 8 m",
      "Distance = 8 m, Displacement = 0 m",
      "Distance = 8 m, Displacement = 8 m",
      "Distance = 0 m, Displacement = 0 m"
    ],
    correct: 1,
    why: "Classic scalar-vs-vector mix-up.",
    explain: "Distance is a scalar (total path length): 4 + 4 = 8 m. Displacement is a vector (net change in position): since the student ends where they started, displacement = 0 m."
  },
  {
    q: "Which kinematic equation should you use to relate initial velocity, final velocity, acceleration, and displacement WITHOUT knowing the time?",
    choices: [
      "v_f = v_i + at",
      "Δx = v_i t + ½at²",
      "v_f² = v_i² + 2aΔx",
      "Δx = ½(v_i + v_f)t"
    ],
    correct: 2,
    why: "Students often pick an equation before checking which variable is missing.",
    explain: "v_f² = v_i² + 2aΔx is the only one of the four kinematic equations that doesn't include time — always check which variable is absent from your knowns/unknowns before choosing an equation."
  },
  {
    q: "On a velocity-time graph, what does the AREA under the curve represent?",
    choices: ["Acceleration", "Displacement", "Speed", "Position at t=0"],
    correct: 1,
    why: "Students frequently confuse slope and area on motion graphs.",
    explain: "Area under a velocity-time graph = displacement (velocity × time has units of distance). Slope of a velocity-time graph, by contrast, gives acceleration. Don't mix the two up."
  },
  {
    q: "A ball is dropped from rest and falls for 3 seconds before hitting the ground. What is its velocity just before impact? (g = 9.8 m/s²)",
    choices: ["9.8 m/s", "19.6 m/s", "29.4 m/s", "44.1 m/s"],
    correct: 2,
    why: "A straightforward free-fall calculation — included because sign/setup errors are common even when the concept is understood.",
    explain: "v_f = v_i + at = 0 + (9.8)(3) = 29.4 m/s. Common wrong answers come from using t² instead of t, or forgetting v_i = 0."
  },
  {
    q: "A ball is thrown upward and caught at the same height it was released. Compared to the initial (launch) velocity, the final (catch) velocity is:",
    choices: [
      "The same magnitude and same sign.",
      "The same magnitude, opposite sign.",
      "A different magnitude, same sign.",
      "Zero."
    ],
    correct: 1,
    why: "Tests understanding of trajectory symmetry, a frequently-missed conceptual question.",
    explain: "By symmetry of free fall (constant acceleration), the ball returns to the same height with the same speed it left, but moving in the opposite direction — so the velocity has the same magnitude but the opposite sign."
  },
  {
    q: "On a position-time graph, a straight (non-curved) line indicates:",
    choices: [
      "Constant acceleration, nonzero velocity",
      "Constant velocity (could be zero or nonzero)",
      "The object is speeding up",
      "The object has stopped"
    ],
    correct: 1,
    why: "Distinguishing a straight line (constant slope) from a curve on a position-time graph.",
    explain: "A straight line on a position-time graph means constant slope, i.e., constant velocity — the object is NOT accelerating. A curved line would indicate changing velocity (acceleration)."
  }
];

const quizDiv = document.getElementById('quiz');
document.getElementById('total').textContent = QUESTIONS.length;
let score = 0;
let answered = 0;

QUESTIONS.forEach((item, qi) => {
  const qDiv = document.createElement('div');
  qDiv.className = 'q';
  qDiv.innerHTML = `<h3>Q${qi+1}. ${item.q}</h3><div class="why">Why this is tricky: ${item.why}</div>`;

  const form = document.createElement('div');
  item.choices.forEach((choice, ci) => {
    const label = document.createElement('label');
    label.innerHTML = `<input type="radio" name="q${qi}" value="${ci}"> ${choice}`;
    form.appendChild(label);
  });
  qDiv.appendChild(form);

  const btn = document.createElement('button');
  btn.className = 'check';
  btn.textContent = 'Check Answer';
  qDiv.appendChild(btn);

  const explainDiv = document.createElement('div');
  explainDiv.className = 'explain';
  explainDiv.textContent = item.explain;
  qDiv.appendChild(explainDiv);

  btn.addEventListener('click', () => {
    const selected = form.querySelector(`input[name="q${qi}"]:checked`);
    if (!selected) { alert('Pick an answer first.'); return; }
    const labels = form.querySelectorAll('label');
    labels.forEach((lab, idx) => {
      if (idx === item.correct) lab.classList.add('correct');
      else if (idx === parseInt(selected.value)) lab.classList.add('incorrect');
    });
    explainDiv.classList.add('show');
    btn.disabled = true;
    form.querySelectorAll('input').forEach(i => i.disabled = true);

    if (parseInt(selected.value) === item.correct) score++;
    answered++;
    document.getElementById('score').textContent = score;

    if (answered === QUESTIONS.length) {
      const finalDiv = document.getElementById('final');
      const pct = Math.round((score / QUESTIONS.length) * 100);
      finalDiv.style.display = 'block';
      finalDiv.textContent = `Final Score: ${score} / ${QUESTIONS.length} (${pct}%)` +
        (pct >= 80 ? ' — Mastery achieved! 🎉' : ' — Review the explanations above and retake.');
      document.getElementById('restart').style.display = 'inline-block';
    }
  });

  quizDiv.appendChild(qDiv);
});

document.getElementById('restart').addEventListener('click', () => location.reload());
</script>
</body>
</html>
