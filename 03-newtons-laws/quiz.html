<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Newton's Laws Quiz — Most Missed Questions</title>
<style>
  :root {
    --bg: #f4f6f9;
    --card: #ffffff;
    --ink: #1c2733;
    --muted: #5b6b7b;
    --accent: #2b5fad;
    --accent-ink: #ffffff;
    --correct: #1e8e3e;
    --correct-bg: #e6f4ea;
    --incorrect: #c5221f;
    --incorrect-bg: #fce8e6;
    --border: #dde3ea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    padding: 24px 16px 64px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  header { margin-bottom: 20px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 0.95rem; }
  .progress-bar {
    height: 8px; background: var(--border); border-radius: 999px; overflow: hidden; margin-top: 14px;
  }
  .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width .25s ease; }
  .progress-label { font-size: 0.85rem; color: var(--muted); margin-top: 6px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .qtag {
    display: inline-block; font-size: 0.75rem; font-weight: 600; letter-spacing: .03em;
    color: var(--accent); text-transform: uppercase; margin-bottom: 8px;
  }
  .qtext { font-size: 1.05rem; font-weight: 600; margin-bottom: 14px; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option {
    display: flex; align-items: flex-start; gap: 10px;
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
    cursor: pointer; background: #fbfcfd; transition: border-color .15s ease, background .15s ease;
  }
  .option:hover { border-color: var(--accent); }
  .option input { margin-top: 3px; }
  .option.correct { border-color: var(--correct); background: var(--correct-bg); }
  .option.incorrect { border-color: var(--incorrect); background: var(--incorrect-bg); }
  .option.disabled { cursor: default; }

  .explain {
    margin-top: 14px; padding: 12px 14px; border-radius: 8px;
    font-size: 0.95rem; display: none;
  }
  .explain.show { display: block; }
  .explain.correct-box { background: var(--correct-bg); color: #14532d; }
  .explain.incorrect-box { background: var(--incorrect-bg); color: #7a1a17; }

  .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
  button {
    font: inherit; font-weight: 600; border: none; border-radius: 8px;
    padding: 10px 18px; cursor: pointer; background: var(--accent); color: var(--accent-ink);
  }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }

  .summary { text-align: center; }
  .score-big { font-size: 2.6rem; font-weight: 700; margin: 8px 0; }
  .score-note { color: var(--muted); margin-bottom: 20px; }
  .review-item { text-align: left; padding: 12px 0; border-top: 1px solid var(--border); }
  .review-item:first-child { border-top: none; }
  .review-item .qtext { font-size: 0.98rem; }
  .badge-pass { color: var(--correct); font-weight: 700; }
  .badge-fail { color: var(--incorrect); font-weight: 700; }
  .hidden { display: none !important; }
  footer { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 24px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Newton's Laws — Most Missed Questions</h1>
    <div class="sub">10 questions targeting the mistakes students make most often on this unit. Pick the best answer, then check it — every question explains the reasoning either way.</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">Question 1 of 10</div>
  </header>

  <div id="quizArea"></div>

  <div id="summaryArea" class="card summary hidden">
    <div class="qtag">Results</div>
    <div class="score-big" id="scoreBig"></div>
    <div class="score-note" id="scoreNote"></div>
    <div id="reviewList"></div>
    <div class="actions" style="justify-content:center; margin-top:20px;">
      <button class="secondary" id="retakeBtn">Retake Quiz</button>
    </div>
  </div>

  <footer>Standalone file — works offline, no data leaves this page.</footer>
</div>

<script>
const QUESTIONS = [
  {
    tag: "First Law",
    text: "A puck slides across frictionless ice at a constant 4 m/s in a straight line. What net force is required to keep it moving at that constant velocity?",
    options: [
      "A constant force equal to the puck's weight, in the direction of motion",
      "Zero net force",
      "A small force, just enough to overcome the puck's own inertia",
      "A force that decreases over time as the puck 'runs out' of push"
    ],
    correct: 1,
    explain: "Newton's First Law: constant velocity (constant speed AND direction) requires zero NET force, not zero force and not a continuously applied force. The everyday intuition that 'motion needs a force to keep going' is the Aristotelian misconception the First Law overturns — objects keep moving on their own unless something unbalances the forces on them."
  },
  {
    tag: "Third Law",
    text: "You push on a wall with 50 N of force, and by Newton's Third Law the wall pushes back on you with 50 N. Why don't these two forces cancel out and result in zero net force somewhere?",
    options: [
      "They actually do cancel, which is why nothing happens.",
      "Because the wall's force is friction, not a true reaction force.",
      "Because the two forces act on two different objects (one on the wall, one on you) — forces only cancel when they act on the SAME object.",
      "Because the wall's push is always slightly smaller than your push."
    ],
    correct: 2,
    explain: "Action-reaction pairs from the Third Law always act on two different objects, so they can never cancel each other — canceling only happens between forces that act on the same object, which is what a free-body diagram (and the Second Law) is about. The force you exert is on the wall; the reaction force is on you. Each object has its own separate free-body diagram."
  },
  {
    tag: "Normal force",
    text: "A 10 kg box sits on a ramp inclined at 25° above horizontal. What is the normal force on the box?",
    options: [
      "N = mg, the same as if it were on flat ground",
      "N = mg·cos(25°), which is less than mg",
      "N = mg·sin(25°), which is less than mg",
      "N = mg / cos(25°), which is more than mg"
    ],
    correct: 1,
    explain: "On an incline, only the component of gravity perpendicular to the surface is balanced by the normal force: N = mg·cosθ. The component of gravity parallel to the surface (mg·sinθ) is instead balanced (or not) by friction. This is a direct example of normal force NOT equaling weight — N depends on the geometry of the situation, not just on mass and gravity."
  },
  {
    tag: "Normal force",
    text: "A person stands on a scale in an elevator that is accelerating DOWNWARD. Compared to their normal resting weight, what does the scale read?",
    options: [
      "Exactly their resting weight, since gravity hasn't changed",
      "More than their resting weight",
      "Less than their resting weight",
      "Zero, always, in any accelerating elevator"
    ],
    correct: 2,
    explain: "The scale reading is the normal force, found from F_net = ma applied to the person: N − mg = ma, where a is negative (downward) during downward acceleration, so N = m(g + a) < mg. The person's actual weight (mg) hasn't changed, but the normal force — what the scale measures — has decreased. Only if the elevator's downward acceleration equaled g exactly (free fall) would the scale read zero."
  },
  {
    tag: "Mass vs. weight",
    text: "An astronaut has a mass of 80 kg on Earth. She travels to the Moon, where gravity is about 1/6th of Earth's. What happens to her mass and her weight?",
    options: [
      "Both her mass and her weight decrease to 1/6th their Earth values.",
      "Her mass stays 80 kg; her weight decreases to about 1/6th of its Earth value.",
      "Her mass decreases to 1/6th; her weight stays the same.",
      "Both stay exactly the same, since mass and weight are the same thing."
    ],
    correct: 1,
    explain: "Mass is an invariant property of matter (amount of stuff and resistance to acceleration) and does not change with location — she's still 80 kg on the Moon. Weight is the gravitational force on that mass, W = mg, and DOES depend on local gravity, so her weight on the Moon is about 1/6th of her Earth weight. Mass and weight are related but not the same quantity."
  },
  {
    tag: "Friction",
    text: "A 20 kg crate rests on a floor with coefficient of static friction μ_s = 0.5. You push horizontally with 60 N and the crate does not move. What is the friction force acting on the crate at that moment?",
    options: [
      "It must be the maximum possible, μ_s·N ≈ 98 N",
      "It is exactly 60 N, matching your push, because the crate is in equilibrium",
      "It is 0 N, since the crate isn't sliding",
      "It cannot be determined without knowing the kinetic friction coefficient"
    ],
    correct: 1,
    explain: "Static friction is NOT a fixed value — it automatically adjusts to match whatever force is needed to prevent sliding, up to a maximum of μ_s·N (here, about 98 N). Since the crate stays at rest, the crate is in equilibrium, so friction must exactly balance your 60 N push. Only once your push exceeds the maximum available static friction would the crate start to slide."
  },
  {
    tag: "Friction",
    text: "Once an object is already sliding across a surface, how does kinetic friction generally behave as the object's sliding speed changes?",
    options: [
      "It increases roughly in proportion to speed, like air resistance.",
      "It stays roughly constant, given by μ_k·N, regardless of sliding speed.",
      "It decreases to zero as speed increases.",
      "It becomes equal to static friction once motion starts."
    ],
    correct: 1,
    explain: "Kinetic friction is modeled as roughly constant once sliding is occurring: f_k = μ_k·N, essentially independent of how fast the object is sliding (unlike air resistance, which does grow with speed). Also note μ_k is generally LESS than μ_s, which is why it takes more force to start an object sliding than to keep it sliding at constant velocity."
  },
  {
    tag: "Second Law, direction",
    text: "A car moving forward at 20 m/s brakes hard, decelerating uniformly to a stop. While it is braking, in which direction does its acceleration point?",
    options: [
      "Forward, in the same direction as the car's velocity",
      "Backward, opposite to the car's velocity",
      "Acceleration is zero, since the car is still moving forward",
      "Sideways, perpendicular to the car's motion"
    ],
    correct: 1,
    explain: "Acceleration points in the same direction as the NET FORCE, not necessarily the same direction as velocity. A braking car has a net force (mostly friction from the brakes) pointing backward, opposite its forward velocity, which is exactly what slows it down. An object can very much be moving one direction while accelerating in another — that's the definition of decelerating (or, more generally, of curved motion)."
  },
  {
    tag: "Free-body diagrams",
    text: "You are drawing a free-body diagram for a book resting on a table. Which of the following should appear as an arrow on the diagram?",
    options: [
      "The book's weight and the table's normal force on the book",
      "The book's weight, the normal force, and the book's velocity (which is zero)",
      "The book's weight, the normal force, and a 'force of gravity resisting motion'",
      "Only the normal force, since the book isn't accelerating"
    ],
    correct: 0,
    explain: "A free-body diagram shows only the FORCES acting on the object — here, weight (down) and the table's normal force (up), which balance since the book isn't accelerating. Velocity and acceleration are not forces and should never be drawn as force arrows on an FBD, and there is no such thing as a 'force resisting motion' separate from the real forces (friction, gravity, etc.) already accounted for."
  },
  {
    tag: "Tension",
    text: "A 4 kg mass hangs from a rope inside an elevator that is accelerating upward at 3 m/s². What is the tension in the rope? (g = 9.8 m/s²)",
    options: [
      "T = mg = 39.2 N, the same as if it were hanging at rest",
      "T = ma = 12 N",
      "T = m(g + a) = 51.2 N, more than the resting weight",
      "T = m(g − a) = 27.2 N, less than the resting weight"
    ],
    correct: 2,
    explain: "Tension is not automatically equal to weight — it must be solved from F_net = ma for the hanging mass: T − mg = ma, so T = m(g + a). With upward acceleration, the rope must supply MORE force than just supporting the weight, giving T = 4(9.8 + 3) = 51.2 N. Assuming T = mg here would ignore the elevator's acceleration entirely."
  }
];

let current = 0;
let answered = new Array(QUESTIONS.length).fill(null);
const quizArea = document.getElementById('quizArea');
const summaryArea = document.getElementById('summaryArea');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');

function renderQuestion(i) {
  const q = QUESTIONS[i];
  const chosen = answered[i];
  const isAnswered = chosen !== null;

  progressFill.style.width = ((i) / QUESTIONS.length * 100) + '%';
  progressLabel.textContent = `Question ${i + 1} of ${QUESTIONS.length}`;

  let optsHtml = q.options.map((opt, idx) => {
    let cls = 'option';
    if (isAnswered) {
      cls += ' disabled';
      if (idx === q.correct) cls += ' correct';
      else if (idx === chosen) cls += ' incorrect';
    }
    return `
      <label class="${cls}" data-idx="${idx}">
        <input type="radio" name="opt" value="${idx}" ${chosen === idx ? 'checked' : ''} ${isAnswered ? 'disabled' : ''}>
        <span>${opt}</span>
      </label>`;
  }).join('');

  let explainHtml = '';
  if (isAnswered) {
    const boxClass = chosen === q.correct ? 'correct-box' : 'incorrect-box';
    const verdict = chosen === q.correct ? 'Correct.' : 'Not quite.';
    explainHtml = `<div class="explain show ${boxClass}"><strong>${verdict}</strong> ${q.explain}</div>`;
  }

  quizArea.innerHTML = `
    <div class="card">
      <div class="qtag">${q.tag}</div>
      <div class="qtext">${q.text}</div>
      <div class="options">${optsHtml}</div>
      ${explainHtml}
      <div class="actions">
        <button class="secondary" id="prevBtn" ${i === 0 ? 'disabled' : ''}>Back</button>
        <button id="nextBtn" ${isAnswered ? '' : 'disabled'}>${i === QUESTIONS.length - 1 ? 'See Results' : 'Next'}</button>
      </div>
    </div>`;

  if (!isAnswered) {
    quizArea.querySelectorAll('.option').forEach(el => {
      el.addEventListener('click', () => {
        const idx = parseInt(el.getAttribute('data-idx'), 10);
        answered[i] = idx;
        renderQuestion(i);
      });
    });
  }

  document.getElementById('prevBtn').addEventListener('click', () => {
    current = Math.max(0, current - 1);
    renderQuestion(current);
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    if (current === QUESTIONS.length - 1) {
      showSummary();
    } else {
      current++;
      renderQuestion(current);
    }
  });
}

function showSummary() {
  quizArea.classList.add('hidden');
  summaryArea.classList.remove('hidden');
  progressFill.style.width = '100%';
  progressLabel.textContent = `Question ${QUESTIONS.length} of ${QUESTIONS.length} — complete`;

  const correctCount = answered.reduce((sum, a, i) => sum + (a === QUESTIONS[i].correct ? 1 : 0), 0);
  const pct = Math.round((correctCount / QUESTIONS.length) * 100);
  document.getElementById('scoreBig').textContent = `${correctCount} / ${QUESTIONS.length} (${pct}%)`;
  const pass = pct >= 80;
  document.getElementById('scoreNote').innerHTML = pass
    ? '<span class="badge-pass">Mastery threshold met (≥ 80%).</span>'
    : '<span class="badge-fail">Below the 80% mastery threshold — review the missed questions below, then retake.</span>';

  const reviewList = document.getElementById('reviewList');
  reviewList.innerHTML = QUESTIONS.map((q, i) => {
    const chosen = answered[i];
    const ok = chosen === q.correct;
    return `
      <div class="review-item">
        <div class="qtag">${q.tag} — ${ok ? '<span class="badge-pass">Correct</span>' : '<span class="badge-fail">Missed</span>'}</div>
        <div class="qtext">${q.text}</div>
        <div style="color:var(--muted); font-size:0.9rem;">Your answer: ${q.options[chosen]}</div>
        ${ok ? '' : `<div style="color:var(--muted); font-size:0.9rem;">Correct answer: ${q.options[q.correct]}</div>`}
        <div style="margin-top:6px; font-size:0.92rem;">${q.explain}</div>
      </div>`;
  }).join('');
}

document.getElementById('retakeBtn').addEventListener('click', () => {
  current = 0;
  answered = new Array(QUESTIONS.length).fill(null);
  summaryArea.classList.add('hidden');
  quizArea.classList.remove('hidden');
  renderQuestion(0);
});

renderQuestion(0);
</script>
</body>
</html>
