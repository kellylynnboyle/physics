<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Newton's Laws Quiz — Most Missed Questions</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --muted: #94a3b8;
    --accent: #38bdf8; --good: #22c55e; --bad: #ef4444; --border: #334155;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1rem 4rem; background: var(--bg); color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin-bottom: 0.25rem; }
  .sub { color: var(--muted); margin-bottom: 2rem; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 1.25rem 1.5rem; margin-bottom: 1.25rem;
  }
  .qnum { color: var(--accent); font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.04em; }
  .qtext { font-size: 1.05rem; margin: 0.4rem 0 0.9rem; }
  label.opt {
    display: block; padding: 0.6rem 0.8rem; margin-bottom: 0.5rem; border-radius: 8px;
    border: 1px solid var(--border); cursor: pointer; transition: background 0.15s;
  }
  label.opt:hover { background: #263449; }
  label.opt input { margin-right: 0.6rem; }
  .feedback { display: none; margin-top: 0.8rem; padding: 0.75rem 0.9rem; border-radius: 8px; font-size: 0.95rem; }
  .feedback.correct { display: block; background: rgba(34,197,94,0.12); border: 1px solid var(--good); }
  .feedback.incorrect { display: block; background: rgba(239,68,68,0.12); border: 1px solid var(--bad); }
  label.opt.correct-answer { border-color: var(--good); background: rgba(34,197,94,0.08); }
  label.opt.wrong-answer { border-color: var(--bad); background: rgba(239,68,68,0.08); }
  button {
    background: var(--accent); color: #04263b; border: none; font-weight: 700;
    padding: 0.75rem 1.6rem; border-radius: 8px; font-size: 1rem; cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: 0.5; cursor: default; }
  #results {
    display: none; text-align: center; padding: 1.5rem; border-radius: 10px;
    background: var(--card); border: 1px solid var(--accent); margin-top: 1rem; font-size: 1.15rem;
  }
  #results .score { font-size: 2.2rem; font-weight: 800; color: var(--accent); }
  .retry { margin-top: 1rem; }
  .missed-tag { display: inline-block; font-size: 0.72rem; color: var(--muted); border: 1px solid var(--border); padding: 0.1rem 0.5rem; border-radius: 999px; margin-bottom: 0.5rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Newton's Laws — Interactive Quiz</h1>
  <p class="sub">These 8 questions target the mistakes students make most often on this unit. Answer everything, then click "Check My Answers" for instant explanations.</p>

  <form id="quizForm"></form>
  <button id="submitBtn" type="button" onclick="gradeQuiz()">Check My Answers</button>

  <div id="results">
    <div>Your score</div>
    <div class="score" id="scoreText"></div>
    <div id="scoreMsg"></div>
    <div class="retry"><button type="button" onclick="location.reload()">Retake Quiz</button></div>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    tag: "First Law misconceptions",
    q: "A hockey puck slides across frictionless ice at constant velocity. What net force acts on it?",
    options: ["A large forward force", "A force equal to its weight", "Zero net force", "Cannot be determined without its mass"],
    correct: 2,
    explain: "Constant velocity means zero acceleration, so by Newton's Second Law the net force must be zero — even though the puck is moving. Motion does not require a force; only a CHANGE in motion does."
  },
  {
    tag: "Third-law pairs",
    q: "A book rests on a table. The table pushes up on the book with a normal force. What is the Newton's-third-law reaction to THIS specific force?",
    options: [
      "The gravitational force of Earth on the book",
      "The book pushes down on the table",
      "The normal force is balanced by gravity, so there is no reaction",
      "The table pushes up on the floor"
    ],
    correct: 1,
    explain: "The third-law pair to 'table pushes up on book' is 'book pushes down on table' — same type of force (normal/contact), acting on the other object. Gravity on the book is a different force entirely (and happens to be equal in magnitude here, which is what confuses students, but it's not the reaction pair)."
  },
  {
    tag: "Mass vs. weight",
    q: "An astronaut has a mass of 80 kg on Earth. On the Moon (g ≈ 1.6 m/s²), what happens to their mass and weight?",
    options: [
      "Both mass and weight stay the same",
      "Mass stays 80 kg; weight decreases",
      "Mass decreases; weight stays the same",
      "Both mass and weight decrease equally"
    ],
    correct: 1,
    explain: "Mass is a property of the amount of matter and doesn't change with location. Weight = mg depends on local gravity, so it decreases on the Moon (from ≈784 N to ≈128 N) while mass stays 80 kg."
  },
  {
    tag: "Normal force ≠ weight",
    q: "A 10 kg box sits on the floor of an elevator accelerating UPWARD at 2 m/s². What is the normal force on the box? (g = 9.8 m/s²)",
    options: ["98 N", "118 N", "78 N", "20 N"],
    correct: 1,
    explain: "ΣF_y = ma_y → N − mg = ma → N = m(g+a) = 10×(9.8+2) = 118 N. Because the elevator accelerates upward, the normal force must exceed the weight — a very common test scenario where N ≠ mg."
  },
  {
    tag: "Static vs. kinetic friction",
    q: "A 20 N horizontal force is applied to a crate that does NOT move. The maximum static friction available is 30 N. What is the actual friction force acting?",
    options: ["30 N (the maximum)", "20 N", "0 N, since the crate isn't moving", "Cannot be determined"],
    correct: 1,
    explain: "Static friction adjusts to match the applied force up to its maximum, to keep the object in equilibrium. Since the crate isn't moving, friction exactly balances the applied 20 N — NOT the maximum possible 30 N. Using the maximum whenever an object is at rest is a very common error."
  },
  {
    tag: "F=ma with multiple forces",
    q: "A 5 kg object has a 12 N force pushing right and an 8 N friction force resisting (pointing left). What is the object's acceleration?",
    options: ["4.0 m/s², rightward", "2.4 m/s², rightward", "0.8 m/s², rightward", "2.0 m/s², rightward"],
    correct: 2,
    explain: "Net force = 12 − 8 = 4 N rightward. a = F_net/m = 4/5 = 0.8 m/s². A common mistake is using only the applied 12 N (a = 2.4 m/s²) and forgetting to subtract friction first."
  },
  {
    tag: "Inertia and reference frames",
    q: "A passenger in a car that suddenly brakes feels thrown forward. What is actually happening, according to Newton's First Law?",
    options: [
      "A mysterious forward force pushes the passenger",
      "The passenger's body continues moving forward at its original speed while the car decelerates around them",
      "The passenger's mass suddenly increases",
      "Air resistance pushes the passenger forward"
    ],
    correct: 1,
    explain: "There is no forward force. The passenger's body has inertia and keeps moving at the car's original speed unless something (a seatbelt, the dashboard) applies a backward force on them. It only feels like being 'thrown forward' because the car (and the passenger's frame of reference) is what's actually decelerating."
  },
  {
    tag: "Free-body diagrams",
    q: "A block sits on a frictionless 20° incline. Which force(s) belong in its free-body diagram?",
    options: [
      "Only gravity",
      "Gravity and the applied push, if any — normal force isn't needed since there's no friction",
      "Gravity (straight down) and normal force (perpendicular to the incline surface)",
      "Gravity straight down and normal force straight up"
    ],
    correct: 2,
    explain: "Normal force is always perpendicular to the contact SURFACE, not necessarily 'straight up' — on an incline it points away from the incline's surface at the incline angle. Frictionless just means no friction force is included; normal force is still present because the block is in contact with the surface."
  }
];

const form = document.getElementById('quizForm');
QUESTIONS.forEach((item, qi) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="missed-tag">Often missed: ${item.tag}</div>
    <div class="qnum">Question ${qi + 1}</div>
    <div class="qtext">${item.q}</div>
    <div class="opts">
      ${item.options.map((opt, oi) => `
        <label class="opt" id="q${qi}_opt${oi}">
          <input type="radio" name="q${qi}" value="${oi}"> ${opt}
        </label>
      `).join('')}
    </div>
    <div class="feedback" id="q${qi}_feedback"></div>
  `;
  form.appendChild(card);
});

function gradeQuiz() {
  let score = 0;
  QUESTIONS.forEach((item, qi) => {
    const selected = form.querySelector(`input[name="q${qi}"]:checked`);
    const fb = document.getElementById(`q${qi}_feedback`);
    const correctLabel = document.getElementById(`q${qi}_opt${item.correct}`);
    correctLabel.classList.add('correct-answer');

    if (!selected) {
      fb.className = 'feedback incorrect';
      fb.style.display = 'block';
      fb.innerHTML = `<strong>Not answered.</strong> Correct answer: "${item.options[item.correct]}". ${item.explain}`;
      return;
    }
    const chosen = parseInt(selected.value, 10);
    if (chosen === item.correct) {
      score++;
      fb.className = 'feedback correct';
      fb.innerHTML = `<strong>Correct!</strong> ${item.explain}`;
    } else {
      document.getElementById(`q${qi}_opt${chosen}`).classList.add('wrong-answer');
      fb.className = 'feedback incorrect';
      fb.innerHTML = `<strong>Not quite.</strong> Correct answer: "${item.options[item.correct]}". ${item.explain}`;
    }
    fb.style.display = 'block';
  });

  document.querySelectorAll('#quizForm input[type=radio]').forEach(r => r.disabled = true);
  document.getElementById('submitBtn').disabled = true;

  const pct = Math.round((score / QUESTIONS.length) * 100);
  document.getElementById('scoreText').textContent = `${score} / ${QUESTIONS.length} (${pct}%)`;
  const msg = pct >= 80
    ? "Great work — you've met the 80% target for this unit."
    : "Below the 80% target. Review the explanations above and the Cornell notes, then retake.";
  document.getElementById('scoreMsg').textContent = msg;
  document.getElementById('results').style.display = 'block';
  document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
}
</script>
</body>
</html>
