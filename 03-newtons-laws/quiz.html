<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Newton's Laws Quiz — Most Missed Questions</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#f7f7f5; --card:#ffffff; --ink:#1c1c1c; --muted:#63635d;
    --accent:#2f6f4f; --accent-ink:#ffffff; --wrong:#b3432b; --right:#2f6f4f;
    --border:#e2e0da; --chip:#eef1ec;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#16181a; --card:#1f2224; --ink:#eceae4; --muted:#a3a39a;
      --accent:#5fae83; --accent-ink:#0d140f; --wrong:#e08268; --right:#5fae83;
      --border:#33363a; --chip:#262a2c; }
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Iowan Old Style',serif;line-height:1.5;}
  .wrap{max-width:720px;margin:0 auto;padding:2rem 1.25rem 4rem;}
  h1{font-size:1.5rem;margin-bottom:.15rem;}
  .sub{color:var(--muted);font-size:.95rem;margin-bottom:1.5rem;}
  .progress{display:flex;gap:.35rem;margin-bottom:1.5rem;flex-wrap:wrap;}
  .dot{width:1.6rem;height:1.6rem;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:.75rem;border:1px solid var(--border);color:var(--muted);background:var(--card);}
  .dot.answered{border-color:var(--accent);}
  .dot.correct{background:var(--right);color:var(--accent-ink);border-color:var(--right);}
  .dot.incorrect{background:var(--wrong);color:var(--accent-ink);border-color:var(--wrong);}
  .card{background:var(--card);border:1px solid var(--border);border-radius:.6rem;padding:1.25rem 1.4rem;margin-bottom:1.1rem;}
  .tag{display:inline-block;font-family:-apple-system,sans-serif;font-size:.7rem;letter-spacing:.04em;
    text-transform:uppercase;color:var(--accent);background:var(--chip);padding:.15rem .5rem;border-radius:1rem;margin-bottom:.6rem;}
  .qtext{font-size:1.08rem;margin-bottom:.9rem;}
  .opt{display:block;width:100%;text-align:left;background:var(--chip);border:1px solid var(--border);color:var(--ink);
    padding:.6rem .8rem;border-radius:.4rem;margin-bottom:.5rem;cursor:pointer;font-family:inherit;font-size:.98rem;}
  .opt:hover{border-color:var(--accent);}
  .opt.correct{background:var(--right);color:var(--accent-ink);border-color:var(--right);}
  .opt.incorrect{background:var(--wrong);color:var(--accent-ink);border-color:var(--wrong);}
  .opt:disabled{cursor:default;}
  .explain{display:none;margin-top:.7rem;padding:.7rem .9rem;background:var(--chip);border-left:3px solid var(--accent);
    border-radius:0 .3rem .3rem 0;font-size:.93rem;color:var(--ink);}
  .explain.show{display:block;}
  .missed{color:var(--wrong);font-family:-apple-system,sans-serif;font-size:.72rem;text-transform:uppercase;letter-spacing:.03em;}
  #score-panel{background:var(--card);border:1px solid var(--border);border-radius:.6rem;padding:1.5rem;text-align:center;display:none;}
  #score-panel.show{display:block;}
  #score-big{font-size:2.4rem;font-weight:bold;margin:.3rem 0;}
  button.retake{font-family:-apple-system,sans-serif;background:var(--accent);color:var(--accent-ink);border:none;
    padding:.6rem 1.2rem;border-radius:.4rem;font-size:.95rem;cursor:pointer;margin-top:.5rem;}
  footer{color:var(--muted);font-size:.85rem;margin-top:2rem;font-family:-apple-system,sans-serif;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Newton's Laws — Most Missed Questions</h1>
  <div class="sub">10 questions drawn from the concepts students most often get wrong. Answer, read the explanation, then move on.</div>
  <div class="progress" id="progress"></div>
  <div id="quiz"></div>
  <div id="score-panel">
    <div style="font-family:-apple-system,sans-serif;color:var(--muted);">Your score</div>
    <div id="score-big">0 / 0</div>
    <div id="score-msg" style="font-family:-apple-system,sans-serif;color:var(--muted);"></div>
    <button class="retake" onclick="location.reload()">Retake Quiz</button>
  </div>
  <footer>Section 03 — Newton's Laws · part of the 11th Grade Physics Learning Project</footer>
</div>

<script>
const QUESTIONS = [
  {
    q: "A book rests on a table. What is the Newton's Third Law reaction pair to \"gravity pulls the book down\"?",
    opts: ["The table pushes the book up (normal force)", "The book pushes the Earth up", "Friction holds the book in place", "There is no reaction force while the book is at rest"],
    correct: 1,
    missed: true,
    explain: "Gravity's Third Law pair is the book pulling the Earth upward with equal force — both forces involve the SAME two objects (book and Earth) and the same type of force (gravity). The normal force is a completely different force acting on the book, from the table, and is NOT gravity's reaction pair."
  },
  {
    q: "The normal force from the table (pushing the book up) and gravity (pulling the book down) are equal and opposite. Why are these NOT a Newton's Third Law pair?",
    opts: ["They aren't actually equal in magnitude", "They act on the same object (the book), not on two different objects", "Newton's Third Law only applies to moving objects", "One of the forces is fictional"],
    correct: 1,
    missed: true,
    explain: "Third Law pairs always act on two DIFFERENT objects. Gravity and the normal force both act on the book — that makes them a balanced-force (equilibrium) pair, not an action-reaction pair, even though they happen to be equal and opposite here."
  },
  {
    q: "An object moves at a constant, nonzero velocity in a straight line. What can you conclude about the net force on it?",
    opts: ["The net force must be in the direction of motion", "The net force must be zero", "The net force must be opposite the direction of motion", "Not enough information to know the net force"],
    correct: 1,
    missed: true,
    explain: "Constant velocity means zero acceleration, and by F=ma, zero acceleration means zero net force — even though the object is clearly moving. \"Moving\" and \"having a net force\" are independent facts; only a CHANGE in velocity requires a net force."
  },
  {
    q: "You push a heavy box and it doesn't move at all. According to Newton's Third Law, the box pushes back on you with a force that is:",
    opts: ["Smaller than your push, which is why it doesn't move", "Equal in magnitude and opposite in direction to your push", "Zero, since the box isn't accelerating", "Larger than your push"],
    correct: 1,
    missed: true,
    explain: "Third Law reaction forces are ALWAYS equal in magnitude, regardless of whether anything moves. The box staying still is explained by the box's net force being zero (your push is balanced by friction from the floor), not by the reaction force being weaker than the action force."
  },
  {
    q: "Which of the following is the correct distinction between mass and weight?",
    opts: ["Mass and weight are just two names for the same thing", "Mass changes with location; weight is constant everywhere", "Mass is constant everywhere; weight depends on local gravity (F=mg)", "Weight is measured in kilograms; mass is measured in Newtons"],
    correct: 2,
    missed: true,
    explain: "Mass measures the amount of matter/inertia an object has and doesn't change based on where the object is. Weight is a force (gravity acting on that mass) and changes depending on the local gravitational field — the same astronaut has the same mass on the Moon but far less weight."
  },
  {
    q: "A 2 kg object has three forces acting on it: 10 N right, 4 N left, and 3 N left. What is its acceleration?",
    opts: ["8.5 m/s² to the right", "1.5 m/s² to the right", "5 m/s² to the right", "0 m/s², since multiple forces cancel"],
    correct: 1,
    missed: false,
    explain: "Net force = 10 N right - 4 N left - 3 N left = 3 N to the right. Then a = F/m = 3 N / 2 kg = 1.5 m/s² to the right. F=ma always uses the NET force, the vector sum of everything acting on the object, never just one of the individual forces."
  },
  {
    q: "Two carts on a frictionless track: Cart A (2 kg) and Cart B (8 kg) are pushed with the exact same force for the exact same time. Which cart ends up with more speed?",
    opts: ["Cart B (heavier), because more mass means more momentum", "Cart A (lighter), because the same force produces more acceleration on less mass", "Both end up with the same speed", "Cannot be determined without knowing the distance"],
    correct: 1,
    missed: true,
    explain: "By F = ma, the same force on a smaller mass produces a LARGER acceleration (a = F/m). Since both carts are pushed for the same time, the cart with the greater acceleration (Cart A, the lighter one) ends up moving faster — a common intuition error is assuming heavier objects \"end up\" moving more."
  },
  {
    q: "An object is in equilibrium. Which of these is always true?",
    opts: ["The object is at rest", "There are no forces acting on the object at all", "The net force on the object is zero (it may be at rest OR moving at constant velocity)", "The object has constant, nonzero acceleration"],
    correct: 2,
    missed: true,
    explain: "Equilibrium means net force = 0, which allows for zero acceleration in either state: at rest, or moving at constant velocity. It does NOT mean no forces are acting — it means all the forces acting are balanced. This is one of the most persistent Newton's Laws misconceptions."
  },
  {
    q: "A block sits on a frictionless incline. Why does the normal force NOT simply equal mg (the block's full weight)?",
    opts: ["The normal force is unrelated to weight on an incline", "Only the component of gravity perpendicular to the incline (mg·cosθ) is balanced by the normal force", "Normal force is always smaller than weight, by a fixed ratio", "The incline angle doesn't affect the normal force"],
    correct: 1,
    missed: true,
    explain: "On an incline, gravity is decomposed into a component along the slope (mg·sinθ, which causes acceleration down the slope) and a component perpendicular to the slope (mg·cosθ, which the normal force balances). The normal force equals mg·cosθ, not the full mg — students often forget to decompose gravity on incline problems."
  },
  {
    q: "A rocket in deep space (no gravity, no air) fires its engines, expelling exhaust gas backward. Why does the rocket accelerate forward?",
    opts: ["The exhaust gas pushes off the vacuum of space", "Newton's Third Law: the rocket pushes exhaust backward, so the exhaust pushes the rocket forward with equal force", "The rocket is being pulled forward by inertia", "Rockets in a vacuum cannot actually accelerate"],
    correct: 1,
    missed: false,
    explain: "This is a clean Third Law example: the rocket exerts a force on the exhaust gas (pushing it backward), so the exhaust gas exerts an equal and opposite force on the rocket (pushing it forward) — no external medium like air or a launch pad is needed."
  }
];

const quizEl = document.getElementById('quiz');
const progressEl = document.getElementById('progress');
let answered = new Array(QUESTIONS.length).fill(null);

QUESTIONS.forEach((item, i) => {
  const dot = document.createElement('div');
  dot.className = 'dot';
  dot.id = 'dot-' + i;
  dot.textContent = i + 1;
  progressEl.appendChild(dot);

  const card = document.createElement('div');
  card.className = 'card';
  card.id = 'card-' + i;
  card.innerHTML = `
    <span class="tag">${item.missed ? '<span class="missed">Frequently missed</span> · ' : ''}Question ${i+1} of ${QUESTIONS.length}</span>
    <div class="qtext">${item.q}</div>
    <div class="opts">
      ${item.opts.map((o, j) => `<button class="opt" data-i="${i}" data-j="${j}">${o}</button>`).join('')}
    </div>
    <div class="explain" id="explain-${i}">${item.explain}</div>
  `;
  quizEl.appendChild(card);
});

quizEl.addEventListener('click', (e) => {
  const btn = e.target.closest('.opt');
  if (!btn) return;
  const i = Number(btn.dataset.i);
  const j = Number(btn.dataset.j);
  if (answered[i] !== null) return;
  answered[i] = j;

  const card = document.getElementById('card-' + i);
  const buttons = card.querySelectorAll('.opt');
  buttons.forEach(b => b.disabled = true);
  const correct = QUESTIONS[i].correct;
  buttons[correct].classList.add('correct');
  if (j !== correct) buttons[j].classList.add('incorrect');
  document.getElementById('explain-' + i).classList.add('show');

  const dot = document.getElementById('dot-' + i);
  dot.classList.add('answered', j === correct ? 'correct' : 'incorrect');

  if (answered.every(a => a !== null)) showScore();
});

function showScore(){
  const total = QUESTIONS.length;
  const correctCount = answered.filter((a, i) => a === QUESTIONS[i].correct).length;
  const pct = Math.round((correctCount/total)*100);
  document.getElementById('score-big').textContent = `${correctCount} / ${total} (${pct}%)`;
  const msg = pct >= 90 ? "Mastery level — ready to move on." :
              pct >= 70 ? "Solid, but review the missed ones above before moving on." :
              "Revisit the Cornell notes for this section, then retake.";
  document.getElementById('score-msg').textContent = msg;
  document.getElementById('score-panel').classList.add('show');
  document.getElementById('score-panel').scrollIntoView({behavior:'smooth', block:'nearest'});
}
</script>
</body>
</html>
