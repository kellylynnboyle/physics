<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Newton's Laws Quiz</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f5;
    --card: #ffffff;
    --text: #1f2328;
    --muted: #5b6169;
    --border: #e2e3e0;
    --accent: #2f6f4f;
    --accent-ink: #ffffff;
    --wrong: #b3441e;
    --wrong-bg: #fbeee7;
    --right: #2f6f4f;
    --right-bg: #e9f3ed;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181a;
      --card: #202325;
      --text: #edeef0;
      --muted: #a3a9b0;
      --border: #34383b;
      --accent: #6fbf94;
      --accent-ink: #10241a;
      --wrong: #ff8a65;
      --wrong-bg: #3a241d;
      --right: #6fbf94;
      --right-bg: #1d3327;
    }
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 2rem 1rem 4rem;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 0.15rem; }
  .sub { color: var(--muted); font-size: 0.92rem; margin-bottom: 1.5rem; }
  .progress {
    height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-bottom: 1.75rem;
  }
  .progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width .25s ease; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 1.5rem; margin-bottom: 1.25rem;
  }
  .qnum { color: var(--accent); font-weight: 600; font-size: 0.82rem; text-transform: uppercase; letter-spacing: .04em; }
  .qtext { font-size: 1.05rem; margin: 0.4rem 0 1rem; line-height: 1.45; }
  .choices { display: flex; flex-direction: column; gap: 0.6rem; }
  button.choice {
    text-align: left; padding: 0.7rem 0.9rem; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 0.96rem; cursor: pointer; line-height: 1.4;
  }
  button.choice:hover:not(:disabled) { border-color: var(--accent); }
  button.choice:disabled { cursor: default; }
  button.choice.correct { background: var(--right-bg); border-color: var(--right); color: var(--text); }
  button.choice.incorrect { background: var(--wrong-bg); border-color: var(--wrong); color: var(--text); }
  .explain {
    display: none; margin-top: 0.9rem; padding: 0.8rem 0.9rem; border-radius: 8px;
    background: var(--bg); border: 1px dashed var(--border); font-size: 0.92rem; color: var(--muted); line-height: 1.5;
  }
  .explain.show { display: block; }
  .explain b { color: var(--text); }
  .footer-nav {
    display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem;
  }
  button.nav {
    background: var(--accent); color: var(--accent-ink); border: none; border-radius: 8px;
    padding: 0.65rem 1.3rem; font-size: 0.95rem; font-weight: 600; cursor: pointer;
  }
  button.nav:disabled { opacity: 0.4; cursor: not-allowed; }
  button.ghost {
    background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 8px;
    padding: 0.65rem 1.1rem; font-size: 0.9rem; cursor: pointer;
  }
  .score-screen { text-align: center; padding: 2.5rem 1rem; }
  .score-big { font-size: 3rem; font-weight: 700; color: var(--accent); }
  .score-msg { color: var(--muted); margin: 0.75rem 0 1.75rem; font-size: 1rem; }
  .missed-list { text-align: left; margin: 1.5rem 0; }
  .missed-list li { margin-bottom: 0.5rem; color: var(--muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Newton's Laws</h1>
  <div class="sub">Most-missed questions &middot; 10 questions &middot; instant feedback, no data leaves this browser</div>
  <div class="progress"><div class="progress-bar" id="bar"></div></div>

  <div id="quiz-area"></div>

  <div id="score-area" class="score-screen" hidden>
    <div class="score-big" id="scoreBig">0/10</div>
    <div class="score-msg" id="scoreMsg"></div>
    <ul class="missed-list" id="missedList"></ul>
    <button class="nav" id="retakeBtn">Retake Quiz</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    "q": "A book rests on a table. Which pair of forces is a genuine Newton's Third Law action-reaction pair?",
    "choices": [
      "Gravity on the book and the normal force from the table on the book",
      "The book pushing down on the table, and the table pushing up on the book",
      "The normal force on the book and the book's weight, since they're equal and opposite",
      "The table pushing up on the book and the floor pushing up on the table"
    ],
    "correct": 1,
    "explain": "Third-law pairs act on DIFFERENT objects and are the same TYPE of force between the same two bodies: book-on-table and table-on-book. Gravity-and-normal-force act on the SAME object (the book) and are different force types \u2014 a very common misidentification."
  },
  {
    "q": "Why don't action-reaction force pairs cancel each other out?",
    "choices": [
      "They do cancel \u2014 that's why objects don't accelerate from them",
      "Because they act on two different objects, not the same object",
      "Because one is always larger than the other",
      "They only fail to cancel when friction is present"
    ],
    "correct": 1,
    "explain": "Forces only cancel (sum to zero net force) when added on the SAME object. Action-reaction pairs are equal and opposite but act on different objects, so each object still feels one unbalanced force from that pair."
  },
  {
    "q": "An object moves at constant velocity in a straight line. What can you conclude about the net force on it?",
    "choices": [
      "It must be zero",
      "It must equal the object's weight",
      "It must be increasing",
      "It must point in the direction of motion"
    ],
    "correct": 0,
    "explain": "Newton's First Law: constant velocity (including being at rest) means zero net force, i.e., the object is in equilibrium. 'Constant velocity' does not require a force to maintain it \u2014 a common misconception from everyday intuition about friction."
  },
  {
    "q": "What is the key difference between an object's mass and its weight?",
    "choices": [
      "They are exactly the same thing, just measured in different units",
      "Mass is the amount of matter (constant everywhere); weight is the gravitational force on it (changes with location)",
      "Weight is constant everywhere; mass changes with gravity",
      "Mass only applies to objects at rest"
    ],
    "correct": 1,
    "explain": "Mass (kg) is an intrinsic amount-of-matter/inertia property and doesn't change with location. Weight (N) = mg is the gravitational force on that mass, so it changes if g changes (e.g., on the Moon)."
  },
  {
    "q": "A box sits still on a rough floor. You push it lightly, but it doesn't move. What force is balancing your push?",
    "choices": [
      "Kinetic friction",
      "Static friction, which adjusts up to a maximum value",
      "The normal force",
      "There is no opposing force yet"
    ],
    "correct": 1,
    "explain": "Static friction adjusts to match the applied force (up to its maximum, \u03bc\u209bN) as long as the object stays still. Once your push exceeds that maximum, the box starts moving and kinetic friction (usually smaller) takes over."
  },
  {
    "q": "Is the normal force on an object always equal in magnitude to its weight?",
    "choices": [
      "Yes, always, by definition",
      "No \u2014 only when the surface is horizontal and there's no other vertical force or acceleration",
      "No, normal force is always greater than weight",
      "Normal force and weight are unrelated"
    ],
    "correct": 1,
    "explain": "Normal force equals weight only in the simple flat-surface, no-vertical-acceleration case. On an incline, with an applied vertical force, or during vertical acceleration (like in an elevator), normal force differs from weight \u2014 this is one of the most common free-body-diagram errors."
  },
  {
    "q": "A 2 kg object accelerates at 3 m/s\u00b2 when a net force is applied. If the mass is doubled to 4 kg and the same net force is applied, what is the new acceleration?",
    "choices": [
      "6 m/s\u00b2",
      "3 m/s\u00b2",
      "1.5 m/s\u00b2",
      "12 m/s\u00b2"
    ],
    "correct": 2,
    "explain": "From F = ma, F stays the same. Doubling mass halves acceleration for a fixed force: a = F/m, so new a = (2kg \u00d7 3 m/s\u00b2)/4kg = 1.5 m/s\u00b2. Acceleration is inversely proportional to mass, not directly."
  },
  {
    "q": "A block sits on a frictionless incline. Which statement about the forces is correct?",
    "choices": [
      "The normal force equals mg (the full weight)",
      "The normal force equals mg\u00b7cos(\u03b8), less than the full weight",
      "The net force along the incline is zero",
      "Only gravity acts on the block"
    ],
    "correct": 1,
    "explain": "On an incline, only the component of gravity perpendicular to the surface (mg\u00b7cos\u03b8) is balanced by the normal force; the component along the surface (mg\u00b7sin\u03b8) is unbalanced and accelerates the block down the slope."
  },
  {
    "q": "A rocket engine pushes exhaust gas downward and out. Why does the rocket accelerate upward?",
    "choices": [
      "The exhaust gas pushes against the air below it",
      "By Newton's Third Law, the gas pushes back on the rocket with equal and opposite force",
      "The rocket is lighter than air",
      "Gravity pulls the rocket up in space"
    ],
    "correct": 1,
    "explain": "The rocket pushes the exhaust gas one way; by the third law, the gas pushes the rocket the opposite way with equal force. This works even in a vacuum \u2014 it does not require pushing against air, a common misconception."
  },
  {
    "q": "Which of these is an example of Newton's Second Law being applied correctly?",
    "choices": [
      "A heavier object needs a proportionally larger net force to achieve the same acceleration as a lighter one",
      "A larger mass always accelerates faster under any given force",
      "Force and acceleration are inversely related",
      "An object with more mass has less inertia"
    ],
    "correct": 0,
    "explain": "F = ma means for the same target acceleration, a larger mass requires a proportionally larger net force. Larger mass means MORE inertia (resistance to acceleration change), not less \u2014 reversing this is a frequent error."
  }
];

let current = 0;
let score = 0;
let answered = new Array(QUESTIONS.length).fill(false);
let missed = [];

const quizArea = document.getElementById('quiz-area');
const scoreArea = document.getElementById('score-area');
const bar = document.getElementById('bar');

function renderQuestion() {
  const q = QUESTIONS[current];
  bar.style.width = ((current) / QUESTIONS.length * 100) + '%';

  const card = document.createElement('div');
  card.className = 'card';

  const num = document.createElement('div');
  num.className = 'qnum';
  num.textContent = 'Question ' + (current + 1) + ' of ' + QUESTIONS.length;
  card.appendChild(num);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = q.q;
  card.appendChild(qtext);

  const choicesWrap = document.createElement('div');
  choicesWrap.className = 'choices';

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = '<b>Why:</b> ' + q.explain;

  q.choices.forEach((choiceText, idx) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = choiceText;
    btn.addEventListener('click', () => {
      if (answered[current]) return;
      answered[current] = true;
      const correct = idx === q.correct;
      Array.from(choicesWrap.children).forEach((b, i) => {
        b.disabled = true;
        if (i === q.correct) b.classList.add('correct');
        else if (i === idx) b.classList.add('incorrect');
      });
      if (correct) {
        score++;
      } else {
        missed.push(q.q);
      }
      explain.classList.add('show');
      nextBtn.disabled = false;
    });
    choicesWrap.appendChild(btn);
  });

  card.appendChild(choicesWrap);
  card.appendChild(explain);

  const nav = document.createElement('div');
  nav.className = 'footer-nav';
  const nextBtn = document.createElement('button');
  nextBtn.className = 'nav';
  nextBtn.textContent = current === QUESTIONS.length - 1 ? 'See Results' : 'Next';
  nextBtn.disabled = true;
  nextBtn.addEventListener('click', () => {
    if (current < QUESTIONS.length - 1) {
      current++;
      quizArea.innerHTML = '';
      renderQuestion();
    } else {
      showScore();
    }
  });
  nav.appendChild(document.createElement('span'));
  nav.appendChild(nextBtn);
  card.appendChild(nav);

  quizArea.appendChild(card);
}

function showScore() {
  bar.style.width = '100%';
  quizArea.hidden = true;
  scoreArea.hidden = false;
  const pct = Math.round((score / QUESTIONS.length) * 100);
  document.getElementById('scoreBig').textContent = score + '/' + QUESTIONS.length;
  let msg = pct >= 80 ? "Nice work — you've met the 80% target for this unit." :
            pct >= 60 ? "Getting there. Re-read the missed concepts in your Cornell notes, then retake." :
            "Revisit the unit README key concepts before retaking this quiz.";
  document.getElementById('scoreMsg').textContent = msg + ' (' + pct + '%)';
  const list = document.getElementById('missedList');
  list.innerHTML = '';
  if (missed.length) {
    const heading = document.createElement('div');
    heading.style.color = 'var(--text)';
    heading.style.fontWeight = '600';
    heading.style.marginBottom = '0.4rem';
    heading.textContent = 'Review these:';
    list.appendChild(heading);
    missed.forEach(m => {
      const li = document.createElement('li');
      li.textContent = m;
      list.appendChild(li);
    });
  }
}

document.getElementById('retakeBtn').addEventListener('click', () => {
  current = 0; score = 0; answered = new Array(QUESTIONS.length).fill(false); missed = [];
  quizArea.hidden = false; scoreArea.hidden = true; quizArea.innerHTML = '';
  renderQuestion();
});

renderQuestion();
</script>
</body>
</html>
