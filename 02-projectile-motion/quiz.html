<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Projectile Motion Quiz — Most Missed Questions</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    --bg: #f7f8fb; --card: #ffffff; --ink: #1c2331; --muted: #5b6472;
    --accent: #2f6fed; --good: #1a9e6b; --bad: #d64545; --border: #e2e6ee;
  }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--ink); margin: 0; padding: 24px 16px 64px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .sub { color: var(--muted); margin-bottom: 24px; }
  .progress { background: var(--border); border-radius: 8px; height: 8px; overflow: hidden; margin-bottom: 24px; }
  .progress-bar { background: var(--accent); height: 100%; width: 0%; transition: width .3s; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px; margin-bottom: 18px; }
  .qnum { color: var(--accent); font-weight: 600; font-size: .85rem; margin-bottom: 6px; }
  .qtext { font-size: 1.05rem; margin-bottom: 14px; line-height: 1.45; }
  .choice { display: block; width: 100%; text-align: left; padding: 12px 14px; margin-bottom: 8px;
    border: 1px solid var(--border); border-radius: 8px; background: #fbfcfe; cursor: pointer;
    font-size: .97rem; color: var(--ink); }
  .choice:hover { border-color: var(--accent); }
  .choice.correct { background: #e8f7f0; border-color: var(--good); }
  .choice.incorrect { background: #fbeaea; border-color: var(--bad); }
  .choice[disabled] { cursor: default; }
  .explain { display: none; margin-top: 12px; padding: 12px 14px; border-radius: 8px;
    background: #f1f4fb; font-size: .92rem; line-height: 1.5; }
  .explain.show { display: block; }
  .explain b { color: var(--accent); }
  .footer { text-align: center; margin-top: 24px; }
  button.primary { background: var(--accent); color: white; border: none; padding: 12px 24px;
    border-radius: 8px; font-size: 1rem; cursor: pointer; }
  button.primary:disabled { opacity: .5; cursor: not-allowed; }
  #result { display: none; text-align: center; padding: 28px 20px; background: var(--card);
    border-radius: 12px; border: 1px solid var(--border); }
  #result h2 { margin-top: 0; }
  .missed-list { text-align: left; margin-top: 16px; }
  .missed-list li { margin-bottom: 6px; }
  .tag { display: inline-block; font-size: .75rem; padding: 2px 8px; border-radius: 999px;
    background: #eef2ff; color: var(--accent); margin-left: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Projectile Motion — Most Missed Questions</h1>
  <p class="sub">10 questions targeting the misconceptions students trip on most often. Answer each one — you'll see feedback immediately.</p>
  <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
  <div id="quiz"></div>
  <div class="footer">
    <button class="primary" id="submitBtn" disabled>See my results</button>
  </div>
  <div id="result"></div>
</div>

<script>
const QUESTIONS = [
  {
    q: "A projectile is launched at an angle. What is its horizontal acceleration during flight (ignore air resistance)?",
    choices: ["9.8 m/s², downward", "9.8 m/s², in the direction of motion", "0 m/s²", "Equal to the vertical acceleration"],
    correct: 2,
    tag: "Horizontal acceleration",
    explain: "Gravity acts only vertically. Horizontal velocity stays constant throughout the flight, so horizontal acceleration is always 0 — this is the single most common projectile-motion error to avoid."
  },
  {
    q: "Two balls are launched horizontally from the same height at the same instant — one fast, one slow. Which hits the ground first?",
    choices: ["The faster ball", "The slower ball", "They land at the same time", "Depends on their masses"],
    correct: 2,
    tag: "Independence of axes",
    explain: "Time to fall depends only on the vertical motion (height and gravity), which is identical for both balls. Horizontal speed has zero effect on fall time — they land simultaneously."
  },
  {
    q: "A ball is launched at v₀ = 30 m/s at 40° above horizontal. What is the correct expression for its initial VERTICAL velocity component?",
    choices: ["30 cos 40°", "30 sin 40°", "30 tan 40°", "30 / sin 40°"],
    correct: 1,
    tag: "Component decomposition",
    explain: "The vertical component uses sine of the launch angle: v₀ᵧ = v₀ sin θ. The horizontal component uses cosine: v₀ₓ = v₀ cos θ. Mixing these up is one of the most common setup errors."
  },
  {
    q: "At the top of a projectile's trajectory (level launch/landing), which statement is correct?",
    choices: [
      "Both velocity components are zero",
      "Vertical velocity is zero; horizontal velocity is unchanged from launch",
      "Horizontal velocity is zero; vertical velocity is unchanged",
      "Both velocity components equal their initial values"
    ],
    correct: 1,
    tag: "Peak of trajectory",
    explain: "At the peak, the vertical velocity momentarily equals zero (that's what defines the peak), but the horizontal velocity never changes throughout the flight since there's no horizontal acceleration."
  },
  {
    q: "What time variable do you use when solving the vertical equations vs. the horizontal equations for the same projectile?",
    choices: [
      "Different t values — each axis has its own time",
      "The same t — both axes share the same clock",
      "The vertical t is always double the horizontal t",
      "Time only applies to the vertical axis"
    ],
    correct: 1,
    tag: "Shared time variable",
    explain: "This is the key link between the two independent axes: the object experiences horizontal and vertical motion simultaneously, so the same value of t applies to both sets of equations."
  },
  {
    q: "A projectile is launched at 20 m/s from the edge of a cliff, angled 20° BELOW horizontal (downward). What is v₀ᵧ?",
    choices: ["+20 sin 20° (upward)", "−20 sin 20° (downward)", "0, since it's mostly horizontal", "−20 cos 20° (downward)"],
    correct: 1,
    tag: "Sign conventions",
    explain: "Even though the angle is measured from horizontal, a downward launch angle means the initial vertical velocity component points downward (negative, if up is positive): v₀ᵧ = −v₀ sin θ."
  },
  {
    q: "For a projectile launched and landing at the SAME height, which launch angle produces maximum range?",
    choices: ["30°", "45°", "60°", "90°"],
    correct: 1,
    tag: "Maximum range",
    explain: "On level ground, 45° maximizes range because it optimally balances time of flight against horizontal speed. Note this only holds when launch and landing heights are equal — it changes if launched from a height."
  },
  {
    q: "A ball is thrown horizontally from a table. Which set of equations correctly describes its motion?",
    choices: [
      "x = v₀t (horizontal); y = v₀t − ½gt² (vertical, with initial vertical velocity)",
      "x = v₀t (horizontal); y = −½gt² (vertical, since initial vertical velocity is zero)",
      "x = ½at² (horizontal, with gravity); y = v₀t (vertical, constant velocity)",
      "Both x and y use y = v₀t − ½gt²"
    ],
    correct: 1,
    tag: "Horizontal launch",
    explain: "A horizontal launch means v₀ᵧ = 0 (all initial velocity is horizontal), so the vertical position equation simplifies to y = −½gt² with no initial-velocity term. The horizontal motion still has zero acceleration: x = v₀t."
  },
  {
    q: "A projectile is launched at 30° and another at 60°, both at the same speed, on level ground. What's true about their ranges and times of flight?",
    choices: [
      "Same range, same time of flight",
      "Same range, but the 60° shot has a longer time of flight and greater max height",
      "The 60° shot has the greater range",
      "The 30° shot has the greater range"
    ],
    correct: 1,
    tag: "Complementary angles",
    explain: "30° and 60° are complementary angles (they sum to 90°), so they produce equal ranges on level ground — but they are NOT identical trajectories. The steeper 60° launch spends more time in the air and reaches a greater height; the 30° launch is flatter and faster."
  },
  {
    q: "Why can't you use the simple range formula R = (v₀² sin 2θ)/g for a projectile launched from the top of a building down to the ground?",
    choices: [
      "The formula only works for launches straight up",
      "That shortcut formula assumes launch height equals landing height, which isn't true here",
      "The formula doesn't account for horizontal velocity",
      "It actually works fine in this case"
    ],
    correct: 1,
    tag: "Formula limitations",
    explain: "The shortcut range formula is derived assuming the projectile lands at the same height it launched from. When launch and landing heights differ (like off a building), you must go back to the full vertical position equation, solve for time using the quadratic formula, then plug that time into x = v₀ₓt."
  }
];

let current = 0;
let score = 0;
const missed = [];
const quizEl = document.getElementById('quiz');
const progressBar = document.getElementById('progressBar');
const submitBtn = document.getElementById('submitBtn');

function renderQuestion(i) {
  const q = QUESTIONS[i];
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="qnum">Question ${i + 1} of ${QUESTIONS.length}<span class="tag">${q.tag}</span></div>
    <div class="qtext">${q.q}</div>
    <div class="choices"></div>
    <div class="explain" id="explain-${i}"></div>
  `;
  const choicesEl = card.querySelector('.choices');
  q.choices.forEach((choice, idx) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = choice;
    btn.onclick = () => selectAnswer(i, idx, card);
    choicesEl.appendChild(btn);
  });
  quizEl.appendChild(card);
}

function selectAnswer(qIndex, choiceIndex, card) {
  const q = QUESTIONS[qIndex];
  const buttons = card.querySelectorAll('.choice');
  if (buttons[0].disabled) return;
  buttons.forEach((b, idx) => {
    b.disabled = true;
    if (idx === q.correct) b.classList.add('correct');
    else if (idx === choiceIndex) b.classList.add('incorrect');
  });
  const explainEl = card.querySelector('.explain');
  explainEl.innerHTML = (choiceIndex === q.correct ? '<b>Correct.</b> ' : '<b>Not quite.</b> ') + q.explain;
  explainEl.classList.add('show');

  if (choiceIndex === q.correct) score++;
  else missed.push(q);

  current++;
  progressBar.style.width = (current / QUESTIONS.length * 100) + '%';
  if (current === QUESTIONS.length) submitBtn.disabled = false;
}

QUESTIONS.forEach((_, i) => renderQuestion(i));

submitBtn.addEventListener('click', () => {
  document.getElementById('quiz').style.display = 'none';
  submitBtn.style.display = 'none';
  const resultEl = document.getElementById('result');
  resultEl.style.display = 'block';
  let missedHtml = '';
  if (missed.length) {
    missedHtml = '<div class="missed-list"><p><b>Review these before moving on:</b></p><ul>' +
      missed.map(m => `<li>${m.tag}: ${m.q}</li>`).join('') + '</ul></div>';
  } else {
    missedHtml = '<p>No misses — nice work! You\'ve got the common Projectile Motion traps covered.</p>';
  }
  resultEl.innerHTML = `<h2>${score} / ${QUESTIONS.length}</h2><p>${score === QUESTIONS.length ? 'Perfect score!' : 'Keep practicing the missed concepts below.'}</p>${missedHtml}`;
});
</script>
</body>
</html>
