<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projectile Motion Quiz — Most Missed Questions</title>
<style>
  :root {
    --bg: #f4f6f9;
    --card: #ffffff;
    --ink: #1c2733;
    --muted: #5b6b7b;
    --accent: #2b5fad;
    --accent-ink: #ffffff;
    --correct: #1e8e3e;
    --correct-bg: #e6f4ea;
    --incorrect: #c5221f;
    --incorrect-bg: #fce8e6;
    --border: #dde3ea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    padding: 24px 16px 64px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  header { margin-bottom: 20px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 0.95rem; }
  .progress-bar {
    height: 8px; background: var(--border); border-radius: 999px; overflow: hidden; margin-top: 14px;
  }
  .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width .25s ease; }
  .progress-label { font-size: 0.85rem; color: var(--muted); margin-top: 6px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .qtag {
    display: inline-block; font-size: 0.75rem; font-weight: 600; letter-spacing: .03em;
    color: var(--accent); text-transform: uppercase; margin-bottom: 8px;
  }
  .qtext { font-size: 1.05rem; font-weight: 600; margin-bottom: 14px; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option {
    display: flex; align-items: flex-start; gap: 10px;
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
    cursor: pointer; background: #fbfcfd; transition: border-color .15s ease, background .15s ease;
  }
  .option:hover { border-color: var(--accent); }
  .option input { margin-top: 3px; }
  .option.correct { border-color: var(--correct); background: var(--correct-bg); }
  .option.incorrect { border-color: var(--incorrect); background: var(--incorrect-bg); }
  .option.disabled { cursor: default; }

  .explain {
    margin-top: 14px; padding: 12px 14px; border-radius: 8px;
    font-size: 0.95rem; display: none;
  }
  .explain.show { display: block; }
  .explain.correct-box { background: var(--correct-bg); color: #14532d; }
  .explain.incorrect-box { background: var(--incorrect-bg); color: #7a1a17; }

  .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
  button {
    font: inherit; font-weight: 600; border: none; border-radius: 8px;
    padding: 10px 18px; cursor: pointer; background: var(--accent); color: var(--accent-ink);
  }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }

  .summary { text-align: center; }
  .score-big { font-size: 2.6rem; font-weight: 700; margin: 8px 0; }
  .score-note { color: var(--muted); margin-bottom: 20px; }
  .review-item { text-align: left; padding: 12px 0; border-top: 1px solid var(--border); }
  .review-item:first-child { border-top: none; }
  .review-item .qtext { font-size: 0.98rem; }
  .badge-pass { color: var(--correct); font-weight: 700; }
  .badge-fail { color: var(--incorrect); font-weight: 700; }
  .hidden { display: none !important; }
  footer { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 24px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Projectile Motion — Most Missed Questions</h1>
    <div class="sub">10 questions targeting the mistakes students make most often on this unit. Pick the best answer, then check it — every question explains the reasoning either way.</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">Question 1 of 10</div>
  </header>

  <div id="quizArea"></div>

  <div id="summaryArea" class="card summary hidden">
    <div class="qtag">Results</div>
    <div class="score-big" id="scoreBig"></div>
    <div class="score-note" id="scoreNote"></div>
    <div id="reviewList"></div>
    <div class="actions" style="justify-content:center; margin-top:20px;">
      <button class="secondary" id="retakeBtn">Retake Quiz</button>
    </div>
  </div>

  <footer>Standalone file — works offline, no data leaves this page.</footer>
</div>

<script>
const QUESTIONS = [
  {
    tag: "Independence of axes",
    text: "A bullet is fired perfectly horizontally from a gun at the same instant a bullet is dropped from the same height right next to it. Ignoring air resistance, which one hits the ground first?",
    options: [
      "The fired bullet, because it has more total speed.",
      "The dropped bullet, because it has no sideways motion to slow its fall.",
      "They hit the ground at the same time.",
      "It depends on how fast the fired bullet is moving horizontally."
    ],
    correct: 2,
    explain: "Horizontal and vertical motion are completely independent. Both bullets start with v₀ᵧ = 0 and accelerate downward at the same −9.8 m/s², so their vertical motion — and therefore their fall time — is identical regardless of horizontal speed. The fired bullet just also travels sideways while falling; that sideways motion has zero effect on how long it takes to hit the ground."
  },
  {
    tag: "Velocity at the peak",
    text: "A ball is launched at an angle above the ground. At the exact peak of its trajectory, which statement is correct?",
    options: [
      "Both the horizontal and vertical velocity components are zero.",
      "The vertical velocity component is zero, but the horizontal component is unchanged and nonzero.",
      "The horizontal velocity component is zero, but the vertical component is at its maximum.",
      "The ball is momentarily at rest in every direction."
    ],
    correct: 1,
    explain: "\"Peak\" is defined by v_y = 0 — the instant vertical velocity crosses zero on its way from positive to negative. But nothing ever acts on the horizontal component, so v_x stays exactly what it was at launch (v₀cosθ) the whole flight, including at the peak. The ball is moving horizontally at full speed even though it has zero vertical velocity for that instant."
  },
  {
    tag: "Acceleration at the peak",
    text: "At the peak of a projectile's trajectory, what is the acceleration?",
    options: [
      "Zero, because velocity isn't changing at that instant.",
      "Zero, because the object is momentarily at rest vertically.",
      "−9.8 m/s² (downward), the same as during the rest of the flight.",
      "It switches from negative to positive exactly at the peak."
    ],
    correct: 2,
    explain: "Gravity never turns off. Acceleration is −9.8 m/s² (downward) for the entire flight — rising, at the peak, and falling — with no interruption. v_y passing through zero at the peak is a RESULT of constant downward acceleration, not a sign that acceleration paused. If acceleration were really zero, v_y would stay at zero and the ball would hover."
  },
  {
    tag: "Splitting the initial velocity",
    text: "A projectile is launched at v₀ = 40 m/s at 30° above horizontal. What should you use as the initial vertical velocity in the vertical kinematics equation?",
    options: [
      "40 m/s, the full launch speed",
      "40 × cos(30°) ≈ 34.6 m/s",
      "40 × sin(30°) = 20 m/s",
      "40 / sin(30°) = 80 m/s"
    ],
    correct: 2,
    explain: "The full launch speed v₀ must be split into components before it goes into either equation: v₀ₓ = v₀cosθ belongs in the horizontal equation, and v₀ᵧ = v₀sinθ belongs in the vertical one. Plugging the un-split v₀ into a vertical (or horizontal) equation is the single most common error in this unit — here v₀ᵧ = 40sin30° = 20 m/s."
  },
  {
    tag: "Time of flight",
    text: "You're given a projectile's launch speed and launch angle (nothing else), and asked to find its time of flight over level ground. Which motion do you need to analyze?",
    options: [
      "The horizontal motion — divide some horizontal distance by v₀ₓ.",
      "The vertical motion — use the vertical kinematics equation and solve for when the object returns to launch height.",
      "You need both the horizontal and vertical equations solved together as a system.",
      "Time of flight can't be found without knowing the range."
    ],
    correct: 1,
    explain: "Time of flight is entirely a vertical-motion result — it's the time gravity takes to bring the object back down to landing height, found by setting the vertical position equation equal to the landing height and solving for t. Horizontal information (distance, range, or v₀ₓ) plays no role in determining how long the object is in the air. A common error is trying to pull time of flight out of the horizontal equation instead — but the horizontal equation only tells you how far, using the time the vertical equation already gave you."
  },
  {
    tag: "Range formula validity",
    text: "A ball is launched from the top of a 10 m tower at 45° and lands on the ground below. Can you use R = v₀²sin(2θ)/g to find its horizontal range?",
    options: [
      "Yes, the formula always works for any launch and landing height.",
      "No — that formula assumes launch height equals landing height, which isn't true here since the ball falls to a lower level.",
      "Yes, as long as the angle is exactly 45°.",
      "No, because the formula only works for horizontal launches."
    ],
    correct: 1,
    explain: "R = v₀²sin(2θ)/g is derived by assuming the projectile lands at the same height it launched from, which makes the trajectory symmetric. Launching from a 10 m tower breaks that assumption — the ball falls farther than it rises, so it stays in the air longer than the formula accounts for. The correct approach is to set up the full vertical position equation (including the −10 m drop), solve the resulting quadratic for the true time of flight, and then find range from x = v₀ₓt."
  },
  {
    tag: "Optimal launch angle",
    text: "For MAXIMUM range, is 45° always the best launch angle?",
    options: [
      "Yes, always, regardless of launch and landing height.",
      "Only when launch height equals landing height — otherwise the optimal angle shifts away from 45°.",
      "No, the optimal angle is always less than 45° in every situation.",
      "No, the optimal angle is always greater than 45° in every situation."
    ],
    correct: 1,
    explain: "45° maximizes sin(2θ) in the symmetric range formula, but that formula — and therefore the 45° result — only applies when launch and landing heights match. Off a cliff (landing lower than launch), the optimal angle drops below 45°, because a flatter shot spends more time taking advantage of the 'bonus' fall distance. Onto a raised platform (landing higher), the optimal angle rises above 45°."
  },
  {
    tag: "Complementary angles",
    text: "A projectile launched from level ground at 25° has the same range as one launched at 65°, both at the same speed. Why?",
    options: [
      "It's a coincidence specific to these two angles.",
      "Because 25° and 65° are complementary (they sum to 90°), and sin(2θ) gives the same value for complementary angles.",
      "Because both angles are less than 90°.",
      "It's not actually true — the ranges would be different."
    ],
    correct: 1,
    explain: "In R = v₀²sin(2θ)/g, complementary angles θ and (90° − θ) give the same sin(2θ), since sin(2θ) = sin(180° − 2θ). Here 2(25°) = 50° and 2(65°) = 130°, and sin(50°) = sin(130°). This only holds for equal launch/landing heights — it's a feature of the symmetric range formula specifically, not a general rule."
  },
  {
    tag: "Horizontally launched projectiles",
    text: "A marble rolls off a table horizontally at 2 m/s and falls to the floor. What is its initial vertical velocity, and how does its vertical motion compare to a marble simply dropped from the same height at the same instant?",
    options: [
      "v₀ᵧ = 2 m/s; it falls faster than the dropped marble because of its horizontal speed.",
      "v₀ᵧ = 0; its vertical motion is identical to the dropped marble's the whole way down.",
      "v₀ᵧ = 0; it falls slower than the dropped marble because energy is 'shared' with horizontal motion.",
      "v₀ᵧ cannot be determined without knowing the table height."
    ],
    correct: 1,
    explain: "A horizontal launch means the ENTIRE initial speed is horizontal: v₀ₓ = 2 m/s and v₀ᵧ = 0. From that instant, gravity accelerates the marble downward at 9.8 m/s² exactly as it would any dropped object — the horizontal motion is a completely separate, non-interacting layer on top. Both marbles hit the floor at the same time."
  },
  {
    tag: "Solving order",
    text: "What is the correct general order of steps for solving a projectile motion problem where you need to find the range?",
    options: [
      "Find the range first using the horizontal equation, then work backward to find the time of flight.",
      "Split v₀ into components, solve the vertical equation for time of flight, then use that time in the horizontal equation for range.",
      "Solve the horizontal and vertical equations simultaneously for time and range at once.",
      "Find the range using v₀ directly, without needing to split it into components."
    ],
    correct: 1,
    explain: "The dependency only runs one way: vertical motion determines time of flight independently of anything horizontal, but the horizontal range calculation needs that time as an input. So the reliable order is: (1) split v₀ into v₀ₓ and v₀ᵧ, (2) use the vertical equation to solve for time of flight, (3) plug that same time into x = v₀ₓt for range. Trying to get time from the horizontal side, or skipping the component split, is where most errors creep in."
  }
];

let current = 0;
let answered = new Array(QUESTIONS.length).fill(null);
const quizArea = document.getElementById('quizArea');
const summaryArea = document.getElementById('summaryArea');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');

function renderQuestion(i) {
  const q = QUESTIONS[i];
  const chosen = answered[i];
  const isAnswered = chosen !== null;

  progressFill.style.width = ((i) / QUESTIONS.length * 100) + '%';
  progressLabel.textContent = `Question ${i + 1} of ${QUESTIONS.length}`;

  let optsHtml = q.options.map((opt, idx) => {
    let cls = 'option';
    if (isAnswered) {
      cls += ' disabled';
      if (idx === q.correct) cls += ' correct';
      else if (idx === chosen) cls += ' incorrect';
    }
    return `
      <label class="${cls}" data-idx="${idx}">
        <input type="radio" name="opt" value="${idx}" ${chosen === idx ? 'checked' : ''} ${isAnswered ? 'disabled' : ''}>
        <span>${opt}</span>
      </label>`;
  }).join('');

  let explainHtml = '';
  if (isAnswered) {
    const boxClass = chosen === q.correct ? 'correct-box' : 'incorrect-box';
    const verdict = chosen === q.correct ? 'Correct.' : 'Not quite.';
    explainHtml = `<div class="explain show ${boxClass}"><strong>${verdict}</strong> ${q.explain}</div>`;
  }

  quizArea.innerHTML = `
    <div class="card">
      <div class="qtag">${q.tag}</div>
      <div class="qtext">${q.text}</div>
      <div class="options">${optsHtml}</div>
      ${explainHtml}
      <div class="actions">
        <button class="secondary" id="prevBtn" ${i === 0 ? 'disabled' : ''}>Back</button>
        <button id="nextBtn" ${isAnswered ? '' : 'disabled'}>${i === QUESTIONS.length - 1 ? 'See Results' : 'Next'}</button>
      </div>
    </div>`;

  if (!isAnswered) {
    quizArea.querySelectorAll('.option').forEach(el => {
      el.addEventListener('click', () => {
        const idx = parseInt(el.getAttribute('data-idx'), 10);
        answered[i] = idx;
        renderQuestion(i);
      });
    });
  }

  document.getElementById('prevBtn').addEventListener('click', () => {
    current = Math.max(0, current - 1);
    renderQuestion(current);
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    if (current === QUESTIONS.length - 1) {
      showSummary();
    } else {
      current++;
      renderQuestion(current);
    }
  });
}

function showSummary() {
  quizArea.classList.add('hidden');
  summaryArea.classList.remove('hidden');
  progressFill.style.width = '100%';
  progressLabel.textContent = `Question ${QUESTIONS.length} of ${QUESTIONS.length} — complete`;

  const correctCount = answered.reduce((sum, a, i) => sum + (a === QUESTIONS[i].correct ? 1 : 0), 0);
  const pct = Math.round((correctCount / QUESTIONS.length) * 100);
  document.getElementById('scoreBig').textContent = `${correctCount} / ${QUESTIONS.length} (${pct}%)`;
  const pass = pct >= 80;
  document.getElementById('scoreNote').innerHTML = pass
    ? '<span class="badge-pass">Mastery threshold met (≥ 80%).</span>'
    : '<span class="badge-fail">Below the 80% mastery threshold — review the missed questions below, then retake.</span>';

  const reviewList = document.getElementById('reviewList');
  reviewList.innerHTML = QUESTIONS.map((q, i) => {
    const chosen = answered[i];
    const ok = chosen === q.correct;
    return `
      <div class="review-item">
        <div class="qtag">${q.tag} — ${ok ? '<span class="badge-pass">Correct</span>' : '<span class="badge-fail">Missed</span>'}</div>
        <div class="qtext">${q.text}</div>
        <div style="color:var(--muted); font-size:0.9rem;">Your answer: ${q.options[chosen]}</div>
        ${ok ? '' : `<div style="color:var(--muted); font-size:0.9rem;">Correct answer: ${q.options[q.correct]}</div>`}
        <div style="margin-top:6px; font-size:0.92rem;">${q.explain}</div>
      </div>`;
  }).join('');
}

document.getElementById('retakeBtn').addEventListener('click', () => {
  current = 0;
  answered = new Array(QUESTIONS.length).fill(null);
  summaryArea.classList.add('hidden');
  quizArea.classList.remove('hidden');
  renderQuestion(0);
});

renderQuestion(0);
</script>
</body>
</html>
