<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Work & Energy Quiz — Most Missed Questions</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --muted: #94a3b8;
    --accent: #38bdf8; --good: #22c55e; --bad: #ef4444; --border: #334155;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1rem 4rem; background: var(--bg); color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin-bottom: 0.25rem; }
  .sub { color: var(--muted); margin-bottom: 2rem; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 1.25rem 1.5rem; margin-bottom: 1.25rem;
  }
  .qnum { color: var(--accent); font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.04em; }
  .qtext { font-size: 1.05rem; margin: 0.4rem 0 0.9rem; }
  label.opt {
    display: block; padding: 0.6rem 0.8rem; margin-bottom: 0.5rem; border-radius: 8px;
    border: 1px solid var(--border); cursor: pointer; transition: background 0.15s;
  }
  label.opt:hover { background: #263449; }
  label.opt input { margin-right: 0.6rem; }
  .feedback { display: none; margin-top: 0.8rem; padding: 0.75rem 0.9rem; border-radius: 8px; font-size: 0.95rem; }
  .feedback.correct { display: block; background: rgba(34,197,94,0.12); border: 1px solid var(--good); }
  .feedback.incorrect { display: block; background: rgba(239,68,68,0.12); border: 1px solid var(--bad); }
  label.opt.correct-answer { border-color: var(--good); background: rgba(34,197,94,0.08); }
  label.opt.wrong-answer { border-color: var(--bad); background: rgba(239,68,68,0.08); }
  button {
    background: var(--accent); color: #04263b; border: none; font-weight: 700;
    padding: 0.75rem 1.6rem; border-radius: 8px; font-size: 1rem; cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: 0.5; cursor: default; }
  #results {
    display: none; text-align: center; padding: 1.5rem; border-radius: 10px;
    background: var(--card); border: 1px solid var(--accent); margin-top: 1rem; font-size: 1.15rem;
  }
  #results .score { font-size: 2.2rem; font-weight: 800; color: var(--accent); }
  .retry { margin-top: 1rem; }
  .missed-tag { display: inline-block; font-size: 0.72rem; color: var(--muted); border: 1px solid var(--border); padding: 0.1rem 0.5rem; border-radius: 999px; margin-bottom: 0.5rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Work & Energy — Interactive Quiz</h1>
  <p class="sub">These 8 questions target the mistakes students make most often on this unit. Answer everything, then click "Check My Answers" for instant explanations.</p>

  <form id="quizForm"></form>
  <button id="submitBtn" type="button" onclick="gradeQuiz()">Check My Answers</button>

  <div id="results">
    <div>Your score</div>
    <div class="score" id="scoreText"></div>
    <div id="scoreMsg"></div>
    <div class="retry"><button type="button" onclick="location.reload()">Retake Quiz</button></div>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    tag: "Work can be zero",
    q: "A waiter carries a tray of food at constant height across a room at constant velocity. How much work does the waiter's upward supporting force do on the tray?",
    options: [
      "A large positive amount, since the waiter is exerting effort",
      "Zero, because the force is perpendicular to the horizontal displacement",
      "A negative amount, since gravity opposes it",
      "It depends on how far the waiter walks"
    ],
    correct: 1,
    explain: "Work = Fd cos(θ). The waiter's supporting force is vertical (upward), while the displacement is horizontal — θ = 90°, cos(90°) = 0, so work done by that force is zero, regardless of how tired the waiter feels or how far they walk."
  },
  {
    tag: "Negative work",
    q: "A box slides across a rough floor and comes to a stop due to friction. What is the sign of the work done BY friction on the box?",
    options: ["Positive", "Negative", "Zero", "Depends on the box's mass"],
    correct: 1,
    explain: "Friction acts opposite to the direction of motion (θ = 180°, cos = −1), so it does negative work — removing kinetic energy from the box, consistent with the box slowing down."
  },
  {
    tag: "KE depends on v²",
    q: "A car's speed doubles (from v to 2v). By what factor does its kinetic energy increase?",
    options: ["2×", "4×", "8×", "It stays the same"],
    correct: 1,
    explain: "KE = ½mv². Doubling v means KE scales with (2v)² = 4v², i.e., a factor of 4 — not 2. This v² relationship is one of the most tested ideas in this unit (also why braking distance quadruples when speed doubles)."
  },
  {
    tag: "Mechanical energy conservation requires no friction",
    q: "A block slides down a rough incline with friction present. Which equation correctly relates its energy at the top and bottom?",
    options: [
      "KE_top + PE_top = KE_bottom + PE_bottom (energy is always conserved this way)",
      "KE_top + PE_top = KE_bottom + PE_bottom + |W_friction|",
      "PE_top = KE_bottom only, ignoring friction entirely",
      "KE_bottom = PE_top × μ_k"
    ],
    correct: 1,
    explain: "With friction (a non-conservative force) present, mechanical energy is NOT simply conserved. Some of the initial mechanical energy converts to heat via friction, so you must add the magnitude of friction's (negative) work to balance the equation."
  },
  {
    tag: "Power vs. work/energy",
    q: "Two motors lift identical 100 kg crates to the same height of 5 m. Motor A takes 2 s; Motor B takes 8 s. Which statement is correct?",
    options: [
      "Motor A does more total work than Motor B",
      "Motor A and Motor B do the same total work, but Motor A has greater power",
      "Motor B has greater power, since it took longer",
      "Power cannot be compared without knowing the crates' speeds"
    ],
    correct: 1,
    explain: "Work done = mgh is identical for both (same mass, same height) — total work doesn't depend on time. But power = W/t, so Motor A (less time) delivers the same work at a higher rate, i.e., greater power. Confusing 'more work' with 'faster/more powerful' is a common error."
  },
  {
    tag: "Work-energy theorem with multiple forces",
    q: "A box is pushed with 50 N over 4 m while friction does −80 J of work on it. What is the net work done on the box, and what does that equal?",
    options: [
      "230 J; equal to the box's final KE only",
      "120 J; equal to the change in the box's kinetic energy (ΔKE)",
      "50 J; equal to the box's total energy",
      "Cannot be determined without the box's mass"
    ],
    correct: 1,
    explain: "Work by push = 50 × 4 = 200 J. Net work = 200 + (−80) = 120 J. By the work-energy theorem, W_net = ΔKE — this is what the net work always equals, regardless of how many individual forces contributed to it."
  },
  {
    tag: "Elastic PE",
    q: "A spring with spring constant k = 100 N/m is compressed 0.2 m. If it's compressed to 0.4 m instead (double the distance), how does its stored elastic PE change?",
    options: ["Doubles", "Quadruples", "Stays the same", "Increases by a factor of 8"],
    correct: 1,
    explain: "PE_spring = ½kx². Like kinetic energy, this depends on the displacement squared, so doubling x quadruples the stored energy — not simply doubles it."
  },
  {
    tag: "Choosing a reference height",
    q: "A 2 kg book sits on a shelf 1.5 m above the floor, in a room with a 3 m ceiling. If a student defines h = 0 at the ceiling instead of the floor, what happens to the book's gravitational PE relative to that choice?",
    options: [
      "It becomes negative, but energy DIFFERENCES (like ΔPE) between two points are unaffected by the reference choice",
      "It is undefined — you must always use the floor as h = 0",
      "It becomes zero automatically",
      "It changes the book's mass in the calculation"
    ],
    correct: 0,
    explain: "PE_grav = mgh is always relative to a chosen reference point — the actual numeric value can be negative or positive depending on that choice, but any physically meaningful CHANGE in PE (ΔPE) between two heights stays the same no matter where you set h = 0."
  }
];

const form = document.getElementById('quizForm');
QUESTIONS.forEach((item, qi) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="missed-tag">Often missed: ${item.tag}</div>
    <div class="qnum">Question ${qi + 1}</div>
    <div class="qtext">${item.q}</div>
    <div class="opts">
      ${item.options.map((opt, oi) => `
        <label class="opt" id="q${qi}_opt${oi}">
          <input type="radio" name="q${qi}" value="${oi}"> ${opt}
        </label>
      `).join('')}
    </div>
    <div class="feedback" id="q${qi}_feedback"></div>
  `;
  form.appendChild(card);
});

function gradeQuiz() {
  let score = 0;
  QUESTIONS.forEach((item, qi) => {
    const selected = form.querySelector(`input[name="q${qi}"]:checked`);
    const fb = document.getElementById(`q${qi}_feedback`);
    const correctLabel = document.getElementById(`q${qi}_opt${item.correct}`);
    correctLabel.classList.add('correct-answer');

    if (!selected) {
      fb.className = 'feedback incorrect';
      fb.style.display = 'block';
      fb.innerHTML = `<strong>Not answered.</strong> Correct answer: "${item.options[item.correct]}". ${item.explain}`;
      return;
    }
    const chosen = parseInt(selected.value, 10);
    if (chosen === item.correct) {
      score++;
      fb.className = 'feedback correct';
      fb.innerHTML = `<strong>Correct!</strong> ${item.explain}`;
    } else {
      document.getElementById(`q${qi}_opt${chosen}`).classList.add('wrong-answer');
      fb.className = 'feedback incorrect';
      fb.innerHTML = `<strong>Not quite.</strong> Correct answer: "${item.options[item.correct]}". ${item.explain}`;
    }
    fb.style.display = 'block';
  });

  document.querySelectorAll('#quizForm input[type=radio]').forEach(r => r.disabled = true);
  document.getElementById('submitBtn').disabled = true;

  const pct = Math.round((score / QUESTIONS.length) * 100);
  document.getElementById('scoreText').textContent = `${score} / ${QUESTIONS.length} (${pct}%)`;
  const msg = pct >= 80
    ? "Great work — you've met the 80% target for this unit."
    : "Below the 80% target. Review the explanations above and the Cornell notes, then retake.";
  document.getElementById('scoreMsg').textContent = msg;
  document.getElementById('results').style.display = 'block';
  document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
}
</script>
</body>
</html>
