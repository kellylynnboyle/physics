<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Physics Quiz Practice</title>
<style>
:root{--bg:#fff;--fg:#1b2430;--card:#f3f6fb;--accent:#1f3864;--ok:#1d7a3c;--bad:#b3261e;--bd:#cbd5e3}
@media(prefers-color-scheme:dark){:root{--bg:#12161c;--fg:#e8edf4;--card:#1c232d;--accent:#8db1ee;--ok:#5cd08a;--bad:#ff8b80;--bd:#3a4556}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{color:var(--accent);font-size:1.5rem}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
button.on{background:var(--accent);color:var(--bg)}
.q{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin:14px 0}
.q button{display:block;width:100%;margin:6px 0}
.q button.right{border-color:var(--ok);outline:2px solid var(--ok)}
.q button.wrong{border-color:var(--bad);outline:2px solid var(--bad)}
.exp{margin-top:8px;font-size:.95rem}
.bar{font-weight:600;margin:10px 0}
</style></head><body><main>
<h1>Physics Quiz Practice</h1>
<p>Most-missed questions by unit. Pick an answer for instant feedback. Scores save in this browser.</p>
<div class="tabs" id="tabs"></div><div class="bar" id="bar"></div><div id="qs"></div>
<div><button id="retry">Retry missed questions</button> <button id="reset">Reset unit</button></div>
</main>
<script>
const DATA=[{"id": "01-kinematics", "title": "Kinematics", "questions": [{"q": "A runner completes one 400 m lap in 80 s and ends where she started. What is her average velocity?", "c": ["5 m/s", "0 m/s", "400 m/s", "80 m/s"], "a": 1, "e": "Displacement is 0, so average velocity is 0. (Her average SPEED is 400/80 = 5 m/s.)"}, {"q": "A ball is thrown straight up. At the very top of its path, its acceleration is:", "c": ["0", "9.8 m/s^2 downward", "9.8 m/s^2 upward", "Depends on how hard it was thrown"], "a": 1, "e": "Gravity still acts, so a = 9.8 m/s^2 down. Only the velocity is momentarily zero."}, {"q": "A car has positive velocity and negative acceleration. The car is:", "c": ["Speeding up", "Slowing down", "Moving at constant speed", "At rest"], "a": 1, "e": "Opposite signs of v and a mean the car is slowing down."}, {"q": "On a velocity-time graph, the slope of the line represents:", "c": ["Position", "Displacement", "Acceleration", "Speed"], "a": 2, "e": "Slope of v-t = dv/dt = acceleration. The AREA gives displacement."}, {"q": "A car starts from rest and accelerates at 3 m/s^2 for 4 s. How far does it travel?", "c": ["12 m", "24 m", "48 m", "6 m"], "a": 1, "e": "dx = 1/2 a t^2 = 0.5(3)(16) = 24 m. (12 m is the final speed, not distance.)"}, {"q": "A rock is dropped from rest. After 2.0 s (g = 9.8, ignore air) its speed is about:", "c": ["9.8 m/s", "19.6 m/s", "4.9 m/s", "39.2 m/s"], "a": 1, "e": "v = gt = 9.8 x 2 = 19.6 m/s."}, {"q": "A horizontal line on a position-time graph means the object is:", "c": ["Moving at constant velocity", "Accelerating", "At rest", "Falling"], "a": 2, "e": "Zero slope on x-t means velocity is zero: at rest."}, {"q": "Starting from rest with constant acceleration, if time doubles the distance becomes:", "c": ["2 times", "4 times", "8 times", "Stays the same"], "a": 1, "e": "dx = 1/2 a t^2 depends on t squared, so doubling t gives 4x the distance."}, {"q": "Ignoring air resistance, a bowling ball and a tennis ball are dropped from the same height. Which lands first?", "c": ["Bowling ball", "Tennis ball", "Same time", "Cannot tell"], "a": 2, "e": "Acceleration due to gravity does not depend on mass, so they land together."}]}, {"id": "02-projectile-motion", "title": "Projectile Motion", "questions": [{"q": "One ball is dropped and another is rolled horizontally off the same table at 3 m/s at the same instant. Which hits the floor first?", "c": ["The dropped ball", "The rolled ball", "They land at the same time", "Depends on their masses"], "a": 2, "e": "Vertical motion is identical for both (both start with vy = 0), so they land together."}, {"q": "At the highest point of a projectile's flight, its acceleration is:", "c": ["Zero", "9.8 m/s^2 downward", "9.8 m/s^2 upward", "Equal to v cos(theta)"], "a": 1, "e": "Gravity never stops acting. Acceleration is 9.8 m/s^2 down throughout."}, {"q": "A projectile is launched at an angle. At the top its speed is:", "c": ["Zero", "Equal to the launch speed", "v cos(theta)", "v sin(theta)"], "a": 2, "e": "Only vy is zero at the top; the horizontal component v cos(theta) remains."}, {"q": "Ignoring air resistance, the horizontal velocity of a projectile during flight:", "c": ["Increases", "Decreases", "Is constant", "Is zero at the top"], "a": 2, "e": "No horizontal force means no horizontal acceleration."}, {"q": "Which launch angle gives the greatest range on level ground (no air)?", "c": ["30 degrees", "45 degrees", "60 degrees", "90 degrees"], "a": 1, "e": "R = v^2 sin(2 theta)/g is maximum when 2 theta = 90, so theta = 45."}, {"q": "Which pair of launch angles (same speed) gives the same range?", "c": ["20 and 40", "30 and 60", "45 and 60", "10 and 100"], "a": 1, "e": "Complementary angles (sum 90 degrees) give equal range."}, {"q": "A ball is kicked at 50 m/s at 30 degrees above horizontal. How long does it rise to its peak?", "c": ["2.55 s", "5.1 s", "4.4 s", "1.28 s"], "a": 0, "e": "vy0 = 50 sin30 = 25 m/s. t = vy0/g = 25/9.8 = 2.55 s (5.1 s is the full flight)."}, {"q": "A ball rolls off a 19.6 m high cliff horizontally at 15 m/s. How far from the base does it land? (g = 9.8)", "c": ["15 m", "30 m", "45 m", "60 m"], "a": 1, "e": "t = sqrt(2(19.6)/9.8) = 2.0 s. x = 15 x 2 = 30 m."}, {"q": "A package is released from a plane flying level at constant velocity. Ignoring air, where is the plane when the package lands?", "c": ["Far ahead of the package", "Directly above it", "Behind it", "Depends on mass"], "a": 1, "e": "The package keeps the plane's horizontal velocity, so it stays directly below the plane."}]}, {"id": "03-newtons-laws", "title": "Newton's Laws", "questions": [{"q": "An object moves at constant velocity in a straight line. The net force on it is:", "c": ["In the direction of motion", "Zero", "Equal to its weight", "Equal to mv"], "a": 1, "e": "Constant velocity means a = 0, so net force = 0 (Newton's 1st law). Motion does not require a net force."}, {"q": "A book rests on a table. Weight and normal force are:", "c": ["A Newton's 3rd law pair", "Balanced forces on the same object, not a 3rd-law pair", "Always equal in every situation", "Both act on the table"], "a": 1, "e": "They act on the same object. The 3rd-law partner of the weight is the book's pull on Earth."}, {"q": "A truck hits a mosquito. Compared with the force on the mosquito, the force on the truck is:", "c": ["Much larger", "Much smaller", "Equal in magnitude", "Zero"], "a": 2, "e": "Newton's 3rd law: equal and opposite. The mosquito just has a much larger acceleration."}, {"q": "A 10 kg object accelerates at 2 m/s^2. The net force is:", "c": ["5 N", "12 N", "20 N", "0.2 N"], "a": 2, "e": "F = ma = 10 x 2 = 20 N."}, {"q": "An astronaut travels from Earth to the Moon. Her mass and weight:", "c": ["Both stay the same", "Mass same, weight less", "Mass less, weight same", "Both decrease"], "a": 1, "e": "Mass is intrinsic; weight = mg and Moon g is smaller."}, {"q": "A 5 kg block is pushed with 30 N across a floor with 10 N of friction. Its acceleration is:", "c": ["4 m/s^2", "6 m/s^2", "8 m/s^2", "2 m/s^2"], "a": 0, "e": "Net force = 30 - 10 = 20 N; a = 20/5 = 4 m/s^2."}, {"q": "In an elevator accelerating upward, the scale reading (normal force) on you is:", "c": ["Less than your weight", "Equal to your weight", "Greater than your weight", "Zero"], "a": 2, "e": "N - mg = ma (up), so N = m(g + a) > mg."}, {"q": "A hockey puck slides on frictionless ice at constant speed. The horizontal force needed to keep it moving is:", "c": ["Equal to its weight", "Equal to its mass", "Zero", "Equal to its speed"], "a": 2, "e": "No friction and constant velocity: no force is needed."}, {"q": "The weight of a 60 kg person on Earth (g = 9.8 m/s^2) is:", "c": ["60 N", "588 N", "6 N", "5.88 N"], "a": 1, "e": "W = mg = 60 x 9.8 = 588 N."}, {"q": "The same net force is applied to a cart, then doubled with the mass unchanged. The acceleration:", "c": ["Halves", "Stays the same", "Doubles", "Quadruples"], "a": 2, "e": "a = F/m, so doubling F doubles a."}]}, {"id": "04-momentum", "title": "Momentum", "questions": [{"q": "A 1200 kg car moves at 20 m/s. Its momentum is:", "c": ["60 kg m/s", "24,000 kg m/s", "240,000 kg m/s", "1,220 kg m/s"], "a": 1, "e": "p = mv = 1200 x 20 = 24,000 kg m/s."}, {"q": "A 2 kg cart at 5 m/s hits a 3 kg cart at rest and they stick. Final speed?", "c": ["5 m/s", "2.5 m/s", "2 m/s", "1 m/s"], "a": 2, "e": "Total p = 10; mass 5 kg; v = 10/5 = 2 m/s."}, {"q": "A catcher moves her glove backward while catching a fast ball. This:", "c": ["Reduces the ball's momentum change", "Increases contact time and reduces average force", "Increases the impulse", "Has no effect"], "a": 1, "e": "Same dp, longer dt means a smaller average force."}, {"q": "In a perfectly inelastic collision, which quantity is conserved?", "c": ["Kinetic energy only", "Momentum only", "Both momentum and kinetic energy", "Neither"], "a": 1, "e": "Momentum is conserved in all collisions without external force; KE is not conserved when objects stick."}, {"q": "A 50 N force acts for 0.20 s. The impulse is:", "c": ["10 N s", "250 N s", "0.004 N s", "50 N s"], "a": 0, "e": "J = F dt = 50 x 0.20 = 10 N s."}, {"q": "A cannon fires a ball forward. The cannon:", "c": ["Does not move", "Recoils backward", "Moves forward too", "Spins"], "a": 1, "e": "Total initial momentum is zero, so the cannon must move opposite to the ball."}, {"q": "Which has more momentum: a 2 kg ball at 10 m/s or a 10 kg ball at 1.5 m/s?", "c": ["The 2 kg ball", "The 10 kg ball", "They are equal", "Cannot tell"], "a": 0, "e": "20 vs 15 kg m/s."}, {"q": "A 0.15 kg ball at 40 m/s is caught and brought to rest in 0.005 s. Average force on the ball?", "c": ["30 N", "1200 N", "6 N", "7.5 N"], "a": 1, "e": "dp = 0.15 x 40 = 6 kg m/s; F = 6/0.005 = 1200 N."}, {"q": "Two identical carts collide head-on at equal speeds. Total momentum before the collision is:", "c": ["Twice one cart's", "Equal to one cart's", "Zero", "Cannot tell"], "a": 2, "e": "Momentum is a vector. Equal and opposite momenta cancel to zero."}, {"q": "A rubber ball bounces back from a wall; a clay ball sticks. Same mass and speed. Which receives the larger impulse?", "c": ["The clay ball", "The rubber ball", "Same impulse", "Neither"], "a": 1, "e": "Bounce reverses velocity (change = 2mv); sticking only removes it (mv)."}]}, {"id": "05-work-and-energy", "title": "Work & Energy", "questions": [{"q": "A student carries a heavy box horizontally at constant speed. The work done by the upward lifting force is:", "c": ["Large and positive", "Zero", "Negative", "mgh"], "a": 1, "e": "The force is perpendicular to the displacement, so cos(90) = 0 and work = 0."}, {"q": "If an object's speed doubles, its kinetic energy:", "c": ["Doubles", "Triples", "Quadruples", "Stays same"], "a": 2, "e": "KE = 1/2 mv^2; v is squared."}, {"q": "A 2.0 kg ball is dropped from 5.0 m. Its speed just before hitting the ground is about (g = 9.8):", "c": ["4.9 m/s", "9.9 m/s", "49 m/s", "98 m/s"], "a": 1, "e": "v = sqrt(2gh) = sqrt(2 x 9.8 x 5.0) = 9.9 m/s. Mass cancels."}, {"q": "A 50 N force pushes a crate 4.0 m in the direction of the force. Work done?", "c": ["12.5 J", "54 J", "200 J", "46 J"], "a": 2, "e": "W = Fd = 50 x 4.0 = 200 J."}, {"q": "A machine does 200 J of work in 5.0 s. Its power is:", "c": ["40 W", "1000 W", "195 W", "0.025 W"], "a": 0, "e": "P = W/t = 200/5.0 = 40 W."}, {"q": "A skier slides down a hill with friction. Compared with the starting PE, the KE at the bottom is:", "c": ["Equal", "Greater", "Less, with the difference becoming thermal energy", "Zero"], "a": 2, "e": "Friction transfers some energy to heat, so KE_f < PE_i. Total energy is still conserved."}, {"q": "A person holds a 10 kg backpack stationary for one minute. The work done on the backpack is:", "c": ["Large", "Zero", "Negative", "mg"], "a": 1, "e": "No displacement, so no work (even though the person gets tired)."}, {"q": "A 1000 kg car speeds up from 10 m/s to 20 m/s. Net work done on the car is:", "c": ["10,000 J", "50,000 J", "150,000 J", "200,000 J"], "a": 2, "e": "dKE = 1/2(1000)(400 - 100) = 150,000 J."}, {"q": "Doubling the height of an object (same mass) its gravitational potential energy:", "c": ["Doubles", "Quadruples", "Halves", "Unchanged"], "a": 0, "e": "PE = mgh is linear in h."}, {"q": "An energy-conversion device is 30% efficient with 500 J of input. Useful output is:", "c": ["150 J", "350 J", "1667 J", "30 J"], "a": 0, "e": "0.30 x 500 = 150 J. The other 350 J is wasted, mostly as heat."}]}];
let unit=0,only=null,state={};
const key="physics-quiz-v1";
try{state=JSON.parse(localStorage.getItem(key)||"{}")}catch(e){}
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}}
function shuffle(n){const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function render(){
  const u=DATA[unit];state[u.id]=state[u.id]||{};const S=state[u.id];
  const tabs=document.getElementById("tabs");tabs.innerHTML="";
  DATA.forEach((d,i)=>{const b=document.createElement("button");const s=state[d.id]||{};
    const n=Object.values(s).filter(v=>v===1).length;b.textContent=d.title+" ("+n+"/"+d.questions.length+")";
    if(i===unit)b.className="on";b.onclick=()=>{unit=i;only=null;render()};tabs.appendChild(b)});
  const box=document.getElementById("qs");box.innerHTML="";
  u.questions.forEach((q,qi)=>{
    if(only&&!only.includes(qi))return;
    const div=document.createElement("div");div.className="q";
    const p=document.createElement("div");p.textContent=(qi+1)+". "+q.q;div.appendChild(p);
    const ex=document.createElement("div");ex.className="exp";
    const order=shuffle(q.c.length);const btns=[];
    order.forEach(ci=>{const b=document.createElement("button");b.textContent=q.c[ci];btns.push([b,ci]);
      b.onclick=()=>{if(div.dataset.done)return;div.dataset.done=1;
        const ok=ci===q.a;S[qi]=ok?1:0;save();
        btns.forEach(([bb,c])=>{if(c===q.a)bb.classList.add("right");else if(bb===b)bb.classList.add("wrong")});
        ex.textContent=(ok?"Correct. ":"Not quite. ")+q.e;updateBar()};
      div.appendChild(b)});
    div.appendChild(ex);box.appendChild(div)});
  updateBar();
}
function updateBar(){const u=DATA[unit],S=state[u.id]||{};
  const done=Object.keys(S).length,ok=Object.values(S).filter(v=>v===1).length;
  document.getElementById("bar").textContent=u.title+": "+ok+" correct of "+done+" answered ("+u.questions.length+" total)"+
   (done===u.questions.length?" - "+Math.round(100*ok/u.questions.length)+"%":"")}
document.getElementById("retry").onclick=()=>{const u=DATA[unit],S=state[u.id]||{};
  const miss=u.questions.map((_,i)=>i).filter(i=>S[i]!==1);only=miss;miss.forEach(i=>delete S[i]);save();render()};
document.getElementById("reset").onclick=()=>{state[DATA[unit].id]={};only=null;save();render()};
render();
</script></body></html>
