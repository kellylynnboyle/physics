<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physics Quizzes: Most-Missed Questions</title>
<style>
  :root { --bg:#fff; --fg:#1c2333; --muted:#5b6478; --card:#f4f6fb; --line:#d7dcea; --accent:#2a5bd7; --ok:#1b7f3b; --bad:#b3261e; --okbg:#e6f4ea; --badbg:#fce8e6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151d; --fg:#e6e9f2; --muted:#9aa3b8; --card:#1b202c; --line:#2d3446; --accent:#7ea2ff; --ok:#6fd08c; --bad:#ff8a80; --okbg:#173323; --badbg:#3a1d1b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:16px; }
  h1 { font-size:1.5rem; margin:.5rem 0; }
  .sub { color:var(--muted); margin-bottom:1rem; }
  .tabs { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:1rem; }
  button { font:inherit; cursor:pointer; }
  .tab { padding:8px 12px; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:8px; }
  .tab[aria-pressed="true"] { background:var(--accent); color:#fff; border-color:var(--accent); }
  .best { font-size:.8rem; opacity:.85; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .std { color:var(--muted); font-size:.9rem; }
  .choice { display:block; width:100%; text-align:left; margin:8px 0; padding:10px 12px; border:1px solid var(--line); background:var(--bg); color:var(--fg); border-radius:8px; }
  .choice:hover:not(:disabled) { border-color:var(--accent); }
  .choice.ok { background:var(--okbg); border-color:var(--ok); }
  .choice.bad { background:var(--badbg); border-color:var(--bad); }
  .why { margin-top:12px; padding:10px 12px; border-left:4px solid var(--accent); background:var(--bg); }
  .primary { padding:10px 16px; border:0; border-radius:8px; background:var(--accent); color:#fff; margin-top:12px; }
  .primary.alt { background:var(--card); color:var(--fg); border:1px solid var(--line); margin-left:8px; }
  progress { width:100%; height:10px; }
  .miss li { margin:.5rem 0; }
  :focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<main>
  <h1>Physics Quizzes: Most-Missed Questions</h1>
  <p class="sub">Pick a unit. You get instant feedback and an explanation of the common misconception. Best scores are saved on this device only.</p>
  <div class="tabs" id="tabs" role="group" aria-label="Choose a unit"></div>
  <div id="app" class="card" aria-live="polite"></div>
</main>
<script src="quizzes.js"></script>
<script>
(function () {
  var quizzes = window.QUIZZES, tabs = document.getElementById("tabs"), app = document.getElementById("app");
  var state = null;

  function store(get, key, val) {
    try { return get ? JSON.parse(localStorage.getItem(key)) : localStorage.setItem(key, JSON.stringify(val)); } catch (e) { return null; }
  }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function el(tag, attrs, text) { var e = document.createElement(tag); for (var k in (attrs || {})) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; return e; }

  function renderTabs(activeId) {
    tabs.textContent = "";
    quizzes.forEach(function (z) {
      var best = store(true, "best-" + z.id);
      var b = el("button", { "class": "tab", "aria-pressed": String(z.id === activeId) });
      b.appendChild(document.createTextNode(z.title));
      if (best != null) b.appendChild(el("span", { "class": "best" }, "  best " + best + "/" + z.questions.length));
      b.onclick = function () { start(z); };
      tabs.appendChild(b);
    });
  }

  function start(z) {
    state = { quiz: z, order: shuffle(z.questions.map(function (q, i) { return i; })), i: 0, score: 0, missed: [] };
    renderTabs(z.id);
    showQuestion();
  }

  function showQuestion() {
    var z = state.quiz, q = z.questions[state.order[state.i]];
    app.textContent = "";
    app.appendChild(el("div", { "class": "std" }, z.title + " | " + z.standards));
    var p = el("progress", { max: z.questions.length, value: state.i, "aria-label": "Progress" });
    app.appendChild(p);
    app.appendChild(el("h2", {}, "Question " + (state.i + 1) + " of " + z.questions.length));
    app.appendChild(el("p", {}, q.q));
    var box = el("div"), answered = false;
    var idx = shuffle(q.choices.map(function (c, i) { return i; }));
    idx.forEach(function (ci) {
      var b = el("button", { "class": "choice" }, q.choices[ci]);
      b.onclick = function () {
        if (answered) return; answered = true;
        var right = ci === q.answer;
        if (right) state.score++; else state.missed.push(q);
        Array.prototype.forEach.call(box.children, function (btn, k) {
          btn.disabled = true;
          if (idx[k] === q.answer) btn.classList.add("ok");
          else if (idx[k] === ci) btn.classList.add("bad");
        });
        var fb = el("div", { "class": "why" });
        fb.appendChild(el("strong", {}, right ? "Correct. " : "Not quite. "));
        fb.appendChild(document.createTextNode(q.why));
        app.appendChild(fb);
        var next = el("button", { "class": "primary" }, state.i + 1 < z.questions.length ? "Next question" : "See results");
        next.onclick = function () { state.i++; state.i < z.questions.length ? showQuestion() : showResults(); };
        app.appendChild(next); next.focus();
      };
      box.appendChild(b);
    });
    app.appendChild(box);
  }

  function showResults() {
    var z = state.quiz, n = z.questions.length;
    var prev = store(true, "best-" + z.id);
    if (prev == null || state.score > prev) store(false, "best-" + z.id, state.score);
    renderTabs(z.id);
    app.textContent = "";
    app.appendChild(el("h2", {}, z.title + ": " + state.score + " / " + n));
    var pct = Math.round(100 * state.score / n);
    app.appendChild(el("p", {}, pct + "%. " + (pct >= 85 ? "Proficient. Move on or try another unit." : pct >= 60 ? "Approaching. Re-read your Cornell notes and retry." : "Not yet. Review the notes and the explanations below, then retry.")));
    if (state.missed.length) {
      app.appendChild(el("h3", {}, "Review what you missed"));
      var ul = el("ul", { "class": "miss" });
      state.missed.forEach(function (q) {
        var li = el("li"); li.appendChild(el("strong", {}, q.q)); li.appendChild(el("div", {}, "Answer: " + q.choices[q.answer])); li.appendChild(el("div", { "class": "std" }, q.why)); ul.appendChild(li);
      });
      app.appendChild(ul);
    }
    var again = el("button", { "class": "primary" }, "Retry this unit"); again.onclick = function () { start(z); };
    app.appendChild(again);
  }

  renderTabs(null);
  app.appendChild(el("p", {}, "Choose a unit above to begin."));
})();
</script>
</body>
</html>
