<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Momentum Quiz</title>
<style>
  :root { --bg:#f6f7fb; --card:#ffffff; --ink:#1b2333; --muted:#5b6475; --line:#d5dae6; --navy:#1f3864; --accent:#2f5bd0;
          --good:#1b7a3d; --goodbg:#e4f4e9; --bad:#b3261e; --badbg:#fbe9e7; --tip:#6b4a00; --tipbg:#fff4d6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151c; --card:#1b202b; --ink:#e8ebf2; --muted:#a3acbd; --line:#343b4b; --navy:#a9c0f5; --accent:#8fb0ff;
            --good:#7ddc9c; --goodbg:#16311f; --bad:#ff9d94; --badbg:#3a1b19; --tip:#ffd98a; --tipbg:#3a2f12; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; color: var(--navy); }
  .sub { color: var(--muted); margin: 0 0 16px; }
  .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 12px 0 20px; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .25s; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  .count { color: var(--muted); font-size: .875rem; margin: 0 0 8px; display:flex; justify-content:space-between; gap:12px; }
  .q { font-size: 1.125rem; font-weight: 600; margin: 0 0 16px; }
  .choice { display:block; width:100%; text-align:left; padding:12px 14px; margin: 0 0 10px; font: inherit; color: inherit;
            background: transparent; border: 1.5px solid var(--line); border-radius: 10px; cursor: pointer; }
  .choice:hover:not(:disabled), .choice:focus-visible { border-color: var(--accent); outline: none; }
  .choice:disabled { cursor: default; }
  .choice.right { border-color: var(--good); background: var(--goodbg); }
  .choice.wrong { border-color: var(--bad); background: var(--badbg); }
  .fb { margin-top: 14px; padding: 12px 14px; border-radius: 10px; }
  .fb.ok { background: var(--goodbg); } .fb.no { background: var(--badbg); }
  .fb strong.ok { color: var(--good); } .fb strong.no { color: var(--bad); }
  .tip { margin-top: 10px; padding: 10px 14px; border-radius: 10px; background: var(--tipbg); color: var(--tip); font-size: .9375rem; }
  .btn { margin-top: 16px; padding: 10px 18px; font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 10px; cursor: pointer; }
  @media (prefers-color-scheme: dark) { .btn { color:#0f1320; } }
  .btn.alt { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); margin-left: 8px; }
  .score { font-size: 2rem; font-weight: 700; margin: 0; color: var(--navy); }
  ul.missed { padding-left: 20px; } ul.missed li { margin-bottom: 10px; }
  .muted { color: var(--muted); } a { color: var(--accent); }
  footer { margin-top: 20px; font-size: .875rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Momentum: Most-Missed Questions</h1>
  <p class="sub">10 questions built around the mistakes students make most often. Goal: 8 or more correct. Answer order is shuffled every time.</p>
  <div class="bar" aria-hidden="true"><div id="bar"></div></div>
  <div class="card" id="card"></div>
  <footer><span id="best"></span> <a href="README.md">Back to the unit page</a> · <a href="../../index.html">All quizzes</a></footer>
</main>
<script>
const UNIT = "04-momentum";
const ALL = [{"q":"A rubber ball and a lump of clay with the same mass hit a wall at the same speed. The ball bounces back; the clay sticks. Which delivers the larger impulse to the wall?","choices":["The rubber ball","The clay","They deliver the same impulse","Neither delivers an impulse"],"a":0,"why":"Impulse equals change in momentum. The clay goes from mv to 0. The ball goes from mv to nearly −mv, almost twice the change.","miss":"Thinking the object that \"sticks\" hits harder, or ignoring the direction reversal."},{"q":"How does an airbag reduce injury in a crash?","choices":["It increases the stopping time, which decreases the force","It decreases the change in momentum of the passenger","It decreases the impulse on the passenger","It increases the stopping force"],"a":0,"why":"The passenger's change in momentum (and so the impulse) is the same with or without the bag. Spreading it over a longer time makes the force smaller.","miss":"Saying the airbag reduces the impulse or the momentum change."},{"q":"Two carts at rest are pushed apart by a spring between them. What is their total momentum afterward? (Ignore friction.)","choices":["Zero","Twice the momentum of one cart","It depends on which cart is heavier","Equal to the momentum of the faster cart"],"a":0,"why":"The total was zero before, and no external force acted, so it is zero after. The carts have equal and opposite momenta.","miss":"Adding the sizes of the momenta and ignoring direction."},{"q":"A truck and a small car collide and stick together. How do the sizes of their changes in momentum compare?","choices":["They are equal","The truck's is larger","The car's is larger","It depends on which was moving faster"],"a":0,"why":"The forces on each are equal and opposite and last the same time, so the impulses, and the momentum changes, are equal in size. The car's velocity changes more because its mass is smaller.","miss":"Mixing up change in momentum with change in velocity."},{"q":"In an inelastic collision in an isolated system, what is conserved?","choices":["Momentum, but not kinetic energy","Kinetic energy, but not momentum","Both momentum and kinetic energy","Neither momentum nor kinetic energy"],"a":0,"why":"Momentum is conserved in every collision with no net external force. In an inelastic collision some kinetic energy becomes heat, sound, and deformation.","miss":"Thinking momentum is \"lost\" whenever kinetic energy is lost."},{"q":"A 2 kg cart moves right at 3 m/s and another 2 kg cart moves left at 3 m/s. What is the total momentum of the two carts?","choices":["0 kg·m/s","12 kg·m/s","6 kg·m/s","18 kg·m/s"],"a":0,"why":"Momentum is a vector: (+6) + (−6) = 0.","miss":"Adding the two momenta as if they were both positive."},{"q":"A car doubles its speed. What happens to its momentum and its kinetic energy?","choices":["Momentum doubles; kinetic energy is four times as large","Both double","Both are four times as large","Momentum is four times as large; kinetic energy doubles"],"a":0,"why":"p = mv depends on v, so it doubles. KE = ½mv² depends on v², so it is multiplied by four.","miss":"Treating momentum and kinetic energy as the same quantity."},{"q":"A 1 kg cart moving at 4 m/s hits a 3 kg cart at rest and sticks to it. What is their speed afterward?","choices":["1 m/s","4 m/s","2 m/s","1.33 m/s"],"a":0,"why":"Before: (1)(4) = 4 kg·m/s. After: (1 + 3)v = 4, so v = 1 m/s.","miss":"Dividing by only the mass that was hit (3 kg) instead of the combined mass."},{"q":"An egg thrown at a hanging bedsheet does not break, but the same egg thrown at a wall at the same speed does. Why?","choices":["The sheet stops the egg over a longer time, so the force is smaller","The sheet gives the egg a smaller impulse","The egg has less momentum when it hits the sheet","The wall pushes back, but the sheet does not"],"a":0,"why":"The egg's change in momentum is the same in both cases. The sheet gives way, stretching the time and shrinking the force.","miss":"Believing a soft surface changes the impulse."},{"q":"When is the total momentum of a system conserved?","choices":["When no net external force acts on the system","Only when the collision is elastic","Only when the objects have equal masses","Only when the objects stick together"],"a":0,"why":"Internal forces come in equal and opposite pairs and cannot change the total. Only a net external force can.","miss":"Tying momentum conservation to a particular type of collision."}];
const GOAL = 8;
let queue = [], pos = 0, right = 0, missed = [];
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function getBest() { try { return Number(localStorage.getItem("best-" + UNIT)) || 0; } catch (e) { return 0; } }
function setBest(n) { try { if (n > getBest()) localStorage.setItem("best-" + UNIT, String(n)); } catch (e) {} }
function showBest() { const b = getBest(); $("best").textContent = b ? "Your best on this device: " + b + "/" + ALL.length + "." : ""; }

function start(items) { queue = shuffle(items); pos = 0; right = 0; missed = []; render(); }

function render() {
  $("bar").style.width = (100 * pos / queue.length) + "%";
  if (pos >= queue.length) return finish();
  const item = queue[pos];
  const order = shuffle(item.choices.map((text, i) => ({ text, correct: i === item.a })));
  let html = '<p class="count"><span>Question ' + (pos + 1) + " of " + queue.length + "</span><span>" + right + " correct so far</span></p>";
  html += '<p class="q">' + esc(item.q) + "</p>";
  order.forEach((c, i) => { html += '<button class="choice" data-i="' + i + '">' + esc(c.text) + "</button>"; });
  html += '<div id="after" aria-live="polite"></div>';
  $("card").innerHTML = html;
  document.querySelectorAll(".choice").forEach((btn) => btn.addEventListener("click", () => answer(item, order, Number(btn.dataset.i))));
}

function answer(item, order, picked) {
  const ok = order[picked].correct;
  document.querySelectorAll(".choice").forEach((btn, i) => {
    btn.disabled = true;
    if (order[i].correct) btn.classList.add("right");
    else if (i === picked) btn.classList.add("wrong");
  });
  if (ok) right++; else missed.push(item);
  const last = pos + 1 >= queue.length;
  $("after").innerHTML =
    '<div class="fb ' + (ok ? "ok" : "no") + '"><strong class="' + (ok ? "ok" : "no") + '">' + (ok ? "Correct." : "Not quite.") + "</strong> " + esc(item.why) + "</div>" +
    '<div class="tip"><strong>Why this one gets missed:</strong> ' + esc(item.miss) + "</div>" +
    '<button class="btn" id="next">' + (last ? "See results" : "Next question") + "</button>";
  $("next").addEventListener("click", () => { pos++; render(); });
  $("next").focus();
}

function finish() {
  const full = queue.length === ALL.length;
  if (full) setBest(right);
  showBest();
  let html = '<p class="score">' + right + " / " + queue.length + "</p>";
  if (full) html += "<p>" + (right >= GOAL ? "You met the goal of " + GOAL + ". Mark this quiz done on your unit checklist." : "The goal is " + GOAL + ". Review the notes for the questions below, then try again.") + "</p>";
  else html += '<p class="muted">Review round. Take the full quiz again to record a score.</p>';
  if (missed.length) {
    html += "<h2>Review these</h2><ul class='missed'>";
    missed.forEach((m) => { html += "<li><strong>" + esc(m.q) + "</strong><br>Answer: " + esc(m.choices[m.a]) + "<br><span class='muted'>" + esc(m.why) + "</span></li>"; });
    html += "</ul><button class='btn' id='retry'>Retry missed questions</button>";
  }
  html += "<button class='btn" + (missed.length ? " alt" : "") + "' id='again'>Start over</button>";
  $("card").innerHTML = html;
  if (missed.length) { const m = missed.slice(); $("retry").addEventListener("click", () => start(m)); }
  $("again").addEventListener("click", () => start(ALL));
}

showBest();
start(ALL);
</script>
</body>
</html>
