<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 5 Work & Energy Quiz</title>
<style>
:root {
  --bg: #f6f7fb; --card: #ffffff; --ink: #1b2233; --muted: #5d667a; --line: #d5dae6;
  --accent: #1f3864; --accent-ink: #ffffff; --good: #1e7a3c; --good-bg: #e4f3e8;
  --bad: #b3261e; --bad-bg: #fbe9e7; --trap-bg: #fff5d6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151c; --card: #1b202b; --ink: #e8ebf2; --muted: #a2abbd; --line: #343b4a;
    --accent: #9db8ee; --accent-ink: #12151c; --good: #7fd69a; --good-bg: #173322;
    --bad: #ff9c92; --bad-bg: #3a1c1a; --trap-bg: #3a3216;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 1.6rem; line-height: 1.2; margin: 8px 0; text-wrap: balance; }
h2 { font-size: 1.15rem; margin: 0 0 12px; }
a { color: var(--accent); }
.crumb, .lede, .meta { color: var(--muted); }
.crumb { font-size: .9rem; margin: 0; }
.lede { margin: 0 0 20px; }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 8px 0 16px; }
.bar > div { height: 100%; background: var(--accent); transition: width .2s; }
.meta { display: flex; justify-content: space-between; font-size: .9rem; font-variant-numeric: tabular-nums; }
.q { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
.q p.stem { font-size: 1.1rem; font-weight: 600; margin: 0 0 16px; }
.choices { display: grid; gap: 10px; }
button { font: inherit; color: inherit; cursor: pointer; }
.choice { text-align: left; background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px; min-height: 48px; }
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice:focus-visible, .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.choice:disabled { cursor: default; }
.choice.right { border-color: var(--good); background: var(--good-bg); }
.choice.wrong { border-color: var(--bad); background: var(--bad-bg); }
.choice .tag { font-weight: 700; margin-right: 6px; }
.fb { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 14px; }
.fb .verdict { font-weight: 700; margin: 0 0 6px; }
.fb .verdict.ok { color: var(--good); }
.fb .verdict.no { color: var(--bad); }
.fb p { margin: 0 0 10px; }
.trap { background: var(--trap-bg); border-radius: 8px; padding: 10px 12px; font-size: .95rem; }
.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 12px 20px; font-weight: 600; min-height: 48px; }
.btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.score { font-size: 2.4rem; font-weight: 700; margin: 0; font-variant-numeric: tabular-nums; }
.missed { padding-left: 20px; }
.missed li { margin-bottom: 10px; }
.cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.card { display: grid; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; text-decoration: none; color: var(--ink); }
.card:hover { border-color: var(--accent); }
.card .n, .card span { color: var(--muted); font-size: .9rem; }
.card strong { font-size: 1.15rem; }
</style>
</head>
<body>
<main>
  <p class="crumb"><a href="../../index.html">All quizzes</a> · Unit 5</p>
  <h1>Work & Energy: most-missed questions</h1>
  <p class="lede">10 questions built on the ideas students most often get wrong. Pick an answer to see why it is right or wrong. Aim for 80% or higher.</p>
  <div id="app"></div>
  <noscript>This quiz needs JavaScript. The same questions are listed in this unit's README.</noscript>
</main>
<script>
const QUIZ = {"id":"05-work-and-energy","title":"Work & Energy","num":5,"questions":[{"q":"A waiter carries a heavy tray across a level floor at constant velocity. How much work does the upward force of the waiter's hand do on the tray?","c":["A large amount, because the tray is heavy","Zero, because the force is perpendicular to the motion","An amount equal to the tray's weight times the distance","Negative work"],"a":1,"why":"Work = Fd cos θ. The supporting force is vertical and the displacement is horizontal, so θ = 90° and cos 90° = 0.","trap":"Equating effort or tiredness with work."},{"q":"A car's speed doubles. Its kinetic energy becomes…","c":["twice as large","three times as large","four times as large","eight times as large"],"a":2,"why":"KE = ½mv². Speed is squared, so doubling v multiplies KE by 2² = 4.","trap":"Assuming kinetic energy is directly proportional to speed."},{"q":"A light ball and a heavy ball start from rest at the same height and roll down frictionless ramps of different shapes. At the bottom…","c":["the heavy ball is faster","the ball on the steeper ramp is faster","they have the same speed","the light ball is faster"],"a":2,"why":"mgh = ½mv² gives v = √(2gh). Mass cancels and the path does not appear, so only the height matters.","trap":"Thinking mass or ramp steepness changes the final speed."},{"q":"At the lowest point of a pendulum's swing, the bob has…","c":["maximum potential energy and zero kinetic energy","maximum kinetic energy and minimum potential energy","equal kinetic and potential energy","zero total energy"],"a":1,"why":"The bob is at its lowest height (least PE) and moving fastest (most KE). The energy stored at the top of the swing has become kinetic energy.","trap":"Reversing where the bob is fastest."},{"q":"A ball is thrown straight up. Ignoring air resistance, its total mechanical energy at the top of its path is…","c":["zero, because it has stopped","less than at launch","the same as at launch","greater than at launch"],"a":2,"why":"Kinetic energy has been converted to gravitational potential energy, but the total is unchanged. Only the form of the energy is different.","trap":"Thinking energy disappears when the object stops moving."},{"q":"A box slides across a rough floor and comes to rest. What happened to its kinetic energy?","c":["It was destroyed","It became gravitational potential energy","It was transformed into thermal energy","It is stored in the box as kinetic energy"],"a":2,"why":"Friction transforms kinetic energy into thermal energy; the box and floor warm slightly. Energy is never destroyed.","trap":"Saying energy is \"lost\" or \"used up\"."},{"q":"A weightlifter holds a 100 kg barbell motionless above their head for 5 seconds. How much work is done on the barbell during those 5 seconds?","c":["4900 J","980 J","500 J","0 J"],"a":3,"why":"There is no displacement, so W = Fd = 0. The lifter's muscles use chemical energy, but no work is done on the barbell.","trap":"Counting force alone, without displacement, as work."},{"q":"Two students lift identical boxes to the same shelf. Alex takes 2 s and Blake takes 4 s. Compared with Blake, Alex…","c":["does more work and uses more power","does the same work with more power","does the same work with the same power","does less work with more power"],"a":1,"why":"Work = mgh is the same for both. Power = work ÷ time, so finishing in half the time takes twice the power.","trap":"Mixing up power and work."},{"q":"A 2.0 kg ball is dropped from a height of 5.0 m. Ignoring air resistance, how fast is it moving just before it hits the ground? (g = 9.8 m/s²)","c":["4.9 m/s","9.9 m/s","49 m/s","98 m/s"],"a":1,"why":"mgh = ½mv², so v = √(2gh) = √(2 × 9.8 × 5.0) = √98 = 9.9 m/s. The mass cancels.","trap":"Forgetting the square root, or stopping at mgh = 98 J."},{"q":"A car travelling at 30 m/s needs 60 m to brake to a stop. With the same braking force, how far does it need at 60 m/s?","c":["60 m","120 m","180 m","240 m"],"a":3,"why":"Braking work = F × d must remove all the kinetic energy. Doubling the speed gives four times the kinetic energy, so four times the distance: 240 m.","trap":"Doubling the distance because the speed doubled."}]};
(function () {
  var app = document.getElementById('app');
  var KEY = 'physics-quiz-best-' + QUIZ.id;
  var order, pos, right, missed, answered;

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function best() { try { return Number(localStorage.getItem(KEY)) || 0; } catch (e) { return 0; } }
  function saveBest(p) { try { if (p > best()) localStorage.setItem(KEY, String(p)); } catch (e) { /* storage unavailable */ } }

  function start(indices) {
    order = shuffle(indices.slice());
    pos = 0; right = 0; missed = [];
    show();
  }

  function show() {
    answered = false;
    var qi = order[pos], q = QUIZ.questions[qi];
    app.innerHTML = '';
    var meta = el('div', 'meta');
    meta.appendChild(el('span', '', 'Question ' + (pos + 1) + ' of ' + order.length));
    meta.appendChild(el('span', '', 'Correct so far: ' + right));
    app.appendChild(meta);
    var bar = el('div', 'bar'), fill = el('div');
    fill.style.width = (100 * pos / order.length) + '%';
    bar.appendChild(fill); app.appendChild(bar);

    var card = el('section', 'q');
    card.appendChild(el('p', 'stem', q.q));
    var list = el('div', 'choices');
    var opts = shuffle(q.c.map(function (text, i) { return { text: text, ok: i === q.a }; }));
    var fb = el('div', 'fb'); fb.hidden = true; fb.setAttribute('aria-live', 'polite');
    opts.forEach(function (o, i) {
      var b = el('button', 'choice');
      b.type = 'button';
      b.appendChild(el('span', 'tag', String.fromCharCode(65 + i) + '.'));
      b.appendChild(document.createTextNode(o.text));
      b.addEventListener('click', function () {
        if (answered) return;
        answered = true;
        Array.prototype.forEach.call(list.children, function (c, k) {
          c.disabled = true;
          if (opts[k].ok) c.classList.add('right');
        });
        if (o.ok) { right++; } else { b.classList.add('wrong'); missed.push(qi); }
        fb.hidden = false;
        fb.appendChild(el('p', 'verdict ' + (o.ok ? 'ok' : 'no'), o.ok ? 'Correct.' : 'Not quite.'));
        fb.appendChild(el('p', '', q.why));
        var trap = el('p', 'trap');
        trap.appendChild(el('strong', '', 'Common mistake: '));
        trap.appendChild(document.createTextNode(q.trap));
        fb.appendChild(trap);
        var next = el('button', 'btn', pos + 1 < order.length ? 'Next question' : 'See results');
        next.type = 'button';
        next.addEventListener('click', function () { pos++; if (pos < order.length) show(); else results(); });
        var act = el('div', 'actions'); act.appendChild(next); fb.appendChild(act);
        next.focus();
      });
      list.appendChild(b);
    });
    card.appendChild(list); card.appendChild(fb); app.appendChild(card);
  }

  function results() {
    var pct = Math.round(100 * right / order.length);
    var full = order.length === QUIZ.questions.length;
    if (full) saveBest(pct);
    app.innerHTML = '';
    var card = el('section', 'q');
    card.appendChild(el('h2', '', full ? 'Your result' : 'Retry result'));
    card.appendChild(el('p', 'score', right + ' / ' + order.length + ' (' + pct + '%)'));
    var msg = pct >= 80 ? 'At or above the 80% goal. Explain each answer aloud to make it stick.'
      : pct >= 60 ? 'Getting there. Reread the notes sections for the questions below, then retry them.'
      : 'These ideas trip up most students at first. Go back through the Cornell notes cue questions, then retry.';
    card.appendChild(el('p', '', msg));
    if (full && best()) card.appendChild(el('p', 'meta', 'Best full-quiz score on this device: ' + best() + '%'));
    if (missed.length) {
      card.appendChild(el('h2', '', 'Review these'));
      var ul = el('ol', 'missed');
      missed.forEach(function (qi) {
        var q = QUIZ.questions[qi], li = el('li');
        li.appendChild(el('strong', '', q.q));
        li.appendChild(el('div', '', 'Answer: ' + q.c[q.a]));
        li.appendChild(el('div', 'meta', q.why));
        ul.appendChild(li);
      });
      card.appendChild(ul);
    }
    var act = el('div', 'actions');
    if (missed.length) {
      var r = el('button', 'btn', 'Retry missed questions (' + missed.length + ')');
      r.type = 'button'; var m = missed.slice();
      r.addEventListener('click', function () { start(m); });
      act.appendChild(r);
    }
    var again = el('button', 'btn ghost', 'Start over');
    again.type = 'button';
    again.addEventListener('click', function () { start(QUIZ.questions.map(function (_, i) { return i; })); });
    act.appendChild(again);
    card.appendChild(act); app.appendChild(card);
  }

  start(QUIZ.questions.map(function (_, i) { return i; }));
})();
</script>
</body>
</html>
