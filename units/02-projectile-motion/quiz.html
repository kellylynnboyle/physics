<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projectile Motion Quiz — Most Missed Questions</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; background: #f7f7fb; color: #1a1a2e; line-height: 1.5; }
  h1 { font-size: 1.5rem; }
  p.sub { color: #555; margin-top: -0.5rem; }
  .question { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; }
  .question h3 { margin-top: 0; }
  label { display: block; padding: 0.4rem 0.6rem; margin: 0.3rem 0; border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
  label:hover { background: #eef1ff; }
  .feedback { margin-top: 0.6rem; padding: 0.6rem 0.8rem; border-radius: 6px; display: none; font-size: 0.95rem; }
  .feedback.correct { background: #e3f7e9; border: 1px solid #79c99e; display: block; }
  .feedback.incorrect { background: #fdeaea; border: 1px solid #e08a8a; display: block; }
  button { background: #3949ab; color: #fff; border: none; padding: 0.7rem 1.4rem; border-radius: 8px; font-size: 1rem; cursor: pointer; }
  button:hover { background: #2c3785; }
  #score { font-size: 1.2rem; font-weight: bold; margin-top: 1rem; }
  .locked label { cursor: default; }
  .locked input { pointer-events: none; }
</style>
</head>
<body>

<h1>Projectile Motion — Most Missed Questions</h1>
<p class="sub">These questions target the conceptual traps students hit most often on this topic. Answer, then click "Check Answers" — explanations appear below each question.</p>

<form id="quiz"></form>
<button onclick="grade()">Check Answers</button>
<div id="score"></div>

<script>
const QUESTIONS = [
  {
    q: "A projectile is launched at an angle above the horizontal. Ignoring air resistance, what happens to its horizontal velocity while it is in the air?",
    options: [
      "It steadily decreases to zero at the peak, then increases again on the way down.",
      "It stays constant the entire flight.",
      "It increases the entire flight because gravity speeds up all motion.",
      "It decreases the whole way up and stays at zero once the projectile starts falling."
    ],
    correct: 1,
    explain: "Gravity acts only vertically, so there is no horizontal acceleration (ignoring air resistance). Horizontal velocity is set at launch (vₓ₀ = v₀cosθ) and never changes — not at the peak, not on the way down. Only the vertical component changes during flight."
  },
  {
    q: "At the very top of a projectile's trajectory, which statement about its velocity is correct?",
    options: [
      "Velocity is entirely zero — the object momentarily stops completely.",
      "Vertical velocity is zero; horizontal velocity is unchanged from launch.",
      "Horizontal velocity is zero; vertical velocity is unchanged from launch.",
      "Both components are at their maximum values."
    ],
    correct: 1,
    explain: "Only the vertical velocity component reaches zero at the peak (that's the definition of maximum height — the object stops moving up before gravity pulls it back down). The horizontal component, vₓ₀, is completely unaffected and keeps carrying the object forward at the same speed it had at launch."
  },
  {
    q: "Two balls are launched from the same height with the same launch angle, but Ball A has a higher initial speed than Ball B. Compared to Ball B, how does Ball A's time of flight change?",
    options: [
      "Ball A stays in the air longer because it moves faster horizontally.",
      "Ball A stays in the air longer only because of its extra horizontal speed.",
      "Ball A's time of flight is longer because its initial vertical velocity component is also larger.",
      "Both balls have identical times of flight regardless of speed."
    ],
    correct: 2,
    explain: "Time of flight is controlled entirely by the vertical motion — initial vertical velocity (vy₀ = v₀sinθ) and the launch/landing height. Since Ball A's v₀ is larger at the same angle, its vy₀ is also larger, giving it more time in the air. But the reason is the larger vertical component, not the horizontal speed — horizontal speed by itself has zero effect on time of flight."
  },
  {
    q: "A stone is thrown horizontally off a cliff at the same instant an identical stone is simply dropped from the same height. Which one hits the ground first?",
    options: [
      "The thrown stone, because its extra speed makes it fall faster.",
      "The dropped stone, because it has no horizontal motion to \"slow down\" its fall.",
      "They hit the ground at the same time.",
      "It depends on how fast the thrown stone was launched."
    ],
    correct: 2,
    explain: "Both stones have the same initial vertical velocity (zero) and fall from the same height under the same vertical acceleration, −g. Horizontal velocity has no bearing on vertical motion, so the two stones land at exactly the same time — even though the thrown one travels much farther horizontally before it does."
  },
  {
    q: "A projectile is launched on level ground at 30° above horizontal. At what other launch angle (same speed) would it achieve the same range?",
    options: [
      "15°, because it's half of 30°",
      "60°, because 30° and 60° are complementary angles",
      "75°, because it's the complement of 15°",
      "There is no other angle that gives the same range."
    ],
    correct: 1,
    explain: "On level ground, R = v₀²sin(2θ)/g. Since sin(2θ) = sin(180° − 2θ), any two angles that add up to 90° (complementary angles) give the same sin(2θ) and therefore the same range. 30° and 60° are complementary, so they share the same range — though 60° stays in the air longer and reaches a greater height."
  },
  {
    q: "A ball is launched at 15 m/s at 40° above horizontal from the edge of a rooftop, landing on the ground 20 m below the launch point. Which approach correctly finds the time of flight?",
    options: [
      "Plug directly into R = v₀²sin(2θ)/g to get the range, then find time from that.",
      "Set up the vertical position equation y = y₀ + vy₀t − ½gt² with y₀ = 20 m above the ground and y = 0, then solve for t.",
      "Use the level-ground time-of-flight shortcut, t = 2vy₀/g, since only the vertical component matters.",
      "Assume the ball takes the same time as one launched from level ground at the same angle and speed."
    ],
    correct: 1,
    explain: "The level-ground formulas for range and time of flight (R = v₀²sin(2θ)/g and t = 2vy₀/g) are derived assuming the launch and landing heights are equal. Here they are not equal — the ball lands 20 m below where it was launched — so those shortcuts don't apply. The correct method is to write the vertical position equation with the actual launch height included and solve the resulting quadratic for t."
  }
];

const form = document.getElementById('quiz');
QUESTIONS.forEach((item, i) => {
  const div = document.createElement('div');
  div.className = 'question';
  div.innerHTML = `<h3>Q${i+1}. ${item.q}</h3>` +
    item.options.map((opt, j) => `
      <label><input type="radio" name="q${i}" value="${j}"> ${opt}</label>
    `).join('') +
    `<div class="feedback" id="fb${i}"></div>`;
  form.appendChild(div);
});

function grade() {
  let score = 0;
  QUESTIONS.forEach((item, i) => {
    const selected = form.querySelector(`input[name="q${i}"]:checked`);
    const fb = document.getElementById(`fb${i}`);
    form.querySelectorAll(`input[name="q${i}"]`).forEach(inp => inp.closest('.question').classList.add('locked'));
    if (!selected) {
      fb.className = 'feedback incorrect';
      fb.textContent = 'No answer selected. ' + item.explain;
      return;
    }
    const isCorrect = parseInt(selected.value) === item.correct;
    if (isCorrect) score++;
    fb.className = 'feedback ' + (isCorrect ? 'correct' : 'incorrect');
    fb.textContent = (isCorrect ? '✓ Correct. ' : '✗ Not quite. ') + item.explain;
  });
  document.getElementById('score').textContent = `Score: ${score} / ${QUESTIONS.length}` +
    (score / QUESTIONS.length >= 0.8 ? '  🎉 You cleared the 80% target!' : '  — review the explanations above and retake.');
}
</script>

</body>
</html>
